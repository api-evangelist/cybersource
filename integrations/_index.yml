  contract_reference:
    register: 'Firefox Add-ons (addons.mozilla.org public API v5 search: authors, homepage, support_url)'
    spec_file: null
    role: firefox-add-on-publisher
    registered_name: Cybersource
    register_id: https://addons.mozilla.org/api/v5/addons/addon/cybersource-virtual-terminal/
    matched_domain: cybersource.com
    matched_by: domain
    matched_name: Cybersource
    builder: publisher
    signal_note: ONE edge per provider for the store; listing alone = participation. The AMO author name (builder
      publisher) or homepage + support_url both on the provider's domain (builder domain-attested) identifies it;
