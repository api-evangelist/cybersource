                      readOnly: true
                      description: The detailed message related to the type.
    patch:
      summary: Update a Customer
      description: '|  |  |  |

        | --- | --- | --- |

        |**Customers**<br>A Customer represents your tokenized customer information.<br>You should associate the Customer Id with the customer account on your systems.<br>A Customer can have one or more [Payment Instruments](#token-management_customer-payment-instrument_create-a-customer-payment-instrumentl) or [Shipping Addresses](#token-management_customer-shipping-address_create-a-customer-shipping-address) with one allocated as the Customers default.|&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|**Updating a Customer**<br>Your system can use this API to update a Customers details including selecting a  [default Payment Instrument](#token-management_customer_update-a-customer_samplerequests-dropdown_update-customers-default-payment-instrument_liveconsole-tab-request-body) or [default Shipping Address](#token-management_customer_update-a-customer_samplerequests-dropdown_update-customers-default-shipping-address_liveconsole-tab-request-body) for use in payments.<br>Note: Updating a Customers [Payment Instrument](#token-management_customer-payment-instrument_update-a-customer-payment-instrument) or [Shipping Address](#token-management_customer-shipping-address_update-a-customer-shipping-address) details is performed using their own dedicated API resources.

        '
      parameters:
      - name: profile-id
        in: header
        description: The Id of a profile containing user specific TMS configuration.
        required: false
        type: string
        minLength: 36
        maxLength: 36
        x-hide-field: true
      - name: customerId
        in: path
        description: The Id of a Customer.
        required: true
        type: string
        minLength: 1
        maxLength: 32
      - name: if-match
        in: header
        description: Contains an ETag value from a GET request to make the request conditional.
        required: false
        type: string
        minLength: 1
        maxLength: 32
      - name: patchCustomerRequest
        in: body
        required: true
        schema:
          type: object
          properties:
            _links:
              type: object
              readOnly: true
              properties:
                self:
                  type: object
                  readOnly: true
                  properties:
                    href:
                      type: string
                      readOnly: true
                      description: 'Link to the Customer.

                        '
                      example: /tms/v2/customers/D9F340DD3DB9C276E053A2598D0A41A3
                paymentInstruments:
                  type: object
                  readOnly: true
                  properties:
                    href:
                      type: string
                      readOnly: true
                      description: 'Link to the Customers Payment Instruments.

                        '
                      example: /tms/v2/customers/D9F340DD3DB9C276E053A2598D0A41A3/payment-instruments
                shippingAddress:
                  type: object
                  readOnly: true
                  properties:
                    href:
                      type: string
                      readOnly: true
                      description: 'Link to the Customers Shipping Addresses.

                        '
                      example: /tms/v2/customers/D9F340DD3DB9C276E053A2598D0A41A3/shipping-addresses
            id:
              type: string
              minLength: 1
              maxLength: 32
              description: The Id of the Customer Token.
            objectInformation:
              type: object
              properties:
                title:
                  type: string
                  description: 'Name or title of the customer.

                    '
                  maxLength: 60
                comment:
                  type: string
                  description: 'Comments that you can make about the customer.

                    '
                  maxLength: 150
            buyerInformation:
              type: object
              properties:
                merchantCustomerID:
                  type: string
                  description: 'Your identifier for the customer.

                    '
                  maxLength: 100
                email:
                  type: string
                  maxLength: 255
                  description: 'Customer''s primary email address, including the full domain name.

                    '
            clientReferenceInformation:
              type: object
              properties:
                code:
                  type: string
                  description: 'Client-generated order reference or tracking number.

                    '
                  maxLength: 50
            merchantDefinedInformation:
              type: array
              description: 'Object containing the custom data that the merchant defines.

                '
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: 'The number you assign as the name for your merchant-defined data or secure field. Possible Values are data1 to data4 and sensitive1 to sensitive4


                      For example, to set the name for merchant-defined data 2 field, you would reference merchantDefinedInformation[x].name as data2

                      Possible Values:

                      - data1

                      - data2

                      - data3

                      - data4

                      - sensitive1

                      - sensitive2

                      - sensitive3

                      - sensitive4

                      '
                  value:
                    type: string
                    description: 'The value you assign for your merchant-defined data field.


                      **Warning** Merchant-defined data fields are not intended to and must not be used to capture personally identifying information. Accordingly, merchants are prohibited from capturing, obtaining, and/or transmitting any personally identifying information in or via the merchant-defined data fields. Personally identifying information includes, but is not

                      limited to, address, credit card number, social security number, driver''s license number, state-issued identification number, passport number, and card verification numbers (CVV,

                      CVC2, CVV2, CID, CVN). In the event it is discovered a merchant is capturing and/or transmitting personally identifying information via the merchant-defined data fields, whether or not intentionally, the merchant''s account will immediately be suspended, which will result in a rejection of any and all transaction requests submitted by the merchant after the point of suspension.

                      '
                    maxLength: 100
            defaultPaymentInstrument:
              type: object
              properties:
                id:
                  type: string
                  description: 'The Id of the Customers default Payment Instrument

                    '
            defaultShippingAddress:
              type: object
              properties:
                id:
                  type: string
                  description: 'The Id of the Customers default Shipping Address

                    '
