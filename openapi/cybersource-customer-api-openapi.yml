                    '
            _embedded:
              type: object
              readOnly: true
              description: 'Additional resources for the Customer.

                '
              properties:
                defaultPaymentInstrument:
                  readOnly: true
                  type: object
                  properties:
                    _links:
                      type: object
                      readOnly: true
