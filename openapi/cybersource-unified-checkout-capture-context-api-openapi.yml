        example0:
          summary: Generate Unified Checkout Capture Context
          value:
            clientVersion: '0.34'
            targetOrigins:
            - https://yourCheckoutPage.com
            allowedCardNetworks:
            - VISA
            - MASTERCARD
            - AMEX
            allowedPaymentTypes:
            - APPLEPAY
            - CHECK
            - CLICKTOPAY
            - GOOGLEPAY
            - PANENTRY
            - PAZE
            country: US
            locale: en_US
            captureMandate:
              billingType: FULL
              requestEmail: true
              requestPhone: true
              requestShipping: true
              shipToCountries:
              - US
