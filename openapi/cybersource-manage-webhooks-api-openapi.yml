  /kms/egress/v2/keys-asym:
    post:
      tags:
      - Manage Webhooks
      summary: Message Level Encryption
      description: 'Store and manage certificates that will be used to preform Message Level Encryption (MLE).

        Each new webhook will need its own unique asymmetric certificate.

        You can either use a digital certificate issued/signed by a CA or self-sign your own using the documentation available on the Developer Guide.

        '
      operationId: saveAsymEgressKey
      parameters:
      - name: v-c-correlation-id
        in: header
        description: A globally unique id associated with your request
        type: string
        pattern: ^[A-Za-z0-9\.\-_:]+$
        minLength: 2
        maxLength: 100
      - name: v-c-sender-organization-id
        in: header
        description: Sender organization id
        type: string
        pattern: ^[A-Za-z0-9\-_]+$
        minLength: 2
        maxLength: 100
      - name: v-c-permissions
        in: header
        description: Encoded user permissions returned by the CGK, for the entity user who initiated the boarding
        type: string
      - name: SaveAsymEgressKey
        in: body
        description: Provide egress Asymmetric key information to save (create or store)
        required: true
        schema:
          type: object
          properties:
            clientReferenceInformation:
              type: object
              description: Object for client references.
              properties:
                code:
                  type: string
                  maxLength: 50
                  description: 'Client generated order reference or tracking number. CyberSource recommends that you send a unique value for each

                    transaction so that you can perform meaningful searches for the transaction.

                    '
            clientRequestAction:
              type: string
              description: 'Client request action.

                '
            keyInformation:
              type: object
              description: 'Egress Asymmetric  Key Information Request

                '
              properties:
                provider:
                  type: string
                  description: 'Provider name

                    '
                tenant:
                  type: string
                  description: 'Tenant name

                    '
                keyType:
                  type: string
                  description: 'Type of the key

                    '
                organizationId:
                  type: string
                  description: 'Organization Id

                    '
                pub:
                  type: string
                  description: 'Public certificate with only base64 encoded payload and not the header (BEGIN CERTIFICATE) and footer (END CERTIFICATE)

                    '
                keyId:
                  type: string
                  description: 'Key Serial Number

                    '
                pvt:
                  type: string
                  description: 'Private certificate with only base64 encoded payload and not header (BEGIN CERTIFICATE) and footer (END CERTIFICATE)

                    '
                status:
                  type: string
                  description: 'The status of the key

                    '
                expiryDuration:
                  type: string
                  description: 'Key expiry duration in days

                    '
      produces:
      - application/json;charset=utf-8
      consumes:
      - application/json;charset=utf-8
      responses:
        '201':
          description: Successful Response
          schema:
            type: object
            description: 'Egress Asymmetric Key Information Response.

              '
            properties:
              submitTimeUtc:
                type: string
                description: 'Time of request in UTC. Format: `YYYY-MM-DDThh:mm:ssZ`

                  Example `2016-08-11T22:47:57Z` equals August 11, 2016, at 22:47:57 (10:47:57 p.m.). The `T` separates the date and the

                  time. The `Z` indicates UTC.

                  '
              status:
                type: string
                description: "The status of the submitted transaction.\nPossible values:\n - ACCEPTED\n"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized Request
        '502':
          description: Unexpected system error or system timeout
      x-example:
        example0:
          summary: Create Asymmetric Key
          value:
            clientRequestAction: STORE
            keyInformation:
              provider: <INSERT ORGANIZATION ID HERE>
              tenant: nrtd
              keyType: publickey
              organizationId: <INSERT ORGANIZATION ID HERE>
              pub: 
              expiryDuration: '365'
