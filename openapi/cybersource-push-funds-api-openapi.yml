                      - CONTACT_PROCESSOR

                      - INVALID_MERCHANT_CONFIGURATION

                      - STOLEN_LOST_CARD

                      - PROCESSOR_DECLINED

                      - PARTIAL_APPROVAL

                      - PAYMENT_REFUSED

                      - INVALID_ACCOUNT

