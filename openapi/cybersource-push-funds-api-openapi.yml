                          ISO Standard Alpha Country Code.


                          https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf

                          '
              errorInformation:
                type: object
                properties:
                  reason:
                    type: string
                    maxLength: 31
                    description: 'The reason of the status.


