                      - EXCEEDS_CREDIT_LIMIT

                      - DEBIT_CARD_USAGE_LIMIT_EXCEEDED

                      - CVN_NOT_MATCH

                      - DUPLICATE_REQUEST

                      - GENERAL_DECLINE

                      - BLACKLISTED_CUSTOMER

                      - GATEWAY_TIMEOUT

                      - INVALID_DATA

                      - SYSTEM_ERROR

                      - SERVICE_UNAVAILABLE

                      - GATEWAY_TIMEOUT

                      - DAGGREJECTED

                      - DAGGDENIED

                      - DSYSREJECTED

                      '
                  message:
                    type: string
                    maxLength: 256
                    description: 'The detail message related to the status and reason listed above.

                      '
                  details:
                    type: array
                    items:
                      type: object
                      properties:
