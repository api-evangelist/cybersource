                  multiProcessorRouting:
                    type: array
                    description: An array of object that contains the list of acquirer response codes & reasons if a transaction is routed to multiple acquirers.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          maxLength: 30
