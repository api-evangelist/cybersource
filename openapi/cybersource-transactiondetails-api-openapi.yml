                      '
                  paymentAccountReferenceNumber:
                    type: string
                    maxLength: 29
                    description: 'Payment Account Reference (PAR) is a non-financial reference assigned to each unique payment account and used to link a payment account to associated network tokens, i.e. the same PAR is returned for PAN-based and tokenized transactions, such as from digital wallets. PAR can be returned in authorisation responses for requests initiated with both real PANs and tokenized PANs. PAR can be used by merchants for fraud detection and regulatory compliance across different channels and digital wallets. PAR allows all participants in the payments chain to have a single, non-sensitive value assigned to a consumer. This value can be used in place of sensitive card holder identification fields, and transmitted across the payments ecosystem to facilitate card holder identification.


                      **Note** On CyberSource through VisaNet, the value for this field corresponds to the following data in the TC 33 capture file:

                      - Record: CP01 TCR8

                      - Position: 79-110

                      - Field: Payment Account Reference


                      The TC 33 Capture file contains information about the purchases and refunds that a merchant submits to CyberSource.

                      CyberSource through VisaNet creates the TC 33 Capture file at the end of the day and sends it to the merchant''s acquirer,

                      who uses this information to facilitate end-of-day clearing processing with payment networks.

