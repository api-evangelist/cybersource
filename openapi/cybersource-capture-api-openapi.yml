                        type: string
                        maxLength: 1
                        description: "Flag to indicate how you handle discount at the line item level.\n\n - 0: no line level discount provided\n - 1: tax was calculated on the post-discount line item total\n - 2: tax was calculated on the pre-discount line item total\n\n`Note` Visa will inset 0 (zero) if an invalid value is included in this field.\n\nThis field relates to the value in the _lineItems[].discountAmount_ field.\n"
                      taxStatusIndicator:
                        type: string
                        maxLength: 1
                        description: "Flag to indicate whether tax is exempted or not included.\n\n - 0: tax not included\n - 1: tax included\n - 2: transaction is not subject to tax\n"
                      taxTypeCode:
                        type: string
                        maxLength: 4
                        description: 'Type of tax being applied to the item.


                          #### FDC Nashville Global

                          - `alternate_tax_type_applied`

                          - `alternate_tax_type_identifier`


                          #### Worldpay VAP

                          - `alternate_tax_type_identifier`


                          #### RBS WorldPay Atlanta

                          - `tax_type_applied`


                          #### TSYS Acquiring Solutions

                          - `tax_type_applied`

                          - `local_tax_indicator`


                          #### Chase Paymentech Solutions

                          - `tax_type_applied`


                          #### Elavon Americas

                          - `local_tax_indicator`


                          #### FDC Compass

                          - `tax_type_applied`


                          #### OmniPay Direct

                          - `local_tax_indicator`

                          '
                      amountIncludesTax:
                        type: boolean
                        description: "Flag that indicates whether the tax amount is included in the Line Item Total.\n\nPossible values:\n - **true**\n - **false**\n"
                      typeOfSupply:
                        type: string
                        maxLength: 2
                        description: "Flag to indicate whether the purchase is categorized as goods or services.\nPossible values:\n\n - 00: goods\n - 01: services\n"
                      commodityCode:
                        type: string
                        maxLength: 15
                        description: 'Commodity code or International description code used to classify the item. Contact your acquirer for a list of

                          codes.

                          '
                      discountAmount:
                        type: string
                        maxLength: 13
                        description: Discount applied to the item.
                      discountApplied:
                        type: boolean
                        description: "Flag that indicates whether the amount is discounted.\n\nIf you do not provide a value but you set Discount Amount to a value greater than zero, then CyberSource sets\nthis field to **true**.\n\nPossible values:\n - **true**\n - **false**\n"
                      discountRate:
                        type: string
                        maxLength: 6
                        description: 'Rate the item is discounted. Maximum of 2 decimal places.


                          Example 5.25 (=5.25%)

                          '
                      invoiceNumber:
                        type: string
                        maxLength: 23
                        description: 'Field to support an invoice number for a transaction. You must specify the number of line items that will

                          include an invoice number. By default, the first line item will include an invoice number field. The invoice

                          number field can be included for up to 10 line items.

                          '
                      taxDetails:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: 'Indicates the type of tax data for the _taxDetails_ object.


                                Possible values:


                                - `alternate`

                                - `local`

                                - `national`

                                - `vat`

                                - `other`

                                - `green`

                                '
                            amount:
                              type: string
                              maxLength: 13
                              description: 'Indicates the amount of tax based on the `type` field as described in the table below:


                                | type      | type description |

                                | ------------- |:-------------:|

                                | `alternate` | Total amount of alternate tax for the order. |

                                | `local`     | Sales tax for the order. |

                                | `national`  | National tax for the order. |

                                | `vat`       | Total amount of value added tax (VAT) included in the order. |

                                | `other`     | Other tax. |

                                | `green`     | Green tax amount for Korean Processing. |

                                '
                            rate:
                              type: string
                              maxLength: 6
                              description: 'Rate of VAT or other tax for the order.


                                Example 0.040 (=4%)


                                Valid range: 0.01 to 0.99 (1% to 99%, with only whole percentage values accepted; values with additional

                                decimal places will be truncated)

                                '
                            code:
                              type: string
                              maxLength: 4
                              description: 'Type of tax being applied to the item.


                                #### FDC Nashville Global

                                - `alternate_tax_type_applied`

                                - `alternate_tax_type_identifier`


                                #### Worldpay VAP

                                - `alternate_tax_type_identifier`


                                #### RBS WorldPay Atlanta

                                - `tax_type_applied`


                                #### TSYS Acquiring Solutions

                                - `tax_type_applied`

                                - `local_tax_indicator`


                                #### Chase Paymentech Solutions

                                - `tax_type_applied`


                                #### Elavon Americas

                                - `local_tax_indicator`


                                #### FDC Compass

                                - `tax_type_applied`


                                #### OmniPay Direct

                                - `local_tax_indicator`

                                '
                            taxId:
                              type: string
                              maxLength: 15
                              description: 'Your tax ID number to use for the alternate tax amount. Required if you set alternate tax amount to any value,

                                including zero. You may send this field without sending alternate tax amount.

                                '
                            applied:
                              type: boolean
                              description: 'Flag that indicates whether the alternate tax amount (`orderInformation.amountDetails.taxDetails[].amount`) is

                                included in the request.


                                Possible values:

                                - `false`: alternate tax amount is not included in the request.

                                - `true`: alternate tax amount is included in the request.

                                '
                            exemptionCode:
                              type: string
                              maxLength: 1
                              description: 'Status code for exemption from sales and use tax. This field is a pass-through, which means that

                                CyberSource does not verify the value or modify it in any way before sending it to the processor.

                                '
                      fulfillmentType:
                        type: string
                        description: 'Information about the product code used for the line item.

                          Possible values:

                          - `E`: The product code is `electronic_software`.

                          - `P`: The product code is not `electronic_software`.


                          For details, see the `fulfillmentType` field description in [Business Center Reporting User Guide.]

                          (https://apps.cybersource.com/library/documentation/dev_guides/reporting_and_reconciliation/Reporting_User/html/)

                          '
                      weight:
                        type: string
                        maxLength: 9
                        description: 'Weight of the item.

                          '
                      weightIdentifier:
                        type: string
                        maxLength: 1
                        description: 'Type of weight.


                          Possible values:

                          - B: Billed weight

                          - N: Actual net weight

                          '
                      weightUnit:
                        type: string
                        maxLength: 2
                        description: 'Code that specifies the unit of measurement for the weight amount. For example, `OZ` specifies ounce and `LB` specifies pound. The possible values are defined by the ANSI Accredited Standards Committee (ASC).

                          '
                      referenceDataCode:
                        type: string
                        maxLength: 150
                        description: 'Code that identifies the value of the corresponding `orderInformation.lineItems[].referenceDataNumber` field.


                          Possible values:

                          - AN: Client-defined asset code

                          - MG: Manufacturer''s part number

                          - PO: Purchase order number

                          - SK: Supplier stock keeping unit number

                          - UP: Universal product code

                          - VC: Supplier catalog number

                          - VP: Vendor part number


                          This field is a pass-through, which means that CyberSource does not verify the value or modify it in any way

                          before sending it to the processor.

                          '
                      referenceDataNumber:
                        type: string
                        maxLength: 30
                        description: 'Reference number.


                          The meaning of this value is identified by the value of the corresponding `referenceDataCode` field.

                          See Numbered Elements.


                          The maximum length for this field depends on the value of the corresponding `referenceDataCode` field:

                          - When the code is `PO`, the maximum length for the reference number is 22.

                          - When the code is `VC`, the maximum length for the reference number is 20.

                          - For all other codes, the maximum length for the reference number is 30.


                          This field is a pass-through, which means that CyberSource does not verify the value or modify it in any way

                          before sending it to the processor.

                          '
                      unitTaxAmount:
                        type: string
                        maxLength: 15
                        description: 'Per-item tax amount of the product.

                          Note The amount value must be a non-negative number containing 2 decimal places and limited to 7 digits before the decimal point.

                          '
                      measurement:
                        type: string
                        maxLength: 10
                        description: 'This field would contain measurement of a line item.

                          '
                      productDescription:
                        type: string
                        description: Brief description of item.
                      giftCardCurrency:
                        type: integer
                        maxLength: 3
                        description: 'When `orderInformation.lineItems[].productCode` is "gift_card", this is the

                          currency used for the gift card purchase.


                          For the possible values, see the [ISO Standard Currency Codes.](http://apps.cybersource.com/library/documentation/sbc/quickref/currencies.pdf)

                          '
                      shippingDestinationTypes:
                        type: string
                        maxLength: 50
                        description: 'Destination to where the item will be shipped. Example: Commercial, Residential, Store

                          '
                      gift:
                        type: boolean
                        description: 'This field is only used in DM service.


                          Determines whether to assign risk to the order if the billing and shipping addresses specify different cities,

                          states, or countries. This field can contain one of the following values:

                          - true: Orders are assigned only slight additional risk if billing and shipping addresses are different.

                          - false: Orders are assigned higher additional risk if billing and shipping addresses are different.

                          '
                      passenger:
                        type: object
                        description: Contains travel-related passenger details used by DM service only.
                        properties:
                          type:
                            type: string
                            maxLength: 32
                            description: 'Passenger classification associated with the price of the ticket. You can use one of the following values:

                              - `ADT`: Adult

                              - `CNN`: Child

                              - `INF`: Infant

                              - `YTH`: Youth

                              - `STU`: Student

                              - `SCR`: Senior Citizen

                              - `MIL`: Military

                              '
                          status:
                            type: string
                            maxLength: 32
                            description: 'Your company''s passenger classification, such as with a frequent flyer program. In this case, you might use

                              values such as `standard`, `gold`, or `platinum`.

                              '
                          phone:
                            type: string
                            maxLength: 15
                            description: 'Passenger''s phone number. If the order is from outside the U.S., CyberSource recommends that you include

                              the [ISO Standard Country Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf).

                              '
                          firstName:
                            type: string
                            maxLength: 60
                            description: Passenger's first name.
                          lastName:
                            type: string
                            maxLength: 60
                            description: Passenger's last name.
                          id:
                            type: string
                            maxLength: 40
                            description: 'ID of the passenger to whom the ticket was issued. For example, you can use this field for the frequent flyer

                              number.

                              '
                          email:
                            type: string
                            maxLength: 255
                            description: Passenger's email address, including the full domain name, such as jdoe@example.com.
                          nationality:
                            type: string
                            maxLength: 2
                            description: Passenger's nationality country. Use the two character [ISO Standard Country Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf).
                      allowedExportCountries:
                        type: array
                        items:
                          type: string
                          description: 'Comma-separated list of ISO country codes for countries to which the product can be exported.


                            If country codes are not specified, or if this field is not included, the U.S. government''s country

                            code list is used.


                            **Note** The default list of countries restricted by the U.S. always applies. Any country not

                            specifically added to the export field is considered restricted.

                            '
                      restrictedExportCountries:
                        type: array
                        items:
                          type: string
                          description: 'Comma-separated list of ISO country codes for countries to which the product cannot be exported.


                            **Note** If the export field is also present, the content of the `restrictedExportCountries`

                            field overrides the content of export.

                            '
                invoiceDetails:
                  type: object
                  properties:
                    purchaseOrderNumber:
                      type: string
                      maxLength: 50
                      description: 'Value used by your customer to identify the order. This value is typically a purchase order number. CyberSource

                        recommends that you do not populate the field with all zeros or nines.

                        '
                    purchaseOrderDate:
                      type: string
                      maxLength: 10
                      description: 'Date the order was processed. `Format: YYYY-MM-DD`.

                        '
                    purchaseContactName:
                      type: string
                      maxLength: 36
                      description: 'The name of the individual or the company contacted for company authorized purchases.

                        '
                    taxable:
                      type: boolean
                      description: "Flag that indicates whether an order is taxable. This value must be true if the sum of all _lineItems[].taxAmount_ values > 0.\n\nIf you do not include any `lineItems[].taxAmount` values in your request, CyberSource does not include\n`invoiceDetails.taxable` in the data it sends to the processor.\n\nPossible values:\n - **true**\n - **false**\n"
                    vatInvoiceReferenceNumber:
                      type: string
                      maxLength: 15
                      description: 'VAT invoice number associated with the transaction.

                        '
                    commodityCode:
                      type: string
                      maxLength: 4
                      description: 'International description code of the overall order''s goods or services or the Categorizes purchases for VAT

                        reporting. Contact your acquirer for a list of codes.

                        '
                    transactionAdviceAddendum:
                      type: array
                      items:
                        type: object
                        properties:
                          data:
                            type: string
                            maxLength: 40
                            description: 'Four Transaction Advice Addendum (TAA) fields. These fields are used to display descriptive information

                              about a transaction on the customer''s American Express card statement. When you send TAA fields, start

                              with amexdata_taa1, then ...taa2, and so on. Skipping a TAA field causes subsequent TAA fields to be

                              ignored.


                              To use these fields, contact CyberSource Customer Support to have your account enabled for this feature.

                              '
                shippingDetails:
                  type: object
                  description: 'Contains shipping details information for Klarna Advantage Plus Capture transactions.

                    '
                  properties:
                    shipFromPostalCode:
                      type: string
                      maxLength: 10
                      description: 'Postal code for the address from which the goods are shipped, which is used to establish nexus. The default is

                        the postal code associated with your CyberSource account.


                        The postal code must consist of 5 to 9 digits. When the billing country is the U.S., the 9-digit postal code

                        must follow this format:


                        `[5 digits][dash][4 digits]`


                        Example 12345-6789


                        When the billing country is Canada, the 6-digit postal code must follow this format:


                        `[alpha][numeric][alpha][space] [numeric][alpha][numeric]`


                        Example A1B 2C3


                        This field is frequently used for Level II and Level III transactions.

                        '
                    trackingNumber:
                      type: string
                      maxLength: 100
                      description: 'Shipment tracking number provided by the merchant.

                        Used to track the shipment of goods to the customer.

                        '
                    trackingUrl:
                      type: string
                      maxLength: 1024
                      description: 'URL where the customer can track their shipment.

                        Provides real-time tracking information for the delivery.

                        '
                    shippingCarrier:
                      type: string
                      maxLength: 255
                      description: 'Name of the shipping carrier/company handling the delivery.

                        '
                    estimatedDeliveryDate:
                      type: string
                      pattern: ^[0-9]{8}$
                      description: 'Estimated delivery date for the shipment provided by Merchant.

                        Format: YYYYMMDD (e.g., 20251115 for November 15, 2025)

                        '
                    shippingMethod:
                      type: string
                      maxLength: 32
                      description: "Shipping method for the product. Possible values:\n\n - `lowcost`: Lowest-cost service\n - `sameday`: Courier or same-day service\n - `oneday`: Next-day or overnight service\n - `twoday`: Two-day service\n - `threeday`: Three-day service\n - `pickup`: Store pick-up\n - `other`: Other shipping method\n - `none`: No shipping method because product is a service or subscription\n\nKlarna Advantage Plus additional values:\n - `TO_DOOR`: Delivery to door\n - `TO_CURB`: Delivery to curb\n - `TO_MAILBOX`: Delivery to mailbox\n - `PICKUP_BOX`: Pickup from box\n - `PICKUP_POINT`: Pickup from point\n - `PICKUP_STORE`: Pickup from store\n - `PICKUP_WAREHOUSE`: Pickup from warehouse\n - `DIGITAL_EMAIL`: Digital delivery via email\n - `DIGITAL_DOWNLOAD`: Digital download\n - `DIGITAL_OTHER`: Other digital delivery\n - `PHYSICAL_OTHER`: Other physical delivery\n"
            buyerInformation:
              type: object
              properties:
                merchantCustomerId:
                  type: string
                  maxLength: 100
                  description: 'Your identifier for the customer.


                    When a subscription or customer profile is being created, the maximum length for this field for most processors is 30. Otherwise, the maximum length is 100.


                    #### Comercio Latino

                    For recurring payments in Mexico, the value is the customer''s contract number.

                    Note Before you request the authorization, you must inform the issuer of the customer contract numbers that will be used for recurring transactions.


                    #### Worldpay VAP

                    For a follow-on credit with Worldpay VAP, CyberSource checks the following locations, in the order

                    given, for a customer account ID value and uses the first value it finds:

                    1. `customer_account_id` value in the follow-on credit request

                    2. Customer account ID value that was used for the capture that is being credited

                    3. Customer account ID value that was used for the original authorization

                    If a customer account ID value cannot be found in any of these locations, then no value is used.

                    '
                vatRegistrationNumber:
                  type: string
                  maxLength: 20
                  description: 'Customer''s government-assigned tax identification number.


                    #### Tax Calculation

                    Optional for international and value added taxes only. Not applicable to U.S. and Canadian taxes.

                    '
                dateOfBirth:
                  type: string
                  maxLength: 8
                  description: 'Recipient''s date of birth. **Format**: `YYYYMMDD`.


                    This field is a `pass-through`, which means that CyberSource ensures that the value is eight numeric characters

                    but otherwise does not verify the value or modify it in any way before sending it to the processor. If the field

                    is not required for the transaction, CyberSource does not forward it to the processor.

                    '
                gender:
                  type: string
                  maxLength: 3
                  description: Customer's gender. Possible values are F (female), M (male),O (other).
                language:
                  type: string
                  maxLength: 5
                  description: "language setting of the user. \nSupports 2-character language codes (e.g., en, fr) and 5-character locale values (e.g., en-US, fr-CA).\n"
                personalIdentification:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 26
                        description: "The value of the identification type. This field is supported only on the following processors.\n\n#### ComercioLatino\nSet this field to the Cadastro de Pessoas Fisicas (CPF).\n\n#### CyberSource Latin American Processing\nSupported for Redecard in Brazil. Set this field to the Cadastro de Pessoas Fisicas (CPF), which is required for AVS for Redecard in Brazil.\n**Note** CyberSource Latin American Processing is the name of a specific processing connection that CyberSource supports. In the CyberSource API documentation, CyberSource Latin American Processing does not refer to the general topic of processing in Latin America. The information in this field description is for the specific processing connection called CyberSource Latin American Processing. It is not for any other Latin American processors that CyberSource supports.              \nIf `type = PASSPORT`, this is the cardholder's passport number.\nRecommended for Discover ProtectBuy.\n"
            deviceInformation:
              type: object
              properties:
                hostName:
                  type: string
                  maxLength: 60
                  description: DNS resolved hostname from `ipAddress`.
                ipAddress:
                  type: string
                  maxLength: 45
                  description: 'IP address of the customer.


                    #### Used by

                    **Authorization, Capture, and Credit**

                    Optional field.

                    '
                userAgent:
                  type: string
                  maxLength: 40
                  description: 'Customer''s browser as identified from the HTTP header data. For example, `Mozilla` is the value that identifies

                    the Netscape browser.

                    '
            merchantInformation:
              type: object
              properties:
                merchantDescriptor:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'Your merchant name.


                        **Note** For Paymentech processor using Cybersource Payouts, the maximum data length is 22.


                        #### PIN debit

                        Your business name. This name is displayed on the cardholder''s statement. When you

                        include more than one consecutive space, extra spaces are removed.


                        When you do not include this value in your PIN debit request, the merchant name from your account is used.

                        **Important** This value must consist of English characters.


                        Optional field for PIN debit credit or PIN debit purchase requests.


                        #### Airline processing

                        Your merchant name. This name is displayed on the cardholder''s statement. When you include more than one consecutive space, extra spaces are removed.


                        **Note** Some airline fee programs may require the original ticket number (ticket identifier) or the ancillary service description in positions 13 through 23 of this field.


                        **Important** This value must consist of English characters.


                        Required for captures and credits.

                        '
                    alternateName:
                      type: string
                      maxLength: 13
                      description: 'An alternate name for the merchant.

                        '
                    contact:
                      type: string
                      maxLength: 25
                      description: 'Contact information for the merchant.


                        **Note** These are the maximum data lengths for the following payment processors:

                        - FDCCompass (13)

                        - Paymentech (13)

                        '
                    address1:
                      type: string
                      maxLength: 60
                      description: 'First line of merchant''s address.

                        '
                    locality:
                      type: string
                      maxLength: 30
                      description: 'Merchant''s City.


                        #### PIN debit

                        City for your business location. This value might be displayed on the cardholder''s statement.


                        When you do not include this value in your PIN debit request, the merchant name from your account is used.

                        **Important** This value must consist of English characters.


                        Optional field for PIN debit credit or PIN debit purchase requests.

                        '
                    country:
                      type: string
                      maxLength: 3
                      description: 'Merchant''s country.


                        #### PIN debit

                        Country code for your business location. Use the [ISO Standard Country Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf)

                        This value might be displayed on the cardholder''s statement.


                        When you do not include this value in your PIN debit request, the merchant name from your account is used.

                        **Important** This value must consist of English characters.

                        **Note** If your business is located in the U.S. or Canada and you include this field in a

                        request, you must also include `merchantInformation.merchantDescriptor.administrativeArea`.


                        Optional field for PIN debit credit or PIN debit purchase.

                        '
                    postalCode:
                      type: string
                      maxLength: 14
                      description: 'Merchant''s postal code.


                        #### PIN debit

                        Postal code for your business location. This value might be displayed on the cardholder''s statement.


                        If your business is domiciled in the U.S., you can use a 5-digit or 9-digit postal code. A 9-digit postal code must follow this format:

                        [5 digits][dash][4 digits]

                        Example: `12345-6789`


                        If your business is domiciled in Canada, you can use a 6-digit or 9-digit postal code. A 6-digit postal code must follow this format:

                        [alpha][numeric][alpha][space]

                        [numeric][alpha][numeric]

                        Example: `A1B 2C3`


                        When you do not include this value in your PIN debit request, the merchant name from your account is used.

                        **Important** This value must consist of English characters.


                        **Note** This field is supported only for businesses located in the U.S. or Canada.

                        **Important** Mastercard requires a postal code for any country that uses postal codes.

                        You can provide the postal code in your account or you can include this field in your request.


                        Optional field for PIN debit credit or PIN debit purchase.

                        '
                    administrativeArea:
                      type: string
                      description: 'The state where the merchant is located.


                        #### PIN debit

                        State code or region code for your business. Use the Use the [State, Province, and Territory Codes for the United States and Canada](https://developer.cybersource.com/library/documentation/sbc/quickref/states_and_provinces.pdf) This value might be displayed on the cardholder''s statement.


                        When you do not include this value in your PIN debit request, the merchant name from your account is used.

                        **Important** This value must consist of English characters.


                        **Note** This field is supported only for businesses located in the U.S. or Canada.


                        Optional field for PIN debit credit or PIN debit purchase.

                        '
                    phone:
                      type: string
                      maxLength: 13
                      description: 'Merchant phone as contact information for CNP transactions

                        '
                    url:
                      type: string
                      maxLength: 255
                      description: 'Address of company''s website provided by merchant

                        '
                    countryOfOrigin:
                      type: string
                      maxLength: 2
                      description: '#### Visa Platform Connect

                        This field will indicate merchant country of origin

                        '
                    storeId:
                      type: string
                      maxLength: 50
                      description: 'The identifier of the store.

                        '
                    storeName:
                      type: string
                      maxLength: 50
                      description: 'The name of the store.

                        '
                    customerServicePhoneNumber:
                      type: string
                      maxLength: 27
                      description: '#### Visa Platform Connect

                        Indicates customer service phone number of Merchant.

                        '
                cardAcceptorReferenceNumber:
                  type: string
                  maxLength: 25
                  description: 'Reference number that facilitates card acceptor/corporation communication and record keeping.

                    '
                categoryCode:
                  type: integer
                  maximum: 9999
                  description: 'The value for this field is a four-digit number that the payment card industry uses to classify

