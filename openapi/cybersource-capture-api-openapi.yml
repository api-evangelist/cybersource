                  maxLength: 21
                  description: 'Your government-assigned tax identification number.


                    #### Tax Calculation

                    Required field for value added tax only. Not applicable to U.S. and Canadian taxes.


                    #### CyberSource through VisaNet

                    For CtV processors, the maximum length is 20.

                    '
                serviceFeeDescriptor:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 22
                      description: 'Name of the service provider that is collecting the service fee. The service provider name must consist of

                        3, 7, or 12 characters followed by an asterisk (*). This value must also include the words "Service Fee."


                        When you include more than one consecutive space, extra spaces are removed. Use one of the following formats

                        for this value:

                        - <3-character name>*Service Fee

                        - <7-character name>*Service Fee

                        - <12-character name>*Service Fee


                        When payments are made in installments, this value must also include installment information such as

                        "1 of 5" or "3 of 7." For installment payments, use one of the following formats for this value:

                        - <3-character name>*Service Fee*<N> of <M>

                        - <7-character name>*Service Fee*<N> of <M>

                        - <12-character name>*Service Fee*<N> of <M>


                        where <N> is the payment number and <M> is the total number of payments.


                        When you do not include this value in your request, CyberSource uses the value that is in your CyberSource

                        account.


                        This value might be displayed on the cardholder''s statement.

                        '
                    contact:
                      type: string
                      maxLength: 11
                      description: 'Contact information for the service provider that is collecting the service fee. when you include more than one

                        consecutive space, extra spaces are removed.


                        When you do not include this value in your request, CyberSource uses the value that is in your CyberSource account.


                        This value might be displayed on the cardholder''s statement.

                        '
                    state:
                      type: string
                      maxLength: 20
                      description: 'State or territory in which the service provider is located.


                        When you do not include this value in your request, CyberSource uses the value that is in your CyberSource account.


                        This value might be displayed on the cardholder''s statement.

                        '
                taxId:
                  type: string
                  maxLength: 15
                  description: 'Your Cadastro Nacional da Pessoa Jurídica (CNPJ) number.


                    This field is supported only for BNDES transactions on CyberSource through VisaNet.


                    The value for this field corresponds to the following data in the TC 33 capture file5:

                    - Record: CP07 TCR6

                    - Position: 40-59

                    - Field: BNDES Reference Field 1

                    '
            aggregatorInformation:
              type: object
              properties:
                aggregatorId:
                  type: string
                  maxLength: 20
                  description: 'Value that identifies you as a payment aggregator. Get this value from the

                    processor.


                    #### CyberSource through VisaNet

                    The value for this field corresponds to the following data in the TC 33 capture file5:

                    - Record: CP01 TCR6

                    - Position: 95-105

                    - Field: Payment Facilitator ID


                    This field is supported for Visa, Mastercard and Discover Transactions.


                    **FDC Compass**\

                    This value must consist of uppercase characters.

                    '
                name:
                  type: string
                  maxLength: 37
                  description: 'Your payment aggregator business name.


                    **American Express Direct**\

                    The maximum length of the aggregator name depends on the length of the sub-merchant name. The combined length for both values must not exceed 36 characters.\


                    #### CyberSource through VisaNet

                    With American Express, the maximum length of the aggregator name depends on the length of the sub-merchant name. The combined length for both values must not exceed 36 characters. The value for this field does not map to the TC 33 capture file5.


                    **FDC Compass**\

                    This value must consist of uppercase characters.

                    '
                subMerchant:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 37
                      description: 'Sub-merchant''s business name.


                        #### American Express Direct

                        The maximum length of the sub-merchant name depends on the length of the aggregator name. The combined length for both values must not exceed 36 characters.


                        #### CyberSource through VisaNet

                        With American Express, the maximum length of the sub-merchant name depends on the length of the aggregator name. The combined length for both values must not exceed 36 characters. The value for this field does not map to the TC 33 capture file5.


                        #### FDC Compass

                        This value must consist of uppercase characters.


                        #### FDC Nashville Global

                        With Mastercard, the maximum length of the sub-merchant name depends on the length of the aggregator name:

                        - If aggregator name length is 1 through 3, maximum sub-merchant name length is 21.

                        - If aggregator name length is 4 through 7, maximum sub-merchant name length is 17.

                        - If aggregator name length is 8 through 12, maximum sub-merchant name length is 12.

                        '
                    address1:
                      type: string
                      maxLength: 38
                      description: 'First line of the sub-merchant''s street address.


                        #### CyberSource through VisaNet

                        The value for this field does not map to the TC 33 capture file5.


                        #### FDC Compass

                        This value must consist of uppercase characters.

                        '
                    locality:
                      type: string
                      maxLength: 21
                      description: 'Sub-merchant''s city.


                        #### CyberSource through VisaNet

                        The value for this field does not map to the TC 33 capture file5.


                        #### FDC Compass

                        This value must consist of uppercase characters.

                        '
                    administrativeArea:
                      type: string
                      maxLength: 50
                      description: 'Sub-merchant''s state or province.


                        #### CyberSource through VisaNet

                        The value for this field does not map to the TC 33 capture file5.


                        #### FDC Compass

                        This value must consist of uppercase characters.

                        '
                    postalCode:
                      type: string
                      maxLength: 15
                      description: 'Partial postal code for the sub-merchant''s address.


                        #### CyberSource through VisaNet

                        The value for this field does not map to the TC 33 capture file5.


                        #### FDC Compass

                        This value must consist of uppercase characters.

                        '
                    country:
                      type: string
                      maxLength: 3
                      description: 'Sub-merchant''s country. Use the [ISO Standard Country Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf).


                        #### CyberSource through VisaNet

                        The value for this field does not map to the TC 33 capture file.


                        #### FDC Compass

                        This value must consist of uppercase characters.

                        '
                    email:
                      type: string
                      maxLength: 40
                      description: "Sub-merchant's email address.\n\n**Maximum length for processors**\n\n - American Express Direct: 40\n - CyberSource through VisaNet: 40\n - FDC Compass: 40\n - FDC Nashville Global: 19\n\n#### CyberSource through VisaNet\nWith American Express, the value for this field corresponds to the following data in the TC 33 capture file:\n- Record: CP01 TCRB\n- Position: 25-64\n- Field: American Express Seller E-mail Address\n\n**Note** The TC 33 Capture file contains information about the purchases and refunds that a merchant submits to CyberSource. CyberSource through VisaNet creates the TC 33 Capture file at the end of the day and sends it to the merchant's acquirer, who uses this information to facilitate end-of-day clearing processing with payment card companies.\n"
                    phoneNumber:
                      type: string
                      maxLength: 20
                      description: "Sub-merchant's telephone number.\n\n**Maximum length for procesors**\n\n - American Express Direct: 20\n - CyberSource through VisaNet: 20\n - FDC Compass: 13\n - FDC Nashville Global: 10\n\n#### CyberSource through VisaNet\nWith American Express, the value for this field corresponds to the following data in the TC 33 capture file5:\n- Record: CP01 TCRB\n- Position: 5-24\n- Field: American Express Seller Telephone Number\n\n**FDC Compass**\\\nThis value must consist of uppercase characters. Use one of these recommended formats:\\\n`NNN-NNN-NNNN`\\\n`NNN-AAAAAAA`\n"
                    id:
                      type: string
                      maxLength: 20
                      description: 'The ID you assigned to your sub-merchant.

                        CyberSource through VisaNet: For American Express transaction, the value for this field corresponds to the following data in the TC 33 capture file:

                        - Record: CP01 TCRB

                        - Position: 65-84

                        - Field: American Express Seller ID

                        For  Mastercard transactions, the value for this field corresponds to the following data in the TC 33 capture file:

                        - Record: CP01 TCR6

                        - Position: 117-131

                        - Field: Sub-Merchant ID

                        FDC Compass: This value must consist of uppercase characters.


                        American Express Direct: String (20)

                        CyberSource through VisaNet with American Express: String (20)

                        CyberSource through VisaNet with Visa,Mastercard and Discover: String (15)

                        FDC Compass: String (20)

                        FDC Nashville Global: String (14)

                        '
                    merchantCategoryCode:
                      type: number
                      maxLength: 20
                      x-nullable: true
            pointOfSaleInformation:
              type: object
              properties:
                emv:
                  type: object
                  properties:
                    tags:
                      type: string
                      maxLength: 1998
                      description: "EMV data that is transmitted from the chip card to the issuer, and from the issuer to the chip card. The EMV\ndata is in the tag-length-value format and includes chip card tags, terminal tags, and transaction detail tags.\n\nFor information about the individual tags, see the \"Application Specification\" section in the EMV 4.3 Specifications: http://emvco.com\n\n**Note** Card present information about EMV applies only to credit card processing and PIN debit processing.\nAll other card present information applies only to credit card processing. PIN debit processing is available only\non FDC Nashville Global.\n\n**Important** The following tags contain sensitive information and **must not** be included in this field:\n\n - `56`: Track 1 equivalent data\n - `57`: Track 2 equivalent data\n - `5A`: Application PAN\n - `5F20`: Cardholder name\n - `5F24`: Application expiration date (This sensitivity has been relaxed for Credit Mutuel-CIC, American Express Direct, FDC Nashville Global, First Data Merchant Solutions, and SIX)\n - `99`: Transaction PIN\n - `9F0B`: Cardholder name (extended)\n - `9F1F`: Track 1 discretionary data\n - `9F20`: Track 2 discretionary data\n\nFor captures, this field is required for contact EMV transactions. Otherwise, it is optional.\n\nFor credits, this field is required for contact EMV stand-alone credits and contactless EMV stand-alone credits.\nOtherwise, it is optional.\n\n**Important** For contact EMV captures, contact EMV stand-alone credits, and contactless EMV stand-alone credits,\nyou must include the following tags in this field. For all other types of EMV transactions, the following tags\nare optional.\n\n - `95`: Terminal verification results\n - `9F10`: Issuer application data\n - `9F26`: Application cryptogram\n\n\n#### CyberSource through VisaNet\n- In Japan: 199 bytes\n- In other countries: String (252)\n\nFor Mastercard Transactions, Optionally Tag 9F60 (Authenticated Application Data) and \nTag 96 (Kernel Identifier - Terminal) can be included in the Field.\n\n#### GPX\nThis field only supports transactions from the following card types:\n- Visa\n- Mastercard\n- AMEX\n- Discover\n- Diners\n- JCB\n- Union Pay International\n\n#### JCN Gateway\nThe following tags must be included:\n- `4F`: Application identifier\n- `84`: Dedicated file name\n\nData length: 199 bytes\n\n#### All other processors:\nString (999)\n\n#### Used by\nAuthorization: Optional\nAuthorization Reversal: Optional\nCredit: Optional\nPIN Debit processing (purchase, credit and reversal): Optional\n"
                    fallback:
                      type: boolean
                      maxLength: 5
                      description: "Indicates whether a fallback method was used to enter credit card information into the POS terminal. When a\ntechnical problem prevents a successful exchange of information between a chip card and a chip-capable terminal:\n\n 1. Swipe the card or key the credit card information into the POS terminal.\n 2. Use the pointOfSaleInformation.entryMode field to indicate whether the information was swiped or keyed.\n\n\nPossible values:\n- `true`: Fallback method was used.\n- `false` (default): Fallback method was not used.\n\nThis field is supported only on American Express Direct, Chase Paymentech Solutions, CyberSource through VisaNet,\nFDC Nashville Global, GPN, JCN Gateway, OmniPay Direct, and SIX.\n"
                amexCapnData:
                  type: string
                  maxLength: 15
                  description: 'Point-of-sale details for the transaction. This value is returned only for **American Express Direct**.

                    CyberSource generates this value, which consists of a series of codes that identify terminal capability,

                    security data, and specific conditions present at the time the transaction occurred. To comply with the CAPN

                    requirements, this value must be included in all subsequent follow-on requests, such as captures and follow-on

                    credits.


                    When you perform authorizations, captures, and credits through CyberSource, CyberSource passes this value from

                    the authorization service to the subsequent services for you. However, when you perform authorizations through

                    CyberSource and perform subsequent services through other financial institutions, you must ensure that your

                    requests for captures and credits include this value.

                    '
                encryptedKeyId:
                  type: string
                  maxLength: 100
                  description: "Identifies the Zone PIN Key (ZPK) used for Online PIN processing by providing the 10‑digit Key Set Identifier (KSI).\nThis value indicates that the PIN block is encrypted under a ZPK and enables the Payment Security Service (PSS) to perform \nthe correct ZPK→ZPK PIN translation during card‑present EMV PIN transactions.\n"
            merchantDefinedInformation:
              type: array
              description: 'The object containing the custom data that the merchant defines.

                '
              items:
                type: object
                properties:
                  key:
                    type: string
                    maxLength: 50
                    description: 'The number you assign for as the key for your merchant-defined data field. Valid values are 0 to 100.


                      For example, to set or access the key for the 2nd merchant-defined data field in the array, you would reference `merchantDefinedInformation[1].key`.


                      #### CyberSource through VisaNet

                      For installment payments with Mastercard in Brazil, use `merchantDefinedInformation[0].key` and

                      `merchantDefinedInformation[1].key` for data that you want to provide to the issuer to identify the

                      transaction.

                      '
                  value:
                    type: string
                    maxLength: 800
                    description: "The value you assign for your merchant-defined data field.\n\n**Warning** Merchant-defined data fields are not intended to and must not be used to capture personally identifying information. Accordingly, merchants are prohibited from capturing, obtaining, and/or transmitting any personally identifying information in or via the merchant-defined data fields. Personally identifying information includes, but is not\nlimited to, address, credit card number, social security number, driver's license number, state-issued identification number, passport number, and card verification numbers (CVV,\nCVC2, CVV2, CID, CVN). In the event CyberSource discovers that a merchant is capturing and/or transmitting personally identifying information via the merchant-defined data fields, whether or not intentionally, CyberSource will immediately suspend the merchant's account, which will result in a rejection of any and all transaction requests submitted by the merchant after the point of suspension.\n\n#### CyberSource through VisaNet\nFor installment payments with Mastercard in Brazil, use `merchantDefinedInformation[0].value` and\n`merchantDefinedInformation[1].value` for data that you want to provide to the issuer to identify the\ntransaction. \n\nFor installment payments with Mastercard in Brazil:\n- The value for merchantDefinedInformation[0].value corresponds to the following data in the TC 33 capture file5:\n  - Record: CP07 TCR5\n  - Position: 25-44\n  - Field: Reference Field 2\n- The value for merchantDefinedInformation[1].value corresponds to the following data in the TC 33 capture file5:\n  - Record: CP07 TCR5\n  - Position: 45-64\n  - Field: Reference Field 3\n"
            merchantDefinedSecureInformation:
              type: object
              description: 'The object containing the secure data that the merchant defines.

                '
              properties:
                secure1:
                  type: string
                  maxLength: 2048
                  description: 'The value you assign for your merchant-secure data field 1.

                    '
                secure2:
                  type: string
                  maxLength: 2048
                  description: 'The value you assign for your merchant-secure data field 2.

                    '
                secure3:
                  type: string
                  maxLength: 2048
                  description: 'The value you assign for your merchant-secure data field 3.

                    '
                secure4:
                  type: string
                  maxLength: 2048
                  description: 'The value you assign for your merchant-secure data field 4.

                    '
            installmentInformation:
              type: object
              properties:
                amount:
                  type: string
                  maxLength: 13
                  description: 'Amount for the current installment payment.


                    This field is supported only for CyberSource through VisaNet.

                    '
                frequency:
                  type: string
                  maxLength: 1
                  description: 'Frequency of the installment payments. When you do not include this field in a request for a

                    Crediario installment payment, CyberSource sends a space character to the processor.


                    This field is supported only for CyberSource through VisaNet. Possible values:

                    - `B`: Biweekly

                    - `M`: Monthly

                    - `W`: Weekly


                    For Crediario installment payments, the value for this field corresponds to the following data in the TC 33 capture file5:

                    - Record: CP01 TCR9

                    - Position: 41

                    - Field: Installment Frequency

                    '
                planType:
                  type: string
                  maxLength: 1
                  description: '#### American Express Direct, Cielo, and CyberSource Latin American Processing

                    Flag that indicates the type of funding for the installment plan associated with the payment.


                    Possible values:

                    - `1`: Merchant-funded installment plan

                    - `2`: Issuer-funded installment plan

                    If you do not include this field in the request, CyberSource uses the value in your CyberSource account.


                    To change the value in your CyberSource account, contact CyberSource Customer Service.


                    #### CyberSource through VisaNet and American Express

                    Defined code that indicates the type of installment plan for this transaction.


                    Contact American Express for:

                    - Information about the kinds of installment plans that American Express provides

                    - Values for this field


                    For installment payments with American Express in Brazil, the value for this field corresponds to the following data in the TC 33 capture file*:

                    - Record: CP07 TCR3

                    - Position: 5-6

                    - Field: Plan Type


                    * The TC 33 Capture file contains information about the purchases and refunds that a merchant submits to CyberSource. CyberSource through VisaNet creates the TC 33 Capture file at the end of the day and sends it to the merchant''s acquirer, who uses this information to facilitate end-of-day clearing processing with payment card companies.


                    #### CyberSource through VisaNet with Visa or Mastercard

                    Flag indicating the type of funding for the installment plan associated with the payment.

                    Possible values:

                    - 1 or 01: Merchant-funded installment plan

                    - 2 or 02: Issuer-funded installment plan

                    - 43: Crediario installment plan—only with Visa in Brazil


                    For installment payments with Visa in Brazil, the value for this field corresponds to the following data in the TC 33 capture file5:

                    - Record: CP07 TCR1

                    - Position: 5-6

                    - Field: Installment Type


                    For all other kinds of installment payments, the value for this field corresponds to the following data in the TC 33 capture file5:

                    - Record: CP01 TCR5

                    - Position: 39-40

                    - Field: Installment Plan Type (Issuer or Merchant)

                    '
                sequence:
                  type: integer
                  maximum: 999
                  description: 'Installment number when making payments in installments. Used along with `totalCount` to track which payment is being processed.


                    For example, the second of 5 payments would be passed to CyberSource as `sequence` = 2 and `totalCount` = 5.


                    #### Chase Paymentech Solutions and FDC Compass

                    This field is optional because this value is required in the merchant descriptors.


                    #### CyberSource through VisaNet

                    When you do not include this field in a request for a Crediario installment payment, CyberSource sends a value of 0 to the processor.


                    For Crediario installment payments, the value for this field corresponds to the following data in the TC 33 capture file*:

                    - Record: CP01 TCR9

                    - Position: 38-40

                    - Field: Installment Payment Number


                    * The TC 33 Capture file contains information about the purchases and refunds that a merchant submits to CyberSource. CyberSource through VisaNet creates the TC 33 Capture file at the end of the day and sends it to the merchant''s acquirer, who uses this information to facilitate end-of-day clearing processing with payment card companies.

                    '
                totalAmount:
                  type: string
                  maxLength: 13
                  description: 'Total amount of the loan that is being paid in installments. This field is supported only for CyberSource

                    through VisaNet.

                    '
                totalCount:
                  type: integer
                  maximum: 999
                  description: 'Total number of installments when making payments in installments.


                    #### Chase Paymentech Solutions and FDC Compass

                    This field is optional because this value is required in the merchant descriptors.


                    #### American Express Direct, Cielo, and Comercio Latino

                    This value is the total number of installments you approved.


                    #### CyberSource Latin American Processing in Brazil

                    This value is the total number of installments that you approved. The default is 1.


                    #### All Other Processors

                    This value is used along with _sequence_ to track which payment is being processed.


                    For example, the second of 5 payments would be passed to CyberSource as _sequence_ = 2 and _totalCount_ = 5.


                    #### CyberSource through VisaNet

                    For Crediario installment payments, the value for this field corresponds to the following data in the TC 33 capture file*:

                    - Record: CP01 TCR9

                    - Position: 23-25

                    - Field: Number of Installments


                    For installment payments with American Express in Brazil, the value for this field corresponds to the following data in the TC 33 capture file*:

                    - Record: CP07 TCR3

                    - Position: 7-8

                    - Field: Number of Installments


                    For installment payments with Visa in Brazil, the value for this field corresponds to the following data in the TC 33 capture file*:

                    - Record: CP07 TCR1

                    - Position: 7-8

                    - Field: Number of Installments


                    For all other kinds of installment payments, the value for this field corresponds to the following data in the TC 33 capture file*:

                    - Record: CP01 TCR5

                    - Position: 20-22

                    - Field: Installment Total Count


                    **Note** The TC 33 Capture file contains information about the purchases and refunds that a merchant submits to CyberSource. CyberSource through VisaNet creates the TC 33 Capture file at the end of the day and sends it to the merchant''s acquirer, who uses this information to facilitate end-of-day clearing processing with payment card companies.

                    '
                firstInstallmentDate:
                  type: string
                  maxLength: 6
                  description: 'Date of the first installment payment. Format: YYMMDD. When you do not include this field, CyberSource sends a string of six zeros (000000) to the processor.


                    This field is supported only for Crediario installment payments in Brazil on CyberSource through VisaNet.


                    The value for this field corresponds to the following data in the TC 33 capture file:

                    - Record: CP01 TCR9

                    - Position: 42-47

                    - Field: Date of First Installment

                    '
                firstInstallmentAmount:
                  type: string
                  maxLength: 13
                  description: 'Amount of the first installment payment. The issuer provides this value when the first installment payment is successful.

                    This field is supported for Mastercard installment payments on CyberSource through VisaNet in all countries except Brazil,Croatia, Georgia, and Greece.

                    The value for this field corresponds to the following data in the TC 33 capture file:

                    - Record: CP01 TCR5

                    - Position: 23-34

                    - Field: Amount of Each Installment

                    '
                invoiceData:
                  type: string
                  maxLength: 20
                  description: 'Invoice information that you want to provide to the issuer. This value is similar to a tracking number and is

                    the same for all installment payments for one purchase.


                    This field is supported only for installment payments with Mastercard on CyberSource through VisaNet in Brazil.


                    The value for this field corresponds to the following data in the TC 33 capture file5:

                    - Record: CP07 TCR4

                    - Position: 51-70

                    - Field: Purchase Identification

                    '
                paymentType:
                  type: string
                  maxLength: 1
                  description: 'Payment plan for the installments.

                    This field is supported only for installment payments on Visa Platform Connect, RuPay and SPG-KSA seamless flow.


                    Possible values for a standing-instruction (SI) merchant-initiated transaction (MIT) with Diners Club or Mastercard in India or with an India-issued card:

                    - 1: SI with a fixed amount.

                    - 2: SI with a maximum amount.

                    - 3: Other kind of SI.


                    Possible values for a type of Installment transaction for on-soil transaction in Kingdom of Saudi Arabia

                    - 1: Registration or first transaction.

                    - 2: Subsequent transaction.


                    Possible values for other kinds of installment payments:

                    - 0 (default): Regular installment. This value is not allowed for airline transactions.

                    - 1: Installment payment with down payment.

                    - 2: Installment payment without down payment. This value is supported only for airline transactions.

                    - 3: Installment payment; down payment and boarding fee will follow. This value is supported only for airline transactions.

                    - 4: Down payment only; regular installment payment will follow.

                    - 5: Boarding fee only. This value is supported only for airline transactions.

                    - 6: SI de-registration on RuPay for the payer authentication seamless flow.

                    '
                additionalCosts:
                  type: string
                  maxLength: 12
                  description: 'Additional costs charged by the issuer to fund the installment payments.


                    This field is included in the authorization reply for the Crediario eligibility request when the issuer approves

                    the cardholder''s request for Crediario installment payments in Brazil.


                    This field is supported only for Crediario installment payments in Brazil on **CyberSource through VisaNet**.


                    The value for this field corresponds to the following data in the TC 33 capture file1:

                    - Record: CP01 TCR9

                    - Position: 128-139

                    - Field: Total Other Costs

                    '
                additionalCostsPercentage:
                  type: string
                  maxLength: 4
                  description: 'Additional costs divided by the amount funded.


                    For example:

                    - A value of 1.0 specifies 1%.

                    - A value of 4.0 specifies 4%.


                    This field is included in the authorization reply for the Crediario eligibility request when the issuer approves

                    the cardholder''s request for Crediario installment payments in Brazil.


                    This field is supported only for Crediario installment payments in Brazil on **CyberSource through VisaNet**.


                    The value for this field corresponds to the following data in the TC 33 capture file1:

                    - Record: CP01 TCR9

                    - Position: 140-143

                    - Field: Percent of Total Other Costs

                    '
                amountFunded:
                  type: string
                  maxLength: 12
                  description: 'Amount funded.


                    This field is included in the authorization reply for the Crediario eligibility request when the issuer approves

                    the cardholder''s request for Crediario installment payments in Brazil.


                    This field is supported only for Crediario installment payments in Brazil on **CyberSource through VisaNet**.


                    The value for this field corresponds to the following data in the TC 33 capture file1:

                    - Record: CP01 TCR9

                    - Position: 48-59

                    - Field: Total Amount Funded

                    '
                amountRequestedPercentage:
                  type: string
                  maxLength: 4
                  description: 'Amount requested divided by the amount funded.


                    For example:

                    - A value of 90.0 specifies 90%.

                    - A value of 93.7 specifies 93.7%.


                    This field is included in the authorization reply for the Crediario eligibility request when the issuer approves

                    the cardholder''s request for Crediario installment payments in Brazil.


                    This field is supported only for Crediario installment payments in Brazil on **CyberSource through VisaNet**.


                    The value for this field corresponds to the following data in the TC 33 capture file1:

                    - Record: CP01 TCR9

                    - Position: 60-63

                    - Field: Percent of Amount Requested

                    '
                annualFinancingCost:
                  type: string
                  maxLength: 7
                  description: 'Annual cost of financing the installment payments.


                    This field is included in the authorization reply for the Crediario eligibility request when the issuer approves

                    the cardholder''s request for Crediario installment payments in Brazil.


                    This field is supported only for Crediario installment payments in Brazil on **CyberSource through VisaNet**.


                    The value for this field corresponds to the following data in the TC 33 capture file1:

                    - Record: CP01 TCR9

                    - Position: 158-164

                    - Field: Annual Total Cost of Financing

                    '
                annualInterestRate:
                  type: string
                  maxLength: 7
                  description: 'Annual interest rate.


                    This field is returned only for two kinds of installment payments on Visa Platform Connect:

                    - Crediario with Visa in Brazil: this field is included in the authorization response for the Crediario eligibility request when the issuer approves the customer''s request for Crediario installment payments.

                    - Mastercard in all countries except Brazil, Croatia, Georgia, and Greece.



                    Example: A value of 1.0 specifies 1%.


                    Example: A value of 4.0 specifies 4%.


                    #### Brazil

                    The value for this field corresponds to the following data in the TC 33 capture file:

                    - Record: CP01 TCR9

                    - Position: 151-157

                    - Field: Annual Interest Rate



                    #### Other Countries

                    The value for this field corresponds to the following data in the TC 33 capture file:

                    - Record: CP01 TCR5

                    - Position: 58-62 SCMP API Fields| 216

                    - Field: Mastercard Annual Percentage Rate

                    '
                expenses:
                  type: string
                  maxLength: 12
                  description: 'Expenses charged by the issuer to fund the installment payments.


                    This field is included in the authorization reply for the Crediario eligibility request when the issuer approves

                    the cardholder''s request for Crediario installment payments in Brazil.


                    This field is supported only for Crediario installment payments in Brazil on **CyberSource through VisaNet**.


                    The value for this field corresponds to the following data in the TC 33 capture file1:

                    - Record: CP01 TCR9

                    - Position: 64-75

                    - Field: Total Expenses

                    '
                expensesPercentage:
                  type: string
                  maxLength: 4
                  description: 'Expenses divided by the amount funded.


                    For example:

                    - A value of 1.0 specifies 1%.

                    - A value of 4.0 specifies 4%.


                    This field is included in the authorization reply for the Crediario eligibility request when the issuer approves

                    the cardholder''s request for Crediario installment payments in Brazil.


                    This field is supported only for Crediario installment payments in Brazil on **CyberSource through VisaNet**.


                    The value for this field corresponds to the following data in the TC 33 capture file1:

                    - Record: CP01 TCR9

                    - Position: 76-79

                    - Field: Percent of Total Expenses

                    '
                fees:
                  type: string
                  maxLength: 12
