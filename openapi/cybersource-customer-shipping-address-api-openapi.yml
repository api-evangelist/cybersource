openapi: 3.2.0
info:
  description: All CyberSource API specs merged together. These are available at https://developer.cybersource.com/api/reference/api-reference.html
  version: 0.0.1
  title: CyberSource Merged Spec Customer Shipping Address API
servers:
- url: https://apitest.cybersource.com/
tags:
- name: Customer Shipping Address
  description: 'A Customer Shipping Address is linked to a Customer.

    It stores shipping information in relation to the Customer.'
paths:
  /tms/v2/customers/{customerId}/shipping-addresses:
    post:
      summary: Create a Customer Shipping Address
      description: '| | | |

        | --- | --- | --- |

        |**Customer Shipping Address**

        A Customer Shipping Address represents tokenized customer shipping information.

        A Customer can have one or more Shipping Addresses, with one allocated as the Customers default for use in payments.| |**Creating a Customer Shipping Address**

        Your system can use this API to create an existing Customers default or non default Shipping Address.

        You can also create additional Customer Shipping Addresses via the Payments API.'
      parameters:
      - name: profile-id
        in: header
        description: The Id of a profile containing user specific TMS configuration.
        required: false
        x-hide-field: true
        schema:
          type: string
          maxLength: 36
          minLength: 36
      - name: customerId
        in: path
        description: The Id of a Customer.
        required: true
        schema:
          type: string
          maxLength: 32
          minLength: 1
      tags:
      - Customer Shipping Address
      operationId: postCustomerShippingAddress
      x-devcenter-metaData:
        categoryTag: Token_Management
