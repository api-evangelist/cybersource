              description: The mandatory correlation Id passed by upstream (calling) system.
              schema:
                type: string
            uniqueTransactionID:
              description: A globally-unique Id associated with your request.
              schema:
                type: string
          content:
            application/json;charset=utf-8:
              schema:
                type: object
                properties:
                  _links:
                    type: object
                    readOnly: true
                    properties:
                      self:
                        type: object
                        readOnly: true
                        properties:
