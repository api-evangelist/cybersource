                                Required for international tax and value added tax only.

                                Optional for U.S. and Canadian taxes.

                                Your local currency.

                                '
                            billingAmount:
                              type: string
                              maxLength: 19
                              description: 'Billing amount for the billing period.

                                '
                            setupFee:
                              type: string
                              maxLength: 19
                              description: 'Subscription setup fee

                                '
                            surcharge:
