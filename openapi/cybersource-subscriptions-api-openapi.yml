                            length:
                              type: string
                              description: 'Example:

                                - If length=1 & unit=month then charge every month

                                - If length=7 & unit=day then charge every 7th day

                                '
                            unit:
                              type: string
                              description: "Calendar unit values.\n  possible values:\n  - `D` - day\n  - `M` - month\n  - `W` - week\n  - `Y` - year\n"
                        billingCycles:
