      - application/hal+json
      - application/json;charset=utf-8
      - application/hal+json;charset=utf-8
      operationId: getAllSubscriptions
      parameters:
      - name: offset
        in: query
        type: integer
        required: false
        description: Page offset number.
      - name: limit
        in: query
        type: integer
        required: false
        description: 'Number of items to be returned. Default - `20`, Max - `100`

          '
      - name: code
        in: query
        type: string
        required: false
        description: Filter by Subscription Code
      - name: status
        in: query
        type: string
        required: false
        description: Filter by Subscription Status
      - name: customerId
        in: query
        type: string
        required: false
        description: Filter by Customer Id
      - name: clientReferenceInformationCode
        in: query
        type: string
        required: false
        description: Filter by Client Reference Information Code / Merchant Reference Number
      responses:
