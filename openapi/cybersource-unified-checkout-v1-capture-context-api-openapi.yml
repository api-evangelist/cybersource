            country:
              type: string
              example: US
              maxLength: 2
              description: "Country the purchase is originating from (e.g. country of the merchant). \nUse the two-character ISO Standard<br>\n\nCountry must be in the format: ISO 3166 country code<br><br>\n\nRequired field:\nThis field cannot be configured through the Merchant Experience screens in the Business Center and must be provided on a per‑transaction basis in the uc/v1/sessions API request.\n"
            locale:
              type: string
              example: en_US
              description: 'Localization of the User experience conforming to the ISO 639 language standards and two-character ISO Standard Country Code.<br><br>


                Locale must be in the format: <ISO 639 language code>_<ISO 3166 region code>


                Please refer to list of [supported locales through Unified Checkout](https://developer.cybersource.com/docs/cybs/en-us/unified-checkout/developer/all/rest/unified-checkout/uc-appendix-languages.html)<br><br>


                Required field:

                This field cannot be configured through the Merchant Experience screens in the Business Center and must be provided on a per‑transaction basis in the uc/v1/sessions API request.

                '
            buttonType:
              type: string
              example: null
              description: 'Changes the label on the payment button within Unified Checkout .<br><br>


                Possible values:

                - ADD_CARD

                - CARD_PAYMENT

                - CHECKOUT

                - CHECKOUT_AND_CONTINUE

                - DEBIT_CREDIT

                - DONATE

                - PAY

                - PAY_WITH_CARD

                - SAVE_CARD

                - SUBSCRIBE_WITH_CARD<br><br>


                The default value is CHECKOUT. <br><br>


                Optional field:

                This field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.

                '
            captureMandate:
              type: object
              properties:
                billingType:
                  type: string
                  example: FULL
                  maxLength: 25
                  description: 'Configure Unified Checkout to capture billing address information.


                    Possible values:

                    - FULL: Capture complete billing address information.

                    - PARTIAL: Capture first name, last name, country and postal/zip code only.

                    - NONE: Capture only first name and last name.<br><br>


                    Optional field:

                    This field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.

                    '
                requestEmail:
                  type: boolean
                  description: "Configure Unified Checkout to capture customer email address.\n\nPossible values:\n - True\n - False<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
                requestPhone:
                  type: boolean
                  description: 'Configure Unified Checkout to capture customer phone number.


                    Possible values:

                    - True

                    - False<br><br>


                    Optional field:

                    This field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.

                    '
                requestShipping:
                  type: boolean
                  description: 'Configure Unified Checkout to capture customer shipping details.


                    Possible values:

                    - True

                    - False<br><br>


                    Optional field:

                    This field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.

                    '
                shipToCountries:
                  type: array
                  description: "List of countries available to ship to.  \nUse the two-character ISO Standard Country Codes.<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
                  items:
                    type: string
                    example: US
                    maxLength: 2
                showAcceptedNetworkIcons:
                  type: boolean
                  description: 'Configure Unified Checkout to display the list of accepted card networks beneath the payment button


                    Possible values:

                    - True

                    - False<br><br>


                    Optional field:

                    This field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.

                    '
                showConfirmationStep:
                  type: boolean
                  description: 'Configure Unified Checkout to display the final confirmation screen when using Click to Pay.<br>

                    Where ''BillingType''= NONE and ''requestShipping''= FALSE and the customer is using an existing Click to Pay card as their chosen payment method, a final confirmation screen can be removed allowing the customer to check out as soon as they have selected their payment method from within their Click to Pay card tray.


                    Possible values:

                    - True

                    - False<br><br>


                    Optional field:

                    This field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.

                    '
                requestSaveCredentials:
                  type: boolean
                  description: "Configure Unified Checkout to display the \"Save card for future use\" checkbox.<br>\n\nConfigurable check box that will show in a Manual card entry flow to allow a Cardholder to give consent to store their manually entered credential with the Merchant that they are paying.<br> \nApplicable when manually entering the details and not enrolling in Click to Pay.\n\nPossible values:\n - True \n - False<br><br>\n\n**Use Cases:**\n\n**Offer consumers option to save their card in Unified Checkout:** \n- Include the captureMandate.requestSaveCard field in the capture context request and set it to true.\n- When set to true, this will show a checkbox with the message 'Save card for future use' in Unified Checkout.\n- When selected this provides a response in both the Transient Token and Get Credentials API response.<br><br>\n\n**Do not offer consumers the option to save their card in Unified Checkout:** \n- Include the captureMandate.requestSaveCard field in the capture context request and set it to false OR omit the field from the capture context request.\n- When set to false, the save card option is not shown to consumers when manually entering card details.<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
                comboCard:
                  type: boolean
                  description: "Configure Unified Checkout to display combo card at checkout.<br>\n\nA combo debit/credit card is a single card that functions both as a Debit/Credit card. \nUnified Checkout / Click to Pay Drop-in UI allows the Cardholder to choose whether they would like the transaction to be paid for using either debit or credit card.\n**Important:** This is applicable to Visa cards only.\n\nPossible values:\n- True \n- False<br><br>\n\n**Use Cases:**\n\n**Offer Combo Card at Checkout:** \n- Include the captureMandate.comboCard field in the capture context request and set it to true.\n- When set to true, Combo Card selection is shown at checkout <br><br>\n\n**Do not offer Combo Card at Checkout:** \n- Include the captureMandate.comboCard field in the capture context request and set it to false OR omit the field from the capture context request.\n- The Combo Card selection is not shown at checkout.<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
                CPF:
                  type: object
                  properties:
                    required:
                      type: boolean
                      description: "Configure Unified Checkout to display and capture the CPF number (Cadastro de Pessoas Físicas).  The CPF number is a unique 11-digit identifier issued to Brazilian citizens and residents for tax purposes.\n\nPossible values:\n- True\n- False<br><br>\n\nThis field is optional.  \nIf set to true the field is required.\nIf set to false the field is optional.\nIf the field is not included in the capture context then it is not captured.<br><br>\n\n**Important:**\n - If PANENTRY is specified in the allowedPaymentTypes field, the CPF number will be displayed in Unified Checkout regardless of what card number is entered.\n - If CLICKTOPAY is specified in the allowedPaymentTypes field, the CPF number will be displayed in Unified Checkout only when a Visa Click To Pay card is entered.<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
            completeMandate:
              type: object
              description: "The completeMandate object is designed to provide instructions for orchestrating payment services.  Unified Checkout is capable of orchestrating a number of services on your behalf.<br><br>  \nBy providing this field in the capture context Unified Checkout will initiate services on your behalf from the browser, simplifying your integration.\n"
              properties:
                type:
                  type: string
                  example: AUTH
                  maxLength: 25
                  description: "This field is used to indicate how a payment should be processed.\n\nPossible values:\n- AUTH: Use this value when you want to authorize a payment within Unified Checkout without capturing it immediately.  Payment types that initiate an immediate transfer of funds are NOT allowed.  If a capture context request includes a payment type incompatible with this mode, a 400 error will be returned.  A merchant would need to perform their own capture via API where applicable.<br><br>  \n- CAPTURE: Use this value when you want to perform a sale within Unified Checkout and capture the payment immediately during the transaction.  Note: Some payment types may return a PENDING status, requiring an additional status check call to determine the final outcome of the payment.<br><br>\n- PREFER_AUTH: Use this value to offer multiple alternative payment options during the Unified Checkout experience. This option authorizes the payment without immediate capture, where available.  It will perform a \"CAPTURE\" where an \"AUTH\" is not allowed by the payment type.  Transactions can be AUTHORIZED, CAPTURED, or PENDING.  If an \"AUTH\" is performed, a merchant would need to perform their own capture via API where applicable.<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
                tms:
                  type: object
                  description: 'Configure Unified Checkout to create a TMS token at the end of the payment journey

                    '
                  properties:
                    tokenCreate:
                      type: boolean
                      example: true
                      description: "Use this when you want to create a token from the card/bank data in your payment request. \n\nPossible values:\n  - True\n  - False<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
                    tokenTypes:
                      type: array
                      items:
                        type: string
                        maxLength: 30
                        example:
                        - CUSTOMER
                      description: 'Cybersource tokens types you are performing a create on.

                        If not supplied the default token type for the merchants token vault will be used.


                        Possible values:

                        - Customer

                        - paymentInstrument

                        - instrumentIdentifier

                        - shippingAddress<br><br>


                        Optional field:

                        This field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.

                        '
                decisionManager:
                  type: boolean
                  description: "Configure Unified Checkout to determine whether Decision Manager is invoked during service orchestration.\n\nPossible values:\n - True\n - False<br><br>\n\nSetting this value to True indicates that device fingerprinting will be executed to add additional information for risk service\nSetting this value to False (or not provided) indicates that you do not wish to run device fingerprinting and skip decision manager services.<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
                consumerAuthentication:
                  type: string
                  description: "Configure Unified Checkout to determine whether Consumer Authentication is invoked during service orchestration.\n\nPossible values:\n\n - PASSKEY\n - 3DS\n - NONE<br><br>\n\nSetting this value to PASSKEY performs Payer Authentication with an existing Visa Payment Passkey or create a new Passkey (Post a traditional 3DS Authentication) attempt to perform authentication using the Payer Authentication Service.<br>\nSetting this value to 3DS will attempt to perform authentication using the Payer Authentication Service.<br>\nSetting this value to NONE indicates that you do not wish to perform authentication using the Payer Authentication Service.<br><br>\n\nOptional field:\nThis field can be configured through the Merchant Experience screens in the Business Center. The configured value may be overridden on a per‑transaction basis in the uc/v1/sessions API request.\n"
            transientTokenResponseOptions:
              type: object
              properties:
                includeCardPrefix:
                  type: boolean
                  description: "Use the transientTokenResponseOptions.includeCardPrefix field to choose your preferred card number prefix length: 6-digit, 8-digit, or no card number prefix.\n\nPossible values:\n- True\n- False<br><br>\n\nTo select the type of card number prefix:\n- No field included: A 6-digit prefix is returned (default)\n- True: An 8-digit prefix is returned\n- False: No prefix is returned<br><br>\n\nThe following conditions apply:\n- 8-digit card number prefixes only apply to Discover, JCB, Mastercard, UnionPay, and Visa brands with 16-digit card numbers or more.\n- Any card with less than 16-digit numbers will return a 6-digit prefix even when the transientTokenResponseOptions.includeCardPrefix field is set to true.\n- Any card brand other than Discover, JCB, Mastercard, UnionPay, or Visa will return a 6-digit prefix even when the transientTokenResponseOptions.includeCardPrefix field is set to true.\n- If any card brand is co-branded with Discover, JCB, Mastercard, UnionPay, or Visa, an 8-digit prefix will be returned if the transientTokenResponseOptions.includeCardPrefix field is set to true.<br><br>\n\n**Important:** \nIf your application does NOT require a card number prefix for routing or identification purposes, set the transientTokenResponseOptions.includeCardPrefix field to False.  This will minimize your personal data exposure.<br><br>\n\nOptional field:\nThis field cannot be configured through the Merchant Experience screens in the Business Center and if required should be provided on a per‑transaction basis in the uc/v1/sessions API request.\n"
            data:
              type: object
              properties:
                aggregatorInformation:
                  type: object
                  properties:
                    aggregatorId:
                      type: string
                      maxLength: 20
                      description: "Value that identifies you as a payment aggregator. Get this value from the processor.\n  \n#### CyberSource through VisaNet\nThe value for this field corresponds to the following data in the TC 33 capture file5:\n- Record: CP01 TCR6\n- Position: 95-105\n- Field: Payment Facilitator ID\n  \nThis field is supported for Visa, Mastercard and Discover Transactions.\n  \n**FDC Compass**\\\nThis value must consist of uppercase characters.\n"
                    name:
                      type: string
                      maxLength: 37
                      description: "Your payment aggregator business name.\n  \n**American Express Direct**\\\nThe maximum length of the aggregator name depends on the length of the sub-merchant name. The combined length for both values must not exceed 36 characters.\\\n  \n#### CyberSource through VisaNet\nWith American Express, the maximum length of the aggregator name depends on the length of the sub-merchant name. The combined length for both values must not exceed 36 characters. The value for this field does not map to the TC 33 capture file5.\n  \n**FDC Compass**\\\nThis value must consist of uppercase characters.\n"
                    subMerchant:
                      type: object
                      properties:
                        cardAcceptorId:
                          type: string
                          maxLength: 15
                          description: Unique identifier assigned by the payment card company to the sub-merchant.
                        id:
                          type: string
                          maxLength: 20
                          description: 'The ID you assigned to your sub-merchant.

                            CyberSource through VisaNet: For American Express transaction, the value for this field corresponds to the following data in the TC 33 capture file:

                            - Record: CP01 TCRB

                            - Position: 65-84

                            - Field: American Express Seller ID

                            For  Mastercard transactions, the value for this field corresponds to the following data in the TC 33 capture file:

                            - Record: CP01 TCR6

                            - Position: 117-131

                            - Field: Sub-Merchant ID

                            FDC Compass: This value must consist of uppercase characters.


                            American Express Direct: String (20)

                            CyberSource through VisaNet with American Express: String (20)

                            CyberSource through VisaNet with Visa,Mastercard and Discover: String (15)

                            FDC Compass: String (20)

                            FDC Nashville Global: String (14)

                            '
                        name:
                          type: string
                          maxLength: 37
                          description: 'Sub-merchant''s business name.


                            #### American Express Direct

                            The maximum length of the sub-merchant name depends on the length of the aggregator name. The combined length for both values must not exceed 36 characters.


                            #### CyberSource through VisaNet

                            With American Express, the maximum length of the sub-merchant name depends on the length of the aggregator name. The combined length for both values must not exceed 36 characters. The value for this field does not map to the TC 33 capture file5.


                            #### FDC Compass

                            This value must consist of uppercase characters.


                            #### FDC Nashville Global

                            With Mastercard, the maximum length of the sub-merchant name depends on the length of the aggregator name:

                            - If aggregator name length is 1 through 3, maximum sub-merchant name length is 21.

                            - If aggregator name length is 4 through 7, maximum sub-merchant name length is 17.

                            - If aggregator name length is 8 through 12, maximum sub-merchant name length is 12.

                            '
                        address1:
                          type: string
                          maxLength: 38
                          description: 'First line of the sub-merchant''s street address.


                            #### CyberSource through VisaNet

                            The value for this field does not map to the TC 33 capture file5.


                            #### FDC Compass

                            This value must consist of uppercase characters.

                            '
                        locality:
                          type: string
                          maxLength: 21
                          description: 'Sub-merchant''s city.


                            #### CyberSource through VisaNet

                            The value for this field does not map to the TC 33 capture file5.


                            #### FDC Compass

                            This value must consist of uppercase characters.

                            '
                        administrativeArea:
                          type: string
                          maxLength: 50
                          description: 'Sub-merchant''s state or province.


                            #### CyberSource through VisaNet

                            The value for this field does not map to the TC 33 capture file5.


                            #### FDC Compass

                            This value must consist of uppercase characters.

                            '
                        region:
