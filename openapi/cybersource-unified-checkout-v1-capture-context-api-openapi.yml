                        '
                    inputErrorBorderColor:
                      type: string
                      pattern: ^#([A-Fa-f0-9]{6})$
                      example: '#F44336'
                      description: 'Border color on error<br><br>


                        Optional field:

                        This field cannot be configured through the Merchant Experience screens in the Business Center.  If required, should be provided on a per‑transaction basis in the uc/v1/sessions API request.

                        '
                    inputErrorBorderStyle:
                      type: string
                      example: solid
                      description: 'Border style on error<br><br>


                        Optional field:

