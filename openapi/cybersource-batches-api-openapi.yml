  /accountupdater/v1/batches/{batchId}/status:
    get:
      summary: Retrieve a Batch Status
      description: "**Get Batch Status**<br>This resource accepts a batch id and returns:\n- The batch status.\n- The total number of accepted, rejected, updated records.\n- The total number of card association responses.\n- The billable quantities of:\n  - New Account Numbers (NAN)\n  - New Expiry Dates (NED)\n  - Account Closures (ACL)\n  - Contact Card Holders (CCH)\n"
      parameters:
      - name: batchId
        in: path
        description: Unique identification number assigned to the submitted request.
        required: true
        type: string
        minLength: 2
        maxLength: 26
        pattern: ^[0-9]*$
      tags:
      - Batches
      operationId: getBatchStatus
      x-devcenter-metaData:
        categoryTag: Account_Updater
        developerGuides: https://developer.cybersource.com/library/documentation/dev_guides/Account_Updater_UG/html/index.html#t=Topics%2FBatch_Update.htm%23TOC_Retrieving_Update_Reportsbc-6
      produces:
      - application/json;charset=utf-8
      responses:
        '200':
          description: The status of a batch.
          schema:
            type: object
            properties:
              _links:
                type: object
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        example: https://api.cybersource.com/accountupdater/v1/batches/16188390061150001062041064/status
                  report:
                    type: array
                    items:
                      type: object
                      properties:
                        href:
                          type: string
                          example: https://apitest.cybersource.com/accountupdater/v1/batches/16188390061150001062041064/report
              batchId:
                type: string
                example: '16188390061150001062041064'
                description: Unique identification number assigned to the submitted request.
              batchCreatedDate:
                type: string
                example: 2018-05-22T14.38.57Z
                description: 'ISO-8601 format: yyyy-MM-ddTHH:mm:ssZ'
              batchSource:
                type: string
                description: "Valid Values:\n  * SCHEDULER\n  * TOKEN_API\n  * CREDIT_CARD_FILE_UPLOAD\n  * AMEX_REGSITRY\n  * AMEX_REGISTRY_API\n  * AMEX_MAINTENANCE\n"
              merchantReference:
                type: string
                example: TC50171_3
                maxLength: 255
                description: Reference used by merchant to identify batch.
              batchCaEndpoints:
                type: string
                example: VISA,MASTERCARD
              status:
                type: string
                description: "Valid Values:\n  * REJECTED\n  * RECEIVED\n  * VALIDATED\n  * DECLINED\n  * PROCESSING\n  * COMPLETED\n"
              totals:
                type: object
                properties:
                  acceptedRecords:
                    type: integer
                    example: 1
                  rejectedRecords:
                    type: integer
                    example: 1
                  updatedRecords:
                    type: integer
                    example: 1
                  caResponses:
                    type: integer
                    example: 1
                  caResponsesOmitted:
                    type: integer
                    example: 1
              billing:
                type: object
                properties:
                  nan:
                    type: integer
                    example: 1
                  ned:
                    type: integer
                    example: 1
                  acl:
                    type: integer
                    example: 1
                  cch:
                    type: integer
                    example: 1
              description:
                type: string
                example: Your batch has been received, and is being checked for errors.
        '403':
          description: Unable to perform action for supplied batch ID/merchant.
          schema:
            type: object
            properties:
              _links:
                type: object
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        example: https://api.cybersource.com/accountupdater/v1/batches
              code:
                type: string
                description: "Valid Values:\n  * FORBIDDEN_RESPONSE\n  * VALIDATION_ERROR\n  * UNSUPPORTED_MEDIA_TYPE\n  * MALFORMED_PAYLOAD_ERROR\n  * SERVER_ERROR\n"
              correlationId:
                type: string
                example: c7b74452a7314f9ca28197d1084447a5
              detail:
                type: string
                example: One or more fields failed validation
              fields:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                      example: notificationEmail
                    message:
                      type: string
                      example: Email Address is invalid
                    localizationKey:
                      type: string
                      description: "Valid Values:\n  * cybsapi.ondemand.batch.email.null\n"
              localizationKey:
                type: string
                description: "Valid Values:\n  * cybsapi.forbidden.response\n  * cybsapi.validation.error\n  * cybsapi.media.notsupported\n"
              message:
                type: string
                example: Field validation error
  /accountupdater/v1/batches/{batchId}/report:
    get:
      summary: Retrieve a Batch Report
      description: "**Get Batch Report**<br>This resource accepts a batch id and returns:\n- The batch status.\n- The total number of accepted, rejected, updated records.\n- The total number of card association responses.\n- The billable quantities of:\n  - New Account Numbers (NAN)\n  - New Expiry Dates (NED)\n  - Account Closures (ACL)\n  - Contact Card Holders (CCH)\n- Source record information including token ids, masked card number, expiration dates & card type.\n- Response record information including response code, reason, token ids, masked card number, expiration dates & card type.\n"
      parameters:
      - name: batchId
        in: path
        description: Unique identification number assigned to the submitted request.
        required: true
        type: string
        minLength: 2
        maxLength: 26
        pattern: ^[0-9]*$
      tags:
      - Batches
      operationId: getBatchReport
      x-devcenter-metaData:
        categoryTag: Account_Updater
        developerGuides: https://developer.cybersource.com/library/documentation/dev_guides/Account_Updater_UG/html/index.html#t=Topics%2FBatch_Update.htm%23TOC_Retrieving_a_Batch_withbc-10
      produces:
      - application/json;charset=utf-8
      responses:
        '200':
          description: The report for a batch.
          schema:
            type: object
            properties:
              version:
                type: string
                example: '1.0'
              reportCreatedDate:
                type: string
                example: 2018-05-22T14.38.57Z
                description: 'ISO-8601 format: yyyy-MM-ddTHH:mm:ssZ'
              batchId:
                type: string
                example: '16188390061150001062041064'
                description: Unique identification number assigned to the submitted request.
              batchSource:
                type: string
                description: "Valid Values:\n  * SCHEDULER\n  * TOKEN_API\n  * CREDIT_CARD_FILE_UPLOAD\n  * AMEX_REGSITRY\n  * AMEX_REGISTRY_API\n  * AMEX_MAINTENANCE\n"
              batchCaEndpoints:
                type: string
                example: VISA,MASTERCARD
              batchCreatedDate:
                type: string
                example: 2018-05-22T14.38.57Z
                description: 'ISO-8601 format: yyyy-MM-ddTHH:mm:ssZ'
              merchantReference:
                type: string
                example: TC50171_3
                maxLength: 255
                description: Reference used by merchant to identify batch.
              totals:
                type: object
                properties:
                  acceptedRecords:
                    type: integer
                    example: 1
                  rejectedRecords:
                    type: integer
                    example: 1
                  updatedRecords:
                    type: integer
                    example: 1
                  caResponses:
                    type: integer
                    example: 1
                  caResponsesOmitted:
                    type: integer
                    example: 1
              billing:
                type: object
                properties:
                  nan:
                    type: integer
                    example: 1
                  ned:
                    type: integer
                    example: 1
                  acl:
                    type: integer
                    example: 1
                  cch:
                    type: integer
                    example: 1
              records:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: '10000000'
                    sourceRecord:
                      type: object
                      properties:
                        token:
                          type: string
                          minLength: 1
                          maxLength: 32
                          example: C064DE56200B0DB0E053AF598E0A52AA
                        customerId:
                          type: string
                          minLength: 1
                          maxLength: 32
                          example: C064DE56200B0DB0E053AF598E0A52AA
                        paymentInstrumentId:
                          type: string
                          minLength: 1
                          maxLength: 32
