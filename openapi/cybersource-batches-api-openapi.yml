      x-example:
        example0:
          summary: One Off Visa MasterCard Customer Token Batch
          value:
            type: oneOff
            included:
              tokens:
              - id: C064DE56200B0DB0E053AF598E0A52AA
              - id: C064DE56213D0DB0E053AF598E0A52AA
