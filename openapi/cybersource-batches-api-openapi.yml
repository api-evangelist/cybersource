                        instrumentIdentifierId:
                          type: string
                          minLength: 12
                          maxLength: 32
                          example: '7030000000000116236'
                        cardNumber:
                          type: string
                          example: 511111XXXXXX6814
                        cardExpiryMonth:
                          type: string
                          minLength: 2
                          maxLength: 2
                          example: '12'
                        cardExpiryYear:
                          type: string
                          minLength: 4
                          maxLength: 4
                          example: '2018'
                        cardType:
                          type: string
                          example: '002'
                    responseRecord:
                      type: object
                      properties:
                        response:
                          type: string
                          description: "Valid Values:\n  * NAN\n  * NED\n  * ACL\n  * CCH\n  * CUR\n  * NUP\n  * UNA\n  * ERR\n  * DEC\n"
                        reason:
                          type: string
                          example: '800'
                        token:
                          type: string
                          minLength: 1
                          maxLength: 32
                          example: C064DE56200B0DB0E053AF598E0A52AA
                        instrumentIdentifierId:
                          type: string
                          minLength: 12
                          maxLength: 32
                          example: '7030000000000116236'
                        instrumentIdentifierCreated:
                          type: string
                          description: "Valid Values:\n  * true\n  * false\n"
                        cardNumber:
                          type: string
                          example: 511111XXXXXX6814
                        cardExpiryMonth:
                          type: string
                          minLength: 2
                          maxLength: 2
                          example: '12'
                        cardExpiryYear:
                          type: string
                          minLength: 4
                          maxLength: 4
                          example: '2018'
                        cardType:
                          type: string
                          example: '002'
                        additionalUpdates:
                          type: array
                          items:
                            type: object
                            properties:
                              customerId:
                                type: string
                                minLength: 1
                                maxLength: 32
                                example: C064DE56213D0DB0E053AF598E0A52AA
                              paymentInstrumentId:
                                type: string
                                minLength: 1
                                maxLength: 32
                                example: C064FBFEB64060AAE053AF598E0A3EE6
                              creator:
                                type: string
                                example: mid
                              state:
                                type: string
                                description: "Valid Values:\n  * ACTIVE\n  * CLOSED\n"
                              message:
                                type: string
                                example: This Payment Instrument contains the source card number, which is now closed. If required, you can update manually or through the AU REST API.
        '403':
          description: Unable to perform action for supplied batch ID/merchant.
          schema:
            type: object
            properties:
              _links:
                type: object
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        example: https://api.cybersource.com/accountupdater/v1/batches
              code:
                type: string
                description: "Valid Values:\n  * FORBIDDEN_RESPONSE\n  * VALIDATION_ERROR\n  * UNSUPPORTED_MEDIA_TYPE\n  * MALFORMED_PAYLOAD_ERROR\n  * SERVER_ERROR\n"
              correlationId:
                type: string
                example: c7b74452a7314f9ca28197d1084447a5
              detail:
                type: string
                example: One or more fields failed validation
              fields:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
