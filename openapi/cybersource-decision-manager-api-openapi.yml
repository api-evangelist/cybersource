                          - true: Orders are assigned only slight additional risk if billing and shipping addresses are different.

                          - false: Orders are assigned higher additional risk if billing and shipping addresses are different.

                          '
                      distributorProductSku:
                        type: string
                        maxLength: 15
                        description: 'Product''s identifier code. This field is inserted into the outgoing message without being parsed or formatted.

                          This field is included as Distributor product SKU (Offer) in the list of API fields with which you can create

                          custom rules.

                          '
                      passenger:
                        type: object
                        description: Contains travel-related passenger details used by DM service only.
                        properties:
                          type:
                            type: string
                            maxLength: 32
                            description: 'Passenger classification associated with the price of the ticket. You can use one of the following values:

                              - `ADT`: Adult

                              - `CNN`: Child

                              - `INF`: Infant

                              - `YTH`: Youth

                              - `STU`: Student

