  /risk/v1/lists/{type}/entries:
    post:
      summary: List Management
      description: 'This call adds/deletes/converts the request information in the negative list.


        Provide the list to be updated as the path parameter. This value can be ''postiive'', ''negative'' or ''review''.

        '
      operationId: addNegative
      tags:
      - Decision Manager
      produces:
      - application/hal+json;charset=utf-8
      x-devcenter-metaData:
        categoryTag: Risk_Management
      parameters:
      - name: type
        in: path
        required: true
        type: string
        description: The list to be updated. It can be 'positive', 'negative' or 'review'.
      - name: addNegativeListRequest
        in: body
        required: true
        schema:
          type: object
          properties:
            orderInformation:
              type: object
              properties:
                address:
                  type: object
                  description: Contains address information related to the order
                  properties:
                    address1:
                      type: string
                      description: First line of the street address
                      maxLength: 60
                    address2:
                      type: string
                      description: Second line of the street address
                      maxLength: 60
                    locality:
                      type: string
                      description: 'City of the street address.

                        Required when adding the address to a list.

                        '
                      maxLength: 50
                    country:
                      type: string
                      description: 'Country of the street address. Use the two-character codes located in the Support Center.

                        Required if address1 is present.

                        '
                      maxLength: 2
                    administrativeArea:
                      type: string
                      maxLength: 2
                      description: State, province, or territory of the street address. Use the two-character codes located in the Support Center.
                    postalCode:
                      type: string
                      maxLength: 10
                      description: Postal code of the street address. Required when adding the address to a list.
                billTo:
                  type: object
                  properties:
                    address1:
                      type: string
                      maxLength: 60
                      description: 'Payment card billing street address as it appears on the credit card issuer''s records.


                        #### SEPA

                        Required for Create Mandate and Import Mandate


                        #### Atos

                        This field must not contain colons (:).


                        #### CyberSource through VisaNet

                        **Important** When you populate orderInformation.billTo.address1 and orderInformation.billTo.address2,

