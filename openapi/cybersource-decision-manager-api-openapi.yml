                      description: 'Customer''s last name. This name must be the same as the name on the card.


                        **Important** It is your responsibility to determine whether a field is required for the transaction you are requesting.


                        #### SEPA

                        Required for Create Mandate and Import Mandate

                        #### BACS

                        Required for Import Mandate

                        #### Chase Paymentech Solutions

                        Optional field.


                        ####  Credit Mutuel-CIC

                        Optional field.


                        #### CyberSource Latin American Processing

                        **Important** For an authorization request, CyberSource Latin American Processing concatenates `orderInformation.billTo.firstName` and `orderInformation.billTo.lastName`. If the concatenated value exceeds 30 characters, CyberSource Latin American Processing declines the authorization request.\

                        **Note** CyberSource Latin American Processing is the name of a specific processing connection that CyberSource supports. In the CyberSource API documentation, CyberSource Latin American Processing does not refer to the general topic of processing in Latin America. The information in this field description is for the specific processing connection called CyberSource Latin American Processing. It is not for any other Latin American processors that CyberSource supports.


                        #### CyberSource through VisaNet

                        Credit card networks cannot process transactions that contain non-ASCII characters. CyberSource through VisaNet accepts and stores non-ASCII characters correctly and displays them correctly in reports. However, the limitations of the credit card networks prevent CyberSource through VisaNet from transmitting non-ASCII characters to the credit card networks. Therefore, CyberSource through VisaNet replaces non-ASCII characters with meaningless ASCII characters for transmission to the credit card networks.


                        #### For Payouts:

                        This field may be sent only for FDC Compass.


                        #### OmniPay Direct

                        Optional field.


                        #### RBS WorldPay Atlanta

                        Optional field.


                        #### SIX

                        Optional field.


                        #### TSYS Acquiring Solutions

                        Required when `processingInformation.billPaymentOptions.billPayment=true` and `pointOfSaleInformation.entryMode=keyed`.


                        #### Worldpay VAP

                        Optional field.


                        #### All other processors

                        Not used.

                        '
                    phoneNumber:
                      type: string
                      maxLength: 15
                      description: 'Customer''s phone number.


                        It is recommended that you include the country code when the order is from outside the U.S.


                        #### Chase Paymentech Solutions

                        Optional field.


                        ####  Credit Mutuel-CIC

                        Optional field.


                        #### CyberSource through VisaNet

                        Credit card networks cannot process transactions that contain non-ASCII characters. CyberSource through VisaNet accepts and stores non-ASCII characters correctly and displays them correctly in reports. However, the limitations of the credit card networks prevent CyberSource through VisaNet from transmitting non-ASCII characters to the credit card networks. Therefore, CyberSource through VisaNet replaces non-ASCII characters with meaningless ASCII characters for transmission to the credit card networks.


                        #### For Payouts:

                        This field may be sent only for FDC Compass.


                        #### OmniPay Direct

                        Optional field.


                        #### SIX

                        Optional field.


                        #### TSYS Acquiring Solutions

                        Optional field.


                        #### Worldpay VAP

                        Optional field.


                        #### All other processors

                        Not used.

                        '
                    email:
                      type: string
                      maxLength: 255
                      description: 'Customer''s email address, including the full domain name.


                        #### CyberSource through VisaNet

                        Credit card networks cannot process transactions that contain non-ASCII characters. CyberSource through VisaNet accepts and stores non-ASCII characters correctly and displays them correctly in reports. However, the limitations of the credit card networks prevent CyberSource through VisaNet from transmitting non-ASCII characters to the credit card networks. Therefore, CyberSource through VisaNet replaces non-ASCII characters with meaningless ASCII characters for transmission to the credit card networks.


                        **Important** It is your responsibility to determine whether a field is required for the transaction you are requesting.


                        #### Invoicing

                        Email address for the customer for sending the invoice. If the invoice is in SENT status and email is updated, the old email customer payment link won''t work and you must resend the invoice with the new payment link.


                        #### Chase Paymentech Solutions

                        Optional field.


                        ####  Credit Mutuel-CIC

                        Optional field.


                        #### OmniPay Direct

                        Optional field.


                        #### SIX

                        Optional field.


                        #### TSYS Acquiring Solutions

                        Required when `processingInformation.billPaymentOptions.billPayment=true` and `pointOfSaleInformation.entryMode=keyed`.


                        #### Worldpay VAP

                        Optional field.


                        #### All other processors

                        Not used.

                        '
                    postalCode:
                      type: string
                      maxLength: 10
                      description: "Postal code for the billing address. The postal code must consist of 5 to 9 digits.\n\nWhen the billing country is the U.S., the 9-digit postal code must follow this format:\n[5 digits][dash][4 digits]\n\n**Example** `12345-6789`\n\nWhen the billing country is Canada, the 6-digit postal code must follow this format:\n[alpha][numeric][alpha][space][numeric][alpha][numeric]\n\n**Example** `A1B 2C3`\n\n**Important** It is your responsibility to determine whether a field is required for the transaction you are requesting.\n\n#### SEPA\nRequired for Create Mandate and Import Mandate\n\n#### For Payouts:\n This field may be sent only for FDC Compass.\n\n#### American Express Direct\nBefore sending the postal code to the processor, CyberSource removes all nonalphanumeric characters and, if the remaining value is longer than nine characters, truncates the value starting from the right side.\n\n#### Atos\nThis field must not contain colons (:).\n\n#### CyberSource through VisaNet\nCredit card networks cannot process transactions that contain non-ASCII characters. CyberSource through VisaNet\naccepts and stores non-ASCII characters correctly and displays them correctly in reports. However, the limitations\nof the credit card networks prevent CyberSource through VisaNet from transmitting non-ASCII characters to the\ncredit card networks. Therefore, CyberSource through VisaNet replaces non-ASCII characters with meaningless ASCII\ncharacters for transmission to the credit card networks.\n\n#### FDMS Nashville\nRequired if `pointOfSaleInformation.entryMode=keyed` and the address is in the U.S. or Canada.\nOptional if `pointOfSaleInformation.entryMode=keyed` and the address is **not** in the U.S. or Canada.\nNot used if swiped.\n\n#### RBS WorldPay Atlanta:\nFor best card-present keyed rates, send the postal code if `pointOfSaleInformation.entryMode=keyed`.\n\n#### TSYS Acquiring Solutions\nRequired when `processingInformation.billPaymentOptions.billPayment=true` and `pointOfSaleInformation.entryMode=keyed`.\n\n#### All other processors:\nOptional field.\n"
                totalOffersCount:
                  type: string
                  maxLength: 2
                  description: 'Total number of articles/items in the order as a numeric decimal count.

                    Possible values: 00 - 99

                    '
            buyerInformation:
              type: object
              description: Contains information about the buyer.
              properties:
                merchantCustomerId:
                  type: string
                  maxLength: 100
                  description: 'Your identifier for the customer.


                    When a subscription or customer profile is being created, the maximum length for this field for most processors is 30. Otherwise, the maximum length is 100.


                    #### Comercio Latino

                    For recurring payments in Mexico, the value is the customer''s contract number.

                    Note Before you request the authorization, you must inform the issuer of the customer contract numbers that will be used for recurring transactions.


                    #### Worldpay VAP

                    For a follow-on credit with Worldpay VAP, CyberSource checks the following locations, in the order

                    given, for a customer account ID value and uses the first value it finds:

                    1. `customer_account_id` value in the follow-on credit request

                    2. Customer account ID value that was used for the capture that is being credited

                    3. Customer account ID value that was used for the original authorization

                    If a customer account ID value cannot be found in any of these locations, then no value is used.

                    '
                username:
                  type: string
                  maxLength: 255
                  description: Specifies the customer account user name.
                hashedPassword:
                  type: string
                  maxLength: 100
                  description: 'The merchant''s password that CyberSource hashes and stores as a hashed password.

                    '
                dateOfBirth:
                  type: string
                  maxLength: 8
                  description: 'Recipient''s date of birth. **Format**: `YYYYMMDD`.


                    This field is a `pass-through`, which means that CyberSource ensures that the value is eight numeric characters

                    but otherwise does not verify the value or modify it in any way before sending it to the processor. If the field

                    is not required for the transaction, CyberSource does not forward it to the processor.

                    '
                personalIdentification:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: "The type of the identification.\n\nPossible values:\n  - `NATIONAL`\n  - `CPF`\n  - `CPNJ`\n  - `CURP`\n  - `SSN`\n  - `DRIVER_LICENSE`\n  - `PASSPORT_NUMBER`\n  - `PERSONAL_ID`\n  - `TAX_ID`\n  -\t`BR_CPF`     The individual tax ID type, typically is 11 characters long\n  -\t`BR_CNPJ`    The business tax ID type, typically is 14 characters long.\n\nThis field is supported only on the following processors.\n\n#### ComercioLatino\nSet this field to the Cadastro de Pessoas Fisicas (CPF).\n\n#### CyberSource Latin American Processing\nSupported for Redecard in Brazil. Set this field to the Cadastro de Pessoas Fisicas (CPF), which is required for AVS for Redecard in Brazil.\n**Note** CyberSource Latin American Processing is the name of a specific processing connection that CyberSource supports. In the CyberSource API documentation, CyberSource Latin American Processing does not refer to the general topic of processing in Latin America. The information in this field description is for the specific processing connection called CyberSource Latin American Processing. It is not for any other Latin American processors that CyberSource supports.\n"
                      id:
                        type: string
                        maxLength: 26
                        description: "The value of the identification type. This field is supported only on the following processors.\n\n#### ComercioLatino\nSet this field to the Cadastro de Pessoas Fisicas (CPF).\n\n#### CyberSource Latin American Processing\nSupported for Redecard in Brazil. Set this field to the Cadastro de Pessoas Fisicas (CPF), which is required for AVS for Redecard in Brazil.\n**Note** CyberSource Latin American Processing is the name of a specific processing connection that CyberSource supports. In the CyberSource API documentation, CyberSource Latin American Processing does not refer to the general topic of processing in Latin America. The information in this field description is for the specific processing connection called CyberSource Latin American Processing. It is not for any other Latin American processors that CyberSource supports.              \nIf `type = PASSPORT`, this is the cardholder's passport number.\nRecommended for Discover ProtectBuy.\n"
                      issuedBy:
                        type: string
                        description: 'The government agency that issued the driver''s license or passport.


                          If **type**` = DRIVER_LICENSE`, this is the State or province where the customer''s driver''s license was issued.


                          If **type**` = PASSPORT`, this is the Issuing country for the cardholder''s passport. Recommended for Discover ProtectBuy.


                          Use the two-character [State, Province, and Territory Codes for the United States and Canada](https://developer.cybersource.com/library/documentation/sbc/quickref/states_and_provinces.pdf).


                          #### TeleCheck

                          Contact your TeleCheck representative to find out whether this field is required or optional.


                          #### All Other Processors

                          Not used.

                          '
                      verificationResults:
                        type: string
                        description: 'Verification results received from Issuer or Card Network for verification transactions. Response Only Field.

                          '
            deviceInformation:
              type: object
              properties:
                cookiesAccepted:
                  type: string
                  description: 'Whether the customer''s browser accepts cookies. This field can contain one of the following values:

                    - `yes`: The customer''s browser accepts cookies.

                    - `no`: The customer''s browser does not accept cookies.

                    '
                ipAddress:
                  type: string
                  maxLength: 45
                  description: 'IP address of the customer.


                    #### Used by

                    **Authorization, Capture, and Credit**

                    Optional field.

                    '
                hostName:
                  type: string
                  maxLength: 60
                  description: DNS resolved hostname from `ipAddress`.
                fingerprintSessionId:
                  type: string
                  description: 'Field that contains the session ID that you send to Decision Manager to obtain the device fingerprint

                    information. The string can contain uppercase and lowercase letters, digits, hyphen (-), and

                    underscore (_). However, do not use the same uppercase and lowercase letters to indicate

                    different session IDs.


                    The session ID must be unique for each merchant ID. You can use any string that you are already

                    generating, such as an order number or web session ID.


                    The session ID must be unique for each page load, regardless of an individual''s web session ID.

                    If a user navigates to a profiled page and is assigned a web session, navigates away from the

                    profiled page, then navigates back to the profiled page, the generated session ID should be different

                    and unique. You may use a web session ID, but it is preferable to use an application GUID (Globally

                    Unique Identifier). This measure ensures that a unique ID is generated every time the page is

                    loaded, even if it is the same user reloading the page.

                    '
                useRawFingerprintSessionId:
                  type: boolean
                  description: 'Boolean that indicates whether request contains the device fingerprint information.

                    Values:

                    - `true`: Use raw fingerprintSessionId when looking up device details.

                    - `false` (default): Use merchant id + fingerprintSessionId as the session id for Device detail collection.

                    '
                httpBrowserEmail:
                  type: string
                  description: 'Email address set in the customer''s browser, which may differ from customer email.

                    '
                userAgent:
                  type: string
                  maxLength: 40
                  description: 'Customer''s browser as identified from the HTTP header data. For example, `Mozilla` is the value that identifies

                    the Netscape browser.

                    '
                rawData:
                  type: array
                  items:
                    type: object
                    properties:
                      data:
                        type: string
                        description: 'Field that contains the device fingerprint data from the specified provider. The value should be Base64 encoded.

                          '
                      provider:
                        type: string
                        maxLength: 32
                        description: 'Possible values:

                          - cardinal

                          - inauth

                          - threatmetrix

                          '
                httpAcceptBrowserValue:
                  type: string
                  maxLength: 255
                  description: 'Value of the Accept header sent by the customer''s web browser.

                    **Note** If the customer''s browser provides a value, you must include it in your request.

                    '
                httpAcceptContent:
                  type: string
                  maxLength: 256
                  description: 'The exact content of the HTTP accept header.

                    '
                httpBrowserLanguage:
                  type: string
                  maxLength: 8
                  description: 'Value represents the browser language as defined in IETF BCP47.

                    Example:en-US, refer  https://en.wikipedia.org/wiki/IETF_language_tag for more details.

                    '
                httpBrowserJavaEnabled:
                  type: boolean
                  description: 'A Boolean value that represents the ability of the cardholder browser to execute Java.

                    Value is returned from the navigator.javaEnabled property. Possible Values:True/False

                    '
                httpBrowserJavaScriptEnabled:
                  type: boolean
                  description: 'A Boolean value that represents the ability of the cardholder browser to execute JavaScript. Possible Values:True/False.

                    **Note**: Merchants should be able to know the values from fingerprint details of cardholder''s browser.

                    '
                httpBrowserColorDepth:
                  type: string
                  maxLength: 2
                  description: 'Value represents the bit depth of the color palette for displaying images, in bits per pixel.

                    Example : 24, refer https://en.wikipedia.org/wiki/Color_depth for more details

                    '
                httpBrowserScreenHeight:
                  type: string
                  maxLength: 6
                  description: 'Total height of the Cardholder''s scree in pixels, example: 864.

                    '
                httpBrowserScreenWidth:
                  type: string
                  maxLength: 6
                  description: 'Total width of the cardholder''s screen in pixels. Example: 1536.

                    '
                httpBrowserTimeDifference:
                  type: string
                  maxLength: 5
                  description: 'Time difference between UTC time and the cardholder browser local time, in minutes, Example:300

                    '
                userAgentBrowserValue:
                  type: string
                  maxLength: 255
                  description: 'Value of the User-Agent header sent by the customer''s web browser.

                    Note If the customer''s browser provides a value, you must include it in your request.

                    '
            riskInformation:
              type: object
