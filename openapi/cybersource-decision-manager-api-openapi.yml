                      description: 'Name of the active profile chosen by the profile selector. If no profile selector exists,

                        the default active profile is chosen.


                        **Note** By default, your default profile is the active profile, or the Profile Selector chooses the active profile. Use this field

                        only if you want to specify the name of a different profile. The passed-in profile will then become the active profile.

                        '
                eventType:
                  type: string
                  maxLength: 255
                  description: 'Specifies one of the following types of events:

                    - login

                    - account_creation

                    - account_update

                    For regular payment transactions, do not send this field.

                    '
                buyerHistory:
                  type: object
                  properties:
                    customerAccount:
                      type: object
                      properties:
                        lastChangeDate:
                          type: string
                          maxLength: 10
                          description: 'Date the cardholder''s account was last changed.

                            This includes changes to the billing or shipping address, new payment accounts or new users added.

                            Recommended for Discover ProtectBuy.

                            '
                        creationHistory:
                          type: string
                          description: 'The values from the enum can be:

                            - GUEST

                            - NEW_ACCOUNT

                            - EXISTING_ACCOUNT

                            '
                        modificationHistory:
                          type: string
                          description: 'This field is applicable only in case of EXISTING_ACCOUNT in creationHistory. Possible values:

                            - ACCOUNT_UPDATED_NOW

                            - ACCOUNT_UPDATED_PAST

                            '
                        passwordHistory:
                          type: string
                          description: 'This only applies for EXISTING_ACCOUNT in creationHistory.

                            The values from the enum can be:

                            - PASSWORD_CHANGED_NOW

                            - PASSWORD_CHANGED_PAST

                            - PASSWORD_NEVER_CHANGED

                            '
                        createDate:
                          type: string
                          maxLength: 10
                          description: 'Date the cardholder opened the account.

                            Recommended for Discover ProtectBuy.

                            This only applies for EXISTING_ACCOUNT in creationHistory.

                            '
                        passwordChangeDate:
                          type: string
                          maxLength: 10
                          description: 'Date the cardholder last changed or reset password on account.

                            Recommended for Discover ProtectBuy.

                            This only applies for PASSWORD_CHANGED_PAST in passwordHistory.

                            '
                    accountHistory:
                      type: object
                      properties:
                        firstUseOfShippingAddress:
                          type: boolean
                          description: 'Applicable when this is not a guest account.

                            '
                        shippingAddressUsageDate:
                          type: string
                          maxLength: 10
                          description: 'Date when the shipping address for this transaction was first used.

                            Recommended for Discover ProtectBuy.

                            If `firstUseOfShippingAddress` is false and not a guest account, then this date is entered.

                            '
                    accountPurchases:
                      type: integer
                      maxLength: 4
                      description: 'Number of purchases with this cardholder account during the previous six months.

                        Recommended for Discover ProtectBuy.

                        '
                    addCardAttempts:
                      type: integer
                      maxLength: 3
                      description: 'Number of add card attempts in the last 24 hours.

                        Recommended for Discover ProtectBuy.

                        '
                    priorSuspiciousActivity:
                      type: boolean
                      description: 'Indicates whether the merchant experienced suspicious activity (including previous fraud) on the account.

                        Recommended for Discover ProtectBuy.

                        '
                    paymentAccountHistory:
                      type: string
                      description: 'This only applies for NEW_ACCOUNT and EXISTING_ACCOUNT in creationHistory. Possible values are:

                        - PAYMENT_ACCOUNT_EXISTS

                        - PAYMENT_ACCOUNT_ADDED_NOW

                        '
                    paymentAccountDate:
                      type: integer
                      maxLength: 8
                      description: 'Date applicable only for PAYMENT_ACCOUNT_EXISTS in paymentAccountHistory

                        '
                    transactionCountDay:
                      type: integer
                      maxLength: 3
                      description: 'Number of transaction (successful or abandoned) for this cardholder account within the last 24 hours.

                        Recommended for Discover ProtectBuy.

                        '
                    transactionCountYear:
                      type: integer
                      maxLength: 3
                      description: 'Number of transaction (successful or abandoned) for this cardholder account within the last year.

                        Recommended for Discover ProtectBuy.

                        '
                auxiliaryData:
                  type: array
                  items:
                    type: object
                    description: Contains auxiliary key-value pairs.
                    properties:
                      key:
                        type: string
                        maxLength: 255
                        description: 'Fields that you can use to send additional data to Risk services.

                          **Warning** Auxiliary fields are not intended to and MUST NOT

                          be used to capture personally identifying information.

                          Accordingly, merchants are prohibited from capturing,

                          obtaining, and/or transmitting any personally identifying

                          information in or via the auxiliary data fields. Personally

                          identifying information includes, but is not limited to,

                          address, credit card number, social security number,

                          driver''s license number, state-issued identification

                          number, passport number, and card verification numbers

                          (CVV, CVC2, CVV2, CID, CVN). In the event CyberSource

                          discovers that a merchant is capturing and/or transmitting

                          personally identifying information via the auxiliary data

                          fields, whether or not intentionally, CyberSource WILL

                          immediately suspend the merchant''s account, which will

                          result in a rejection of any and all transaction requests

                          submitted by the merchant after the point of suspension.

                          '
                      value:
                        type: string
                        maxLength: 255
                        description: String value for the key
            travelInformation:
              type: object
              properties:
                actualFinalDestination:
                  type: string
                  maxLength: 3
                  description: 'IATA Code for the actual final destination that the customer intends to travel to.

                    It should be a destination on the completeRoute.

                    '
                completeRoute:
                  type: string
                  maxLength: 255
                  description: 'Concatenation of individual travel legs in the format ORIG1-DEST1[:ORIG2-DEST2...:ORIGn-DESTn], for

                    example, SFO-JFK:JFK-LHR:LHR-CDG. For airport codes, see the IATA Airline and Airport Code Search.

                    Note In your request, send either the complete route or the individual legs (_leg#_orig and _leg#_dest). If you

                    send all the fields, the value of _complete_route takes precedence over that of the _leg# fields.

                    '
                departureTime:
                  type: string
                  maxLength: 25
                  description: "Departure date and time of the first leg of the trip. Use one of the following formats:\n  - yyyy-MM-dd HH:mm z\n  - yyyy-MM-dd hh:mm a z\n  - yyyy-MM-dd hh:mma z\n  HH = hour in 24-hour format\n  hh = hour in 12-hour format\n  a = am or pm (case insensitive)\n  z = time zone of the departing flight, for example: If the\n  airline is based in city A, but the flight departs from city\n  B, z is the time zone of city B at the time of departure.\nImportant For travel information, use GMT instead of UTC, or use the local time zone.\nExamples\n2011-03-20 11:30 PM PDT\n2011-03-20 11:30pm GMT\n2011-03-20 11:30pm GMT-05:00\nEastern Standard Time: GMT-05:00 or EST\nNote When specifying an offset from GMT, the format must be exactly as specified in the example. Insert no\nspaces between the time zone and the offset.\n"
                journeyType:
                  type: string
                  maxLength: 32
                  description: Type of travel, for example one way or round trip.
                legs:
                  type: array
                  items:
                    type: object
                    properties:
                      origination:
                        type: string
                        maxLength: 3
                        description: 'Use to specify the airport code for the origin of the leg of the trip, which is designated by the pound (#)

                          symbol in the field name. This code is usually three digits long, for example: SFO = San Francisco.

                          Do not use the colon (:) or the dash (-). For airport codes, see the IATA Airline and Airport Code Search.

                          The leg number can be a positive integer from 0 to N.

                          For example:

                          `travelInformation.legs.0.origination=SFO`

                          `travelInformation.legs.1.origination=SFO`


                          **Note** In your request, send either the complete route or the individual legs (`legs.0.origination` and `legs.n.destination`). If you

                          send all the fields, the complete route takes precedence over the individual legs.


                          For details, see the `decision_manager_travel_leg#_orig` field description in _Decision Manager Using the SCMP API Developer Guide_ on the [CyberSource Business Center.](https://ebc2.cybersource.com/ebc2/) Click **Decision Manager** > **Documentation** > **Guides** > _Decision Manager Using the SCMP API Developer Guide_ (PDF link).

                          '
                      destination:
                        type: string
                        maxLength: 3
                        description: 'Use to specify the airport code for the destination of the leg of the trip, which is designated by the pound (#)

                          symbol in the field name. This code is usually three digits long, for example: SFO = San Francisco. Do not use the

                          colon (:) or the dash (-). For airport codes, see [IATA Airline and Airport Code Search](https://www.iata.org/publications/Pages/code-search.aspx). The leg number can be a

                          positive integer from 0 to N.

                          For example:


                          `travelInformation.legs.0.destination=SFO`

                          `travelInformation.legs.1.destination=SFO`


                          **Note** In your request, send either the complete route or the individual legs (`legs.0.origination` and `legs.n.destination`). If you

                          send all the fields, the complete route takes precedence over the individual legs.


                          For details, see the `decision_manager_travel_leg#_dest` field description in _Decision Manager Using the SCMP API Developer Guide_ on the [CyberSource Business Center.](https://ebc2.cybersource.com/ebc2/) Click **Decision Manager** > **Documentation** > **Guides** > _Decision Manager Using the SCMP API Developer Guide_ (PDF link).

                          '
                      carrierCode:
                        type: string
                        maxLength: 2
                        description: 'International Air Transport Association (IATA) code for the carrier for this leg of the trip.

                          Required for each leg.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
                      departureDate:
                        type: string
                        description: 'Departure date for the first leg of the trip. Format: YYYYMMDD.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
                      departureTime:
                        type: integer
                        maxLength: 4
                        description: 'Time of departure for this leg of the trip. The format is military time and HHMM:

                          If not all zeros, then the hours must be `00-23` and the minutes must be `00-59`.

                          Format: English characters only.

                          Optional request field for travel legs.

                          '
                numberOfPassengers:
                  type: integer
                  maxLength: 3
                  description: 'Number of passengers for whom the ticket was issued.

                    If you do not include this field in your request, CyberSource uses a default value of 1.

                    Required for American Express SafeKey (U.S.) for travel-related requests.

                    '
                passengers:
                  type: array
                  items:
                    type: object
                    properties:
                      firstName:
                        type: string
                        maxLength: 60
                        description: 'First name of the passenger to whom the ticket was issued.

                          If there are multiple passengers, include all listed on the ticket.

                          Do not include special characters such as commas, hyphens, or apostrophes.

                          Only ASCII characters are supported.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
                      lastName:
                        type: string
                        maxLength: 60
                        description: 'Last name of the passenger to whom the ticket was issued.

                          If there are multiple passengers, include all listed on the ticket.

                          Do not include special characters such as commas, hyphens, or apostrophes.

                          Only ASCII characters are supported.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
            merchantDefinedInformation:
              type: array
              items:
                type: object
                description: Contains merchant-defined key-value pairs.
                properties:
                  key:
                    type: string
                    maxLength: 255
                    description: 'Fields that you can use to store information. The value

                      appears in the Case Management Details window in the

                      Business Center. The first four fields are the same fields

                      that are used by the Secure Data services. See request

                      code examples.

                      **Warning** Merchant-defined data fields are not intended

                      to and must not be used to capture personally identifying

                      information. Accordingly, merchants are prohibited from

                      capturing, obtaining, and/or transmitting any personally

                      identifying information in or via the merchant-defined data

                      fields. Personally identifying information includes, but is

                      not limited to, address, credit card number, social security

                      number, driver''s license number, state-issued

                      identification number, passport number, and card

                      verification numbers (CVV, CVC2, CVV2, CID, CVN). In

                      the event CyberSource discovers that a merchant is

                      capturing and/or transmitting personally identifying

                      information via the merchant-defined data fields, whether

                      or not intentionally, CyberSource will immediately

                      suspend the merchant''s account, which will result in a

                      rejection of any and all transaction requests submitted by

                      the merchant after the point of suspension.

                      '
                  value:
                    type: string
                    maxLength: 255
                    description: String value for the key
            merchantInformation:
              type: object
              properties:
                merchantDescriptor:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'Your merchant name.


                        **Note** For Paymentech processor using Cybersource Payouts, the maximum data length is 22.


                        #### PIN debit

                        Your business name. This name is displayed on the cardholder''s statement. When you

                        include more than one consecutive space, extra spaces are removed.


                        When you do not include this value in your PIN debit request, the merchant name from your account is used.

                        **Important** This value must consist of English characters.


                        Optional field for PIN debit credit or PIN debit purchase requests.


                        #### Airline processing

                        Your merchant name. This name is displayed on the cardholder''s statement. When you include more than one consecutive space, extra spaces are removed.


                        **Note** Some airline fee programs may require the original ticket number (ticket identifier) or the ancillary service description in positions 13 through 23 of this field.


                        **Important** This value must consist of English characters.


                        Required for captures and credits.

                        '
                    url:
                      type: string
                      maxLength: 255
                      description: 'Address of company''s website provided by merchant

                        '
                merchantName:
                  type: string
                  maxLength: 25
                  description: 'Your company''s name as you want it to appear to the customer in the issuing bank''s authentication form.

                    This value overrides the value specified by your merchant bank.

                    '
            acquirerInformation:
              type: object
              properties:
                acquirerBin:
                  type: string
                  maxLength: 11
                  description: 'Acquirer bank ID number that  corresponds to a certificate that Cybersource already has.This ID has this format. 4XXXXX for Visa and 5XXXXX for Mastercard.

                    '
                country:
                  type: string
                  maxLength: 2
                  description: 'Issuers need to be aware of the Acquirer''s Country Code when the Acquirer country differs from the Merchant country and the Acquirer is in the EEA (European Economic Area).

                    '
                password:
                  type: string
                  maxLength: 8
                  description: 'Registered password for the Visa directory server.

                    '
                merchantId:
                  type: string
                  maxLength: 15
                  description: 'Username for the visa directory server that is created when your acquirer sets up your account. This ID might be the same as your merchant ID. the username can be 15 or 23 characters.

                    '
            recurringPaymentInformation:
              type: object
              description: This object contains recurring payment information.
              required:
              - frequency
              - endDate
              properties:
                endDate:
                  type: string
                  maxLength: 10
                  description: 'The date after which no further recurring authorizations should be performed. Format: `YYYY-MM-DD`

                    **Note** This field is required for recurring transactions.

                    '
                frequency:
                  type: integer
                  maxLength: 4
                  description: 'Integer value indicating the minimum number of days between recurring authorizations. A frequency

                    of monthly is indicated by the value 28. Multiple of 28 days will be used to indicate months.


                    Example: 6 months = 168


                    Example values accepted (31 days):

                    - 31

                    - 031

                    - 0031


                    **Note** This field is required for recurring transactions.

                    '
                numberOfPayments:
                  type: integer
                  maxLength: 3
                  description: 'Total number of payments for the duration of the recurring subscription.

                    '
                originalPurchaseDate:
                  type: string
                  maxLength: 17
                  description: 'Date of original purchase. Required for recurring transactions.

                    Format: `YYYY-MM-DDTHH:MM:SSZ`

                    **Note**: If this field is empty, the current date is used.

                    '
                sequenceNumber:
                  type: integer
                  maxLength: 3
                  description: "This field is mandatory for Cartes Bancaires recurring transactions on Credit Mutuel-CIC.      \nThis field records recurring sequence, e.g. 1st for initial,  2 for subsequent, 3 etc\n"
                type:
                  type: string
                  maxLength: 1
                  description: 'This contains the type of recurring payment.

                    Valid Values :

                    1 - Registration/First transaction

                    2 - Subsequent transaction

                    3 - Modification

                    4 - Cancellation

                    '
                occurrence:
                  type: string
                  maxLength: 2
                  description: 'This value indicates how often a recurring payment occurs.

                    Valid Values :

                    • 01 (Daily)

                    • 02 (Twice weekly)

                    • 03 (Weekly)

                    • 04 (Ten days)

                    • 05 (Fortnightly)

                    • 06 (Monthly)

                    • 07 (Every two months)

                    • 08 (Trimester)

                    • 09 (Quarterly)

                    • 10 (Twice yearly)

                    • 11 (Annually)

                    • 12 (Unscheduled)

                    '
                validationIndicator:
                  type: string
                  maxLength: 1
                  description: 'This tag will contain a value that indicates whether or not the recurring payment transaction has been validated.

                    Valid values :

                    0- Not validated

                    1- Validated

                    '
                amountType:
                  type: string
                  maxLength: 1
                  description: 'Indicates recurring amount type agreed by the cardholder

                    Valid Values :

                    1- Fixed amount recurring payment

                    2- Recurring payment with maximum amount

                    '
                maximumAmount:
                  type: string
                  maxLength: 12
                  description: 'This API field will contain the maximum amount agreed to by the cardholder. The currency of this amount

                    will be specified in Field 49—Currency Code,Transaction.

                    '
                referenceNumber:
                  type: string
                  maxLength: 35
                  description: 'This will contain a unique reference number for the recurring payment transaction.

                    '
            consumerAuthenticationInformation:
              type: object
              required:
              - deviceChannel
              properties:
                strongAuthentication:
                  type: object
                  properties:
                    authenticationIndicator:
                      type: string
                      maxLength: 2
                      description: 'Indicates the type of Authentication request


                        01 - Payment transaction


                        02 - Recurring transaction


                        03 - Installment transaction


                        04 - Add card


                        05 - Maintain card


                        06 - Cardholder verification as part of EMV token ID and V

                        '
                acsWindowSize:
                  type: string
                  maxLength: 2
                  description: 'An override field that a merchant can pass in to set the challenge window size to display to the end cardholder.  The ACS (Active Control Server) will reply with content that is formatted appropriately to this window size to allow for the best user experience.  The sizes are width x height in pixels of the window displayed in the cardholder browser window.


                    01 - 250x400


                    02 - 390x400


                    03 - 500x600


                    04 - 600x400


                    05 - Full page

                    '
                alternateAuthenticationData:
                  type: string
                  maxLength: 2048
                  description: 'Data that documents and supports a specific authentication process.

                    '
                alternateAuthenticationDate:
                  type: string
                  maxLength: 14
                  description: 'Date and time in UTC of the cardholder authentication. Format: YYYYMMDDHHMM

                    '
                alternateAuthenticationMethod:
                  type: string
                  description: 'Mechanism used by the cardholder to authenticate to the 3D Secure requestor.

                    Possible values:

                    - `01`: No authentication occurred

                    - `02`: Login using merchant system credentials

                    - `03`: Login using Federated ID

                    - `04`: Login using issuer credentials

                    - `05`: Login using third-party authenticator

                    - `06`: Login using FIDO Authenticator

                    '
                authenticationDate:
                  type: string
                  maxLength: 14
                  description: 'The date/time of the authentication at the 3DS servers. RISK update authorization service in auth request

                    payload with value returned in `consumerAuthenticationInformation.alternateAuthenticationData` if merchant calls via CYBS or field can be

                    provided by merchant in authorization request if calling an external 3DS provider.


                    This field is supported for Cartes Bancaires Fast''R transactions on Credit Mutuel-CIC.

                    Format: YYYYMMDDHHMMSS

                    '
                authenticationTransactionId:
                  type: string
                  maxLength: 26
                  description: 'Payer authentication transaction identifier passed to link the check enrollment

                    and validate authentication messages.For Rupay,this is passed only in Re-Send OTP usecase.

                    **Note**: Required for Standard integration, Rupay Seamless server to server integration for enroll service.

                    Required for Hybrid integration for validate service.

                    '
                transactionFlowIndicator:
                  type: integer
                  maxLength: 2
                  description: 'This  field is only applicable to Rupay and is optional. Merchant will have to pass a valid value from 01 through 07 which indicates the transaction flow. Below are the possible values.

                    01:NW- Transaction performed at domestic merchant.

                    02:TW- Transaction performed at domestic merchant along with Token provisioning.

                    03:IT- Transaction performed at International merchant.

                    04:AT- Authentication Transaction Only.

                    05:AW- Authentication transaction for provisioning.

                    06:DI- Domestic InApp Transaction.

                    07:II- International InApp transaction.

                    08:GC- Guest Checkout

                    09:ST- SI Authentication Transaction only

                    10:SW- SI Authorization along with token provisioning

                    '
                challengeCode:
                  type: string
                  description: 'Possible values:

                    - `01`: No preference

                    - `02`: No challenge request

                    - `03`: Challenge requested (3D Secure requestor preference)

                    - `04`: Challenge requested (mandate)

                    - `05`: No challenge requested (transactional risk analysis is already performed)

                    - `06`: No challenge requested (Data share only)

                    - `07`: No challenge requested (strong consumer authentication is already performed)

                    - `08`: No challenge requested (utilize whitelist exemption if no challenge required)

                    - `09`: Challenge requested (whitelist prompt requested if challenge required)

                    **Note** This field will default to `01` on merchant configuration and can be overridden by the merchant.

                    EMV 3D Secure version 2.1.0 supports values `01-04`. Version 2.2.0 supports values `01-09`.

                    '
                challengeStatus:
                  type: string
                  maxLength: 2
                  description: 'The `consumerAuthenticationInformation.challengeCode` indicates the authentication type/level, or challenge, that was presented to the cardholder

                    at checkout by the merchant when calling the Carte Bancaire 3DS servers via CYBS RISK services. It conveys to

                    the issuer the alternative authentication methods that the consumer used.

                    '
                customerCardAlias:
                  type: string
                  maxLength: 128
                  description: 'An alias that uniquely identifies the customer''s account and credit card on file.

                    Note This field is required if Tokenization is enabled in the merchant profile settings.

                    '
                decoupledAuthenticationIndicator:
                  type: string
                  maxLength: 1
                  description: 'Indicates whether the 3DS Requestor requests the ACS to utilize Decoupled Authentication and agrees to utilize Decoupled Authentication if the ACS confirms its use.


                    Possible Values:


                    Y - Decoupled Authentication is supported and preferred if challenge is necessary


                    N - Do not use Decoupled Authentication


                    **Default Value**: N

                    '
                decoupledAuthenticationMaxTime:
                  type: string
                  maxLength: 5
                  description: 'Indicates the maximum amount of time that the 3DS Requestor will wait for an ACS (Active control server) to provide the results of a Decoupled Authentication transaction (in minutes).

                    Possible Values: Numeric values between 1 and 10080 accepted.

                    '
                defaultCard:
                  type: boolean
                  description: 'Indicates that the card being used is the one designated as the primary payment card for purchase.

                    Recommended for Discover ProtectBuy.

                    '
                deviceChannel:
                  type: string
                  maxLength: 10
                  description: 'Determines the channel that the transaction came through. Possible Values: SDK/Browser/3RI. 3RI - 3DS request initiated.

                    '
                installmentTotalCount:
                  type: integer
                  maxLength: 4
                  description: 'An integer value greater than 1 indicating the max number of permitted authorizations for installment payments.

                    **Note** This is required if the merchant and cardholder have agreed to installment payments.

                    '
                merchantFraudRate:
                  type: string
                  maxLength: 2
                  description: 'Calculated by merchants as per PSD2** RTS** (EEA** card fraud divided by all EEA card volumes).

                    Possible Values:

                    1 = Represents fraud rate <=1


                    2 = Represents fraud rate >1 and <=6


                    3 = Represents fraud rate >6 and <=13


                    4 = Represents fraud rate >13 and <=25


                    5 = Represents fraud rate >25


                    EEA** = European Economic Area

                    RTS** = Regulatory Technical Standards

                    PSD2** = Payment Services Directive

                    '
                marketingOptIn:
                  type: boolean
                  description: 'Indicates whether the customer has opted in for marketing offers.

                    Recommended for Discover ProtectBuy.

                    '
                marketingSource:
                  type: string
                  maxLength: 40
                  description: 'Indicates origin of the marketing offer. Recommended for Discover ProtectBuy.

                    '
                mcc:
                  type: string
                  maxLength: 4
                  description: 'Merchant category code.

                    **Important** Required only for Visa Secure transactions in Brazil.

                    Do not use this request field for any other types of transactions.

                    '
                merchantScore:
                  type: integer
                  maxLength: 2
                  description: 'Risk Score provided by merchants. This is specific for CB transactions.

                    '
                messageCategory:
                  type: string
                  description: 'Category of the message for a specific use case. Possible values:


                    - `01`: PA- payment authentication

                    - `02`: NPA- non-payment authentication

                    - `03-79`: Reserved for EMVCo future use (values invalid until defined by EMVCo)

                    - `80-99`: Reserved for DS use

                    '
                npaCode:
                  type: string
                  maxLength: 2
                  description: 'Non-Payer Authentication Indicator.

                    Possible values:

                    - `01`: Add card

                    - `02`: Maintain card information

                    - `03`: Cardholder verification for EMV token

                    - `04-80` Reserved for EMVCo

                    - `80-90` Reserved DS

                    '
                overridePaymentMethod:
                  type: string
                  description: 'Specifies the Brazilian payment account type used for the transaction.

                    This field overrides other payment types that might be specified in the request.

                    Use one of the following values for this field:

                    - `NA`: Not applicable. Do not override other payment types that are specified in the request.

                    - `CR`: Credit card.

                    - `DB`: Debit card.

                    - `VSAVR`: Visa Vale Refeicao

                    - `VSAVA`: Visa Vale Alimentacao

                    **Important** Required only for Visa Secure transactions in Brazil.

                    Do not use this request field for any other types of transactions.

                    '
                overrideCountryCode:
                  type: string
                  maxLength: 2
                  description: 'Two-character [ISO Standard Country Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf)..

                    '
                priorAuthenticationData:
                  type: string
                  maxLength: 2048
                  description: 'This field carry data that the ACS can use to verify the authentication process.

                    '
                priorAuthenticationMethod:
                  type: string
                  maxLength: 2
                  description: 'Mechanism used by the Cardholder to previously authenticate to the 3DS Requestor.


                    01 - Frictionless authentication occurred by ACS


                    02 - Cardholder challenge occurred by ACS


                    03 - AVS verified


                    04 - Other issuer methods


                    05-79 - Reserved for EMVCo future use (values invalid until defined by EMVCo)


                    80-99 - Reserved for DS use

                    '
                priorAuthenticationReferenceId:
                  type: string
                  maxLength: 36
                  description: 'This data element contains a ACS Transaction ID for a prior authenticated transaction.

                    For example, the first recurring transaction that was authenticated with the cardholder

                    '
                priorAuthenticationTime:
                  type: string
                  maxLength: 12
                  description: 'Date and time in UTC of the prior cardholder authentication. Format – YYYYMMDDHHMM

                    '
                productCode:
                  type: string
                  maxLength: 3
                  description: 'Specifies the product code, which designates the type of transaction.

                    Specify one of the following values for this field:

                    - AIR: Airline purchase

                    Important Required for American Express SafeKey (U.S.).

                    - `ACC`: Accommodation Rental

                    - `ACF`: Account funding

                    - `CHA`: Check acceptance

                    - `DIG`: Digital Goods

                    - `DSP`: Cash Dispensing

                    - `GAS`: Fuel

                    - `GEN`: General Retail

                    - `LUX`: Luxury Retail

                    - `PAL`: Prepaid activation and load

                    - `PHY`: Goods or services purchase

                    - `QCT`: Quasi-cash transaction

                    - `REN`: Car Rental

                    - `RES`: Restaurant

                    - `SVC`: Services

                    - `TBD`: Other

                    - `TRA`: Travel

                    **Important** Required for Visa Secure transactions in Brazil.

                    Do not use this request field for any other types of transactions.

                    '
                returnUrl:
                  type: string
                  maxLength: 2048
                  description: 'The URL of the merchant''s return page. CyberSource adds this return URL to the step-up JWT and returns it in the

                    response of the Payer Authentication enrollment call. The merchant''s return URL page serves as a listening URL.

                    Once the bank session completes, the merchant receives a POST to their URL. This response contains the completed

                    bank session''s transactionId. The merchant''s return page should capture the transaction ID and send it in the

                    Payer Authentication validation call.

                    '
                requestorId:
                  type: string
                  maxLength: 35
                  description: Cardinal's directory server assigned 3DS Requestor ID value
                requestorInitiatedAuthenticationIndicator:
                  type: string
                  maxLength: 2
                  description: 'Indicates the type of 3RI request.


                    Possible Values:


                    01 - Recurring transaction


                    02 - Installment transaction


                    03 - Add card


                    04 - Maintain card


                    05 - Account verification


                    06 - Split/delayed shipment


                    07 - Top-up


                    08 - Mail Order


                    09 - Telephone Order


                    10 - Whitelist status check


                    11 - Other payment

                    '
                requestorName:
                  type: string
                  maxLength: 40
                  description: Cardinal's directory server assigned 3DS Requestor Name value
                referenceId:
