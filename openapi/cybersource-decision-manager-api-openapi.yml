  /risk/v1/decisions/{id}/marking:
    post:
      summary: Fraud Marking
      description: 'This can be used to -

        1. Add known fraudulent data to the fraud history

        2. Remove data added to history with Transaction Marking Tool or by uploading chargeback files

        3. Remove chargeback data from history that was automatically added.

        For detailed information, contact your Cybersource representative


        Place the request ID of the transaction you want to mark as suspect (or remove from history) as the path parameter in this request.

        '
      operationId: fraudUpdate
      tags:
      - Decision Manager
      x-devcenter-metaData:
        categoryTag: Risk_Management
      parameters:
      - name: id
        in: path
        required: true
        type: string
        description: Request ID of the transaction that you want to mark as suspect or remove from history.
      - name: fraudMarkingActionRequest
        in: body
        required: true
        schema:
          type: object
          required:
          - riskInformation
          properties:
            riskInformation:
              type: object
              properties:
                markingDetails:
                  type: object
                  description: Details for marking the transaction.
                  properties:
                    notes:
                      type: string
                      description: Notes or details that explain the reasons for marking the transaction as suspect or otherwise.
                      maxLength: 120
                    reason:
                      type: string
                      description: 'Reason for marking the transaction as suspect or otherwise. This field can contain one of the following values:

                        - `fraud_chargeback:` You have received a fraud-related chargeback for the transaction.

                        - `non_fraud_chargeback:` You have received a non-fraudulent chargeback for the transaction.

                        - `suspected:` You believe that you will probably receive a chargeback for the transaction.

                        - `creditback:` You issued a refund to the customer to avoid a chargeback for the transaction.

                        '
                      maxLength: 25
                    fieldsIncluded:
                      type: array
                      description: 'This field can contain one or more of the following values. When you specify more than one value, separate them with commas (,).

                        - `account_key_hash`

                        - `customer_account_id`

                        - `customer_email`

                        - `customer_ipaddress`

                        - `customer_phone`

                        - `device_fingerprint`

                        - `ship_address`

                        If no value is specified, `account_key_hash`, `customer_email`, and `ship_address` are used by default.

                        Note `account_key_hash` adds the field that contains the card number (`customer_cc_number`).

                        '
                      items:
                        type: string
                    action:
                      type: string
                      description: 'This field can contain one of the following values:

                        - add: Mark as Suspect.

                        - clear: Clear Mark as Suspect.

                        - hide: Remove from history.

                        '
            clientReferenceInformation:
              type: object
              properties:
                code:
                  type: string
                  maxLength: 59
                  description: 'Merchant-generated order reference or tracking number. It is recommended that you send a unique value for each

                    transaction so that you can perform meaningful searches for the transaction.


                    #### Used by

                    **Authorization**

                    Required field.


                    #### PIN Debit

                    Requests for PIN debit reversals need to use the same merchant reference number that was used in the transaction that is being

                    reversed.


                    Required field for all PIN Debit requests (purchase, credit, and reversal).


                    #### FDC Nashville Global

                    Certain circumstances can cause the processor to truncate this value to 15 or 17 characters for Level II and Level III processing, which can cause a discrepancy between the value you submit and the value included in some processor reports.

                    '
                comments:
                  type: string
                  maxLength: 255
                  description: 'Brief description of the order or any comment you wish to add to the order.

                    '
                partner:
                  type: object
                  properties:
                    developerId:
                      type: string
                      maxLength: 8
                      description: 'Identifier for the developer that helped integrate a partner solution to CyberSource.


                        Send this value in all requests that are sent through the partner solutions built by that developer.

                        CyberSource assigns the ID to the developer.


                        **Note** When you see a developer ID of 999 in reports, the developer ID that was submitted is incorrect.

                        '
                    solutionId:
                      type: string
                      maxLength: 8
                      description: 'Identifier for the partner that is integrated to CyberSource.


                        Send this value in all requests that are sent through the partner solution. CyberSource assigns the ID to the partner.


                        **Note** When you see a solutionId of 999 in reports, the solutionId that was submitted is incorrect.

                        '
      responses:
        '201':
          description: Successful response
          schema:
            title: riskV1UpdatePost201Response
            type: object
            properties:
              _links:
                type: object
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        description: This is the endpoint of the resource that was created by the successful request.
                      method:
