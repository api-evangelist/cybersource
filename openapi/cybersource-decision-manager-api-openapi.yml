                  maxLength: 50
                  description: 'Reference ID that corresponds to the device fingerprinting data that was collected previously.

                    Note Required for Hybrid integration.

                    '
                sdkMaxTimeout:
                  type: string
                  maxLength: 2
                  description: 'This field indicates the maximum amount of time for all 3DS 2.0 messages to be communicated between all components (in minutes).


                    Possible Values:


                    Greater than or equal to 05 (05 is the minimum timeout to set)


                    Cardinal Default is set to 15


                    NOTE: This field is a required 3DS 2.0 field and Cardinal sends in a default of 15 if nothing is passed

                    '
                secureCorporatePaymentIndicator:
                  type: string
                  maxLength: 1
                  description: 'Indicates dedicated payment processes and procedures were used, potential secure corporate payment exemption applies.

                    Possible Values : 0/1

                    '
                transactionMode:
                  type: string
                  description: 'Transaction mode identifier. Identifies the channel from which the transaction originates.

                    Possible values:


                    - `M`: MOTO (Mail Order Telephone Order)

                    - `R`: Retail

                    - `S`: eCommerce

                    - `P`: Mobile Device

                    - `T`: Tablet

                    '
                whiteListStatus:
                  type: string
                  maxLength: 1
                  description: 'Enables the communication of trusted beneficiary/whitelist status between the ACS, the DS and the 3DS Requestor.


                    Possible Values:


                    Y - 3DS Requestor is whitelisted by cardholder


                    N - 3DS Requestor is not whitelisted by cardholder

                    '
                scoreRequest:
                  type: integer
                  description: Risk Assessment from Mastercard. This is to be sent by merchant if they would like to request a score
            watchlistScreeningInformation:
              type: object
              properties:
                addressOperator:
                  type: string
                  description: 'Parts of the customer''s information that must match with an entry in the DPL (denied parties list)

                    before a match occurs. This field can contain one of the following values:

                    - AND: (default) The customer''s name or company and the customer''s address must appear in the database.

                    - OR: The customer''s name must appear in the database.

                    - IGNORE: You want the service to detect a match only of the customer''s name or company but not of the address.

                    '
                weights:
                  type: object
                  properties:
                    address:
                      type: string
                      maxLength: 6
                      description: 'Degree of correlation between a customer''s address and an entry in the DPL

                        before a match occurs. This field can contain one of the following values:

                        - exact: The address must be identical to the entry in the DPL.

                        - high: (default) The address cannot differ significantly from the entry in the DPL.

                        - medium: The address can differ slightly more from the entry in the DPL.

                        - low: The address can differ significantly from the entry in the DPL.

                        '
                    company:
                      type: string
                      maxLength: 6
                      description: 'Degree of correlation between a company address and an entry in the DPL

                        before a match occurs. This field can contain one of the following values:

                        - exact: The company name must be identical to the entry in the DPL.

                        - high: (default) The company name cannot differ significantly from the entry in the DPL.

                        - medium: The company name can differ slightly more from the entry in the DPL.

                        - low: The company name can differ significantly from the entry in the DPL.

                        '
                    name:
                      type: string
                      maxLength: 6
                      description: 'Degree of correlation between a customer''s name and an entry in the DPL

                        before a match occurs. This field can contain one of the following values:

                        - exact: The name must be identical to the entry in the DPL.

                        - high: (default) The name cannot differ significantly from the entry in the DPL.

                        - medium: The name can differ slightly more from the entry in the DPL.

                        - low: The name can differ significantly the entry in the DPL.

                        '
                sanctionLists:
                  type: array
                  items:
                    type: string
                    maxLength: 255
                  description: 'Use this field to specify which list(s) you want checked with the request.

                    The reply will include the list name as well as the response data.

                    To check against multiple lists, enter multiple list codes separated by a caret (^).

                    For more information, see "Restricted and Denied Parties List," page 68.

                    '
                proceedOnMatch:
                  type: boolean
                  description: 'Indicates whether the transaction should proceed if there is a match.

                    Possible values:

                    - `true`: Transaction proceeds even when match is found in the Denied Parties List. The match is noted in the response.

                    - `false`: Normal watchlist screening behavior occurs. (Transaction stops if a match to DPL occurs. Transaction proceeds if no match.)

                    '
            tokenInformation:
              type: object
              properties:
                jti:
                  type: string
                  maxLength: 64
                  description: 'TMS Transient Token, 64 hexadecimal id value representing captured payment credentials (including Sensitive Authentication Data, e.g. CVV).

                    '
