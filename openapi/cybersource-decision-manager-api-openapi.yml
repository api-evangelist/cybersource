                            type: string
                            maxLength: 15
                            description: 'Passenger''s phone number. If the order is from outside the U.S., CyberSource recommends that you include

                              the [ISO Standard Country Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf).

