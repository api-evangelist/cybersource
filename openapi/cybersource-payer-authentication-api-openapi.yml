                      maxLength: 4000
                      description: 'Represents the encrypted payment data BLOB. The entry for this field is dependent on the payment solution used by the merchant.

                        Used by Authorization and Standalone Credits. Required for authorizations and standalone credits that use a Cybersource suppored Point-to-Point encryption method.

                        Card Present processing

                        This field represents the encrypted payment data generated by the payment terminal/device.

                        '
                    keySerialNumber:
                      type: string
                      description: 'The encoded or encrypted value that a payment solution returns for an authorization request. For details about the valid values for a key, see [Creating an Online Authorization](https://developer.cybersource.com/api/developer-guides/dita-payments/CreatingOnlineAuth.html)

                        '
                    descriptor:
                      type: string
                      maxLength: 128
                      description: 'The identifier for a payment solution, which is sending the encrypted payment data for decryption. Valid values:

                        Samsung Pay: RklEPUNPTU1PTi5TQU1TVU5HLklOQVBQLlBBWU1FTlQ=

                        Note: For other payment solutions, the value may be specific to the terminal or device initiatinf the payment. For example, the descriptor for a Bluefin payment encryption would be a device-generated descriptor.

                        Used by Authorization and Standalone Credits. Required for authorizations and standalone credits.


                        Card Present processing:

                        Format of the encrypted payment data.

                        The value for Bluefin PCI P2PE is `Ymx1ZWZpbg==`. paymentInformation.fluidData.encoding must be `Base64`.

                        The value for Cybersource P2PE decryption depends on the encoding method used and identified in encoding field.

                        If paymentInformation.fluidData.encoding is `Base64`, the value is: `RklEPUVNVi5QQVlNRU5ULkFQSQ==`

                        If paymentInformation.fluidData.encoding is `HEX`, the value is: `4649443D454D562E5041594D454E542E41504`

                        '
                    encoding:
                      type: string
                      maxLength: 6
                      description: 'Encoding method used to encrypt the payment data.

                        Valid values: `Base64`, `HEX`

                        If no value is provided, `Base64` is taken as the default value. And the `Base64` descriptor is used for paymentInformation.fluidData.encoding

                        '
                customer:
                  type: object
                  required:
                  - customerId
                  properties:
                    customerId:
                      type: string
                      description: 'Unique identifier for the legacy Secure Storage token used in the transaction.

                        When you include this value in your request, many of the fields that are normally required for an authorization or credit

                        become optional.

                        '
                      minLength: 1
                      maxLength: 32
                    id:
                      type: string
                      description: 'Unique identifier for the Customer token used in the transaction.

                        When you include this value in your request, many of the fields that are normally required for an authorization or credit

                        become optional.

                        '
                      minLength: 1
                      maxLength: 32
            consumerAuthenticationInformation:
              type: object
              required:
              - authenticationTransactionId
              properties:
                authenticationTransactionId:
                  type: string
                  maxLength: 26
                  description: 'Payer authentication transaction identifier passed to link the check enrollment

                    and validate authentication messages.For Rupay,this is passed only in Re-Send OTP usecase.

                    **Note**: Required for Standard integration, Rupay Seamless server to server integration for enroll service.

                    Required for Hybrid integration for validate service.

                    '
                authenticationTransactionContext:
                  type: string
                  maxLength: 256
                  description: 'Authentication transaction context is used as a unique identifier to link enroll and validate call.

                    '
                otpToken:
                  type: string
                  maxLength: 255
                  description: 'OTP entered by the card holder.

                    '
                responseAccessToken:
                  type: string
                  description: 'JWT returned by the 3D Secure provider when the authentication is complete. Required for Hybrid integration if you use the Cybersource-generated access token. Note: Max. length of this field is 2048 characters.

                    '
                signedParesStatusReason:
                  type: string
                  maxLength: 2
                  description: 'Provides additional information as to why the PAResStatus has a specific value.

                    '
                signedPares:
                  type: string
                  description: 'Payer authentication result (PARes) message returned by the card-issuing bank.

                    If you need to show proof of enrollment checking, you may need to

                    decrypt and parse the string for the information required by the payment card company.

                    For more information, see "Storing Payer Authentication Data," page 160.

                    Important The value is in base64. You must remove all carriage returns and line feeds before

                    adding the PARes to the request.

                    '
                whiteListStatus:
                  type: string
                  maxLength: 1
                  description: 'Enables the communication of trusted beneficiary/whitelist status between the ACS, the DS and the 3DS Requestor.


                    Possible Values:


                    Y - 3DS Requestor is whitelisted by cardholder


                    N - 3DS Requestor is not whitelisted by cardholder

                    '
                credentialEncrypted:
                  type: string
                  maxLength: 10
                  description: A flag to indicate if the passed credential has been encrypted by the Merchant.
            deviceInformation:
              type: object
              properties:
                ipAddress:
                  type: string
                  maxLength: 45
                  description: 'IP address of the customer.


                    #### Used by

                    **Authorization, Capture, and Credit**

                    Optional field.

                    '
            tokenInformation:
              type: object
              properties:
                jti:
                  type: string
                  maxLength: 64
                  description: 'TMS Transient Token, 64 hexadecimal id value representing captured payment credentials (including Sensitive Authentication Data, e.g. CVV).

                    '
      responses:
        '201':
          description: Successful response
          schema:
            title: riskV1AuthenticationResultsPost201Response
            type: object
            properties:
              _links:
                type: object
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        description: This is the endpoint of the resource that was created by the successful request.
                      method:
                        type: string
                        description: '`method` refers to the HTTP method that you can send to the `self` endpoint to retrieve details of the resource.'
              id:
                type: string
                maxLength: 26
                description: 'An unique identification number generated by Cybersource to identify the submitted request. Returned by all services.

                  It is also appended to the endpoint of the resource.

                  On incremental authorizations, this value with be the same as the identification number returned in the original authorization response.

                  '
              submitTimeUtc:
                type: string
                description: 'Time of request in UTC. Format: `YYYY-MM-DDThh:mm:ssZ`

                  **Example** `2016-08-11T22:47:57Z` equals August 11, 2016, at 22:47:57 (10:47:57 p.m.).

                  The `T` separates the date and the time. The `Z` indicates UTC.


                  Returned by Cybersource for all services.

                  '
              status:
                type: string
                description: 'The status for payerAuthentication 201 enroll and validate calls. Possible values are:

                  - `AUTHENTICATION_SUCCESSFUL`

                  - `PENDING_AUTHENTICATION`

                  - `AUTHENTICATION_FAILED`

                  '
              message:
                type: string
                description: 'The message describing the reason of the status. Value is:

                  - The cardholder is enrolled in Payer Authentication. Please authenticate

                  the cardholder before continuing with the transaction.

                  '
              clientReferenceInformation:
                type: object
                properties:
                  code:
                    type: string
                    maxLength: 59
                    description: 'Merchant-generated order reference or tracking number. It is recommended that you send a unique value for each

                      transaction so that you can perform meaningful searches for the transaction.


                      #### Used by

                      **Authorization**

                      Required field.


                      #### PIN Debit

                      Requests for PIN debit reversals need to use the same merchant reference number that was used in the transaction that is being

                      reversed.


                      Required field for all PIN Debit requests (purchase, credit, and reversal).


                      #### FDC Nashville Global

                      Certain circumstances can cause the processor to truncate this value to 15 or 17 characters for Level II and Level III processing, which can cause a discrepancy between the value you submit and the value included in some processor reports.

                      '
                  comments:
                    type: string
                    maxLength: 255
                    description: 'Brief description of the order or any comment you wish to add to the order.

                      '
                  partner:
                    type: object
                    properties:
                      developerId:
                        type: string
                        maxLength: 8
                        description: 'Identifier for the developer that helped integrate a partner solution to CyberSource.


                          Send this value in all requests that are sent through the partner solutions built by that developer.

                          CyberSource assigns the ID to the developer.


                          **Note** When you see a developer ID of 999 in reports, the developer ID that was submitted is incorrect.

                          '
                      solutionId:
                        type: string
                        maxLength: 8
                        description: 'Identifier for the partner that is integrated to CyberSource.


                          Send this value in all requests that are sent through the partner solution. CyberSource assigns the ID to the partner.


                          **Note** When you see a solutionId of 999 in reports, the solutionId that was submitted is incorrect.

                          '
              consumerAuthenticationInformation:
                type: object
                properties:
                  acsRenderingType:
                    type: string
                    description: 'Identifies the UI Type the ACS will use to complete the challenge. **NOTE**: Only available for App transactions using the Cardinal Mobile SDK.

                      '
                  acsReferenceNumber:
                    type: string
                    maxLength: 50
                    description: Unique identifier assigned by the EMVCo Secretariat upon Testing and Approval.
                  acsTransactionId:
                    type: string
                    maxLength: 36
                    description: 'Unique transaction identifier assigned by the ACS to identify a single transaction.

                      '
                  acsOperatorID:
                    type: string
                    description: Directory Server assigned ACS identifier.
                  authenticationResult:
                    type: string
                    description: 'Raw authentication data that comes from the cardissuing bank. Primary authentication field that

                      indicates if authentication was successful and if liability shift occurred. You should examine first the

                      result of this field. This field contains one of these values:

                      - `-1`: Invalid PARes.

                      - `0`: Successful validation.

                      - `1`: Cardholder is not participating, but the attempt to authenticate was recorded.

                      - `6`: Issuer unable to perform authentication.

                      - `9`: Cardholder did not complete authentication.

                      '
                  authenticationType:
                    type: string
                    maxLength: 2
                    description: 'Indicates the type of authentication that will be used to challenge the card holder.


                      Possible Values:


                      01 - Static


                      02 - Dynamic


                      03 - OOB (Out of Band)


                      04 - Decoupled


                      20 - OTP hosted at merchant end. (Rupay S2S flow)

                      **NOTE**:  EMV 3-D Secure version 2.1.0 supports values 01-03.  Version 2.2.0 supports values 01-04.  Decoupled authentication is not supported at this time.

                      '
                  authenticationStatusMsg:
                    type: string
                    description: 'Message that explains the authenticationResult reply field.

                      '
                  authenticationTransactionId:
                    type: string
                    maxLength: 26
                    description: 'Payer authentication transaction identifier is used to link the check

                      enrollment and validate authentication messages. For Rupay, this field should be passed as request only for Resend OTP use case.

                      '
                  authenticationTransactionContextId:
                    type: string
                    maxLength: 30
                    description: 'Payer authentication transaction identifier passed to link the validation and authorization calls.

                      '
                  transactionToken:
                    type: string
                    maxLength: 256
                    description: 'Web based token used to authenticate consumer with Rupay authentication provider.

                      '
                  authorizationPayload:
                    type: string
                    description: 'The Base64 encoded JSON Payload of CB specific Authorization Values returned in the challenge Flow

                      '
                  cavv:
                    type: string
                    maxLength: 255
                    description: 'Unique identifier generated by the card-issuing bank for Visa, American Express, JCB, Diners Club, and

                      Discover transactions after the customer is authenticated. The value is in base64. When you

                      request the card authorization service, CyberSource automatically converts the value, not the field name,

                      to the format required by your payment processor.

                      '
                  cavvAlgorithm:
                    type: string
                    maxLength: 1
                    description: 'Field that is returned only when the CAVV is generated, which occurs when paresStatus

                      contains the values Y (successful authentication) or A (attempted authentication). If

                      you use the ATOS processor, send the value of this field in the `cavv_algorithm` request field of the

                      authorization service. This field contains one of these values:

                      - `2`: Visa, American Express, JCB, Diners Club, and Discover

                      - `3`: Mastercard

                      '
                  challengeCancelCode:
                    type: string
                    maxLength: 2
                    description: 'An indicator as to why the transaction was canceled.

                      Possible Values:


                      - `01`: Cardholder selected Cancel.

                      - `02`: Reserved for future EMVCo use (values invalid until defined by EMVCo).

                      - `03`: Transaction Timed Out—Decoupled Authentication

                      - `04`: Transaction timed out at ACS—other timeouts

                      - `05`: Transaction Timed out at ACS - First CReq not received by ACS

                      - `06`: Transaction Error

                      - `07`: Unknown

                      - `08`: Transaction Timed Out at SDK

                      '
                  directoryServerErrorCode:
                    type: string
                    description: 'The directory server error code indicating a problem with this transaction. Note - Max Length of this field is typically 3 characters.

                      '
                  directoryServerErrorDescription:
                    type: string
                    maxLength: 4096
                    description: 'Directory server text and additional detail about the error for this transaction.

                      '
                  effectiveAuthenticationType:
                    type: string
                    maxLength: 2
                    description: 'This field describes the type of 3DS transaction flow that took place.  It can be one of three possible flows;

                      CH - Challenge

                      FR - Frictionless

                      FD - Frictionless with delegation, (challenge not generated by the issuer but by the scheme on behalf of the issuer).

                      '
                  indicator:
                    type: string
                    description: 'Indicator used to differentiate Internet transactions from other types. The authentication failed if this field

                      is not returned. For Visa, if your payment processor is Streamline, Barclays, AIBMS, or FDC Germany,

                      you receive the value vbv_failure instead of internet when eci is 07.

                      The value of this field is passed automatically to the authorization service if you request the services

                      together. This field contains one of these values:

                      - `aesk`: American Express SafeKey authentication verified successfully.

                      - `aesk_attempted`: Card not enrolled in American Express SafeKey, but the attempt to authenticate was recorded.

                      - `dipb`: Discover ProtectBuy authentication verified successfully.

                      - `dipb_attempted`: Card not enrolled in Discover ProtectBuy, but the attempt to authenticate was recorded.

                      - `internet`: Authentication was not verified successfully.

                      - `js`: J/Secure authentication verified successfully.

                      - `js_attempted`: Card not enrolled in J/Secure, but the attempt to authenticate was recorded.

                      - `moto`: Mail or telephone order.

                      - `pb_attempted`: Card not enrolled in Diners Club ProtectBuy, but the attempt to authenticate was recorded.

                      - `recurring`: Recurring transaction.

                      - `spa`: Mastercard Identity Check authentication verified successfully.

                      - `spa_failure`: Mastercard Identity Check failed authentication.

                      - `vbv`: Visa Secure authentication verified successfully.

                      - `vbv_attempted`: Card not enrolled in Visa Secure, but the attempt to authenticate was recorded.

                      - `vbv_failure`: Visa Secure authentication unavailable.

                      '
                  interactionCounter:
                    type: string
                    maxLength: 2
                    description: 'Indicates the number of authentication cycles attempted by the cardholder and is tracked by the Issuing Banks ACS.Example: if customer gets the challenge window and enter in their one time password and hit submit then that interaction counter should just be 1.

                      When customer gets the challenge window and the bank asks if they want to have the one time password  sent to their phone or their email and they have to choose before going to the next screen to enter in their one time password then this interaction count would be 2.

                      One for the selection of how they want the one time password delivered and another with them actually entering in the one time password and hitting the submit button.

                      '
                  eci:
                    type: string
                    description: 'Note This field applies only to non-U.S-issued cards.


                      For enroll, Numeric electronic commerce indicator (ECI) returned only for Visa, American Express, JCB,

                      Diners Club, and Discover transactions when the card is not enrolled. For more information, see

                      "Interpreting the Reply," page 22.


                      If you are not using the CyberSource payment services, you must send this value to your payment

                      processor in the subsequent request for card authorization. This field contains one of these values:

                      - `06`: The card can be enrolled. Liability shift.

                      - `07`: The card cannot be enrolled. No liability shift.


                      For validate, Numeric electronic commerce indicator (ECI) returned only for Visa, American Express, JCB,

                      Diners Club, and Discover transactions. The field is absent when authentication fails.

                      You must send this value to your payment processor in the subsequent request for card authorization.

                      This field contains one of these values:

                      - `05`: Successful authentication

                      - `06`: Authentication attempted

                      - `07`: Failed authentication (No response from the merchant because of a problem.)

                      '
                  eciRaw:
                    type: string
                    description: 'ECI value that can be returned for Visa, Mastercard, American Express, JCB, Diners Club, and Discover.

                      The field is absent when authentication fails. If your payment processor is Streamline, you must pass the

                      value of this field instead of the value of `eci` or `ucafCollectionIndicator`.


                      This field can contain one of these values:

                      - `01`: Authentication attempted (Mastercard)

                      - `02`: Successful authentication (Mastercard)

                      - `05`: Successful authentication (Visa, American Express, JCB, Diners Club, and Discover)

                      - `06`: Authentication attempted (Visa, American Express, JCB, Diners Club, and Discover)

                      '
                  paresStatus:
                    type: string
                    description: 'Raw result of the authentication check. If you are configured for Asia, Middle East, and Africa Gateway

                      Processing, you need to send the value of this field in your authorization request. This field can contain

                      one of these values:

                      - `A`: Proof of authentication attempt was generated.

                      - `N`: Customer failed or canceled authentication. Transaction denied.

                      - `U`: Authentication not completed regardless of the reason.

                      - `Y`: Customer was successfully authenticated.

                      '
                  sdkTransactionId:
                    type: string
                    maxLength: 36
                    description: 'SDK unique transaction identifier that is generated on each new transaction.

                      '
                  specificationVersion:
                    type: string
                    description: 'This field contains the 3D Secure version that was used to process the transaction. For example: 2.2.0

                      '
                  threeDSServerTransactionId:
                    type: string
                    maxLength: 36
                    description: 'Unique transaction identifier assigned by the 3DS Server to identify a single transaction.

                      '
                  ucafAuthenticationData:
                    type: string
                    description: 'AAV is a unique identifier generated by the card-issuing bank for Mastercard Identity Check

                      transactions after the customer is authenticated. The value is in base64.

                      Include the data in the card authorization request.

                      '
                  ucafCollectionIndicator:
                    type: string
                    description: 'For enroll, Returned only for Mastercard transactions. Indicates that authentication is not required because the

                      customer is not enrolled. Add the value of this field to the authorization field ucaf_collection_indicator.

                      This field can contain these values: 0, 1.


                      For validate, Numeric electronic commerce indicator (ECI) returned only for Mastercard Identity Check

                      transactions. The field is absent when authentication fails. You must send this value to your payment

                      processor in the request for card authorization. This field contain one of these values:

                      - `0`: Authentication data not collected, and customer authentication was not completed.

                      - `1`: Authentication data not collected because customer authentication was not completed.

                      - `2`: Authentication data collected because customer completed authentication.

                      '
                  whiteListStatus:
                    type: string
                    maxLength: 1
                    description: 'Enables the communication of trusted beneficiary/whitelist status between the ACS, the DS and the 3DS Requestor.


                      Possible Values:


                      Y - 3DS Requestor is whitelisted by cardholder


                      N - 3DS Requestor is not whitelisted by cardholder

                      '
                  whiteListStatusSource:
                    type: string
                    maxLength: 2
                    description: 'This data element will be populated by the system setting Whitelist Status. Possible Values: 01 - 3DS/ Server/ 02 – DS/03 - ACS

                      '
                  xid:
                    type: string
                    description: 'Transaction identifier generated by CyberSource for successful enrollment or validation checks.

                      Use this value, which is in base64, to match an outgoing PAReq with an incoming PARes.

                      CyberSource forwards the XID with the card authorization service to these payment processors in these cases:

                      - Barclays

                      - Streamline (when the **ecommerceIndicator**`=spa`)

                      '
                  directoryServerTransactionId:
                    type: string
                    maxLength: 36
                    description: 'The Directory Server Transaction ID is generated by the Mastercard Directory Server during the authentication transaction and passed back to the merchant with the authentication results.

                      For Cybersource Through Visanet Gateway:

                      The value for this field corresponds to the following data in the TC 33 capture file3: Record: CP01 TCR7, Position: 114-149, Field: MC AVV Verification—Directory Server Transaction ID

                      '
              errorInformation:
                type: object
                properties:
                  reason:
                    type: string
                    description: 'The reason of the status. Possible values are:

                      - `INVALID_MERCHANT_CONFIGURATION`

                      - `CONSUMER_AUTHENTICATION_REQUIRED`

                      - `CONSUMER_AUTHENTICATION_FAILED`

                      - `AUTHENTICATION_FAILED`

                      '
                  message:
