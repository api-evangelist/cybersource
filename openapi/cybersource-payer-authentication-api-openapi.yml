                        **NOTE** The meaning of this field is dependent on the payment processor that is returning the value in an authorization reply. Please see the processor-specific details below.


                        #### Barclays and Streamline

                        For Maestro (UK Domestic) and Maestro (International) cards on Barclays and Streamline, this must be a valid value (1900 through

                        3000) but is not required to be a valid expiration date. In other words, an expiration date that is in the past does not cause CyberSource to reject your request. However, an invalid expiration date might cause the issuer to reject your request.


                        #### Encoded Account Numbers

                        For encoded account numbers (`card_ type=039`), if there is no expiration date on the card, use `2021`.


                        #### FDC Nashville Global and FDMS South

                        You can send in 2 digits or 4 digits. When you send in 2 digits, they must be the last 2 digits of

                        the year.


                        #### Samsung Pay and Apple Pay

                        Year in which the token expires. CyberSource includes this field in the reply message when it decrypts the payment blob for the tokenized transaction.


                        **Important** It is your responsibility to determine whether a field is required for the transaction

                        you are requesting.

                        '
                    cryptogram:
                      type: string
                      maxLength: 255
                      description: This field contains token information.
                    securityCode:
                      type: string
                      maxLength: 4
                      description: 'Card Verification Number (CVN).


                        #### Ingenico ePayments

                        Do not include this field when **commerceIndicator=recurring**.

                        **Note** Ingenico ePayments was previously called _Global Collect_.

                        '
                    number:
                      type: string
                      maxLength: 20
                      description: 'Customer''s payment network token value.

                        '
                fluidData:
                  type: object
                  required:
                  - value
                  properties:
                    value:
                      type: string
                      maxLength: 4000
                      description: 'Represents the encrypted payment data BLOB. The entry for this field is dependent on the payment solution used by the merchant.

                        Used by Authorization and Standalone Credits. Required for authorizations and standalone credits that use a Cybersource suppored Point-to-Point encryption method.

                        Card Present processing

                        This field represents the encrypted payment data generated by the payment terminal/device.

                        '
                    keySerialNumber:
                      type: string
                      description: 'The encoded or encrypted value that a payment solution returns for an authorization request. For details about the valid values for a key, see [Creating an Online Authorization](https://developer.cybersource.com/api/developer-guides/dita-payments/CreatingOnlineAuth.html)

                        '
                    descriptor:
                      type: string
                      maxLength: 128
                      description: 'The identifier for a payment solution, which is sending the encrypted payment data for decryption. Valid values:

                        Samsung Pay: RklEPUNPTU1PTi5TQU1TVU5HLklOQVBQLlBBWU1FTlQ=

                        Note: For other payment solutions, the value may be specific to the terminal or device initiatinf the payment. For example, the descriptor for a Bluefin payment encryption would be a device-generated descriptor.

                        Used by Authorization and Standalone Credits. Required for authorizations and standalone credits.


                        Card Present processing:

                        Format of the encrypted payment data.

                        The value for Bluefin PCI P2PE is `Ymx1ZWZpbg==`. paymentInformation.fluidData.encoding must be `Base64`.

                        The value for Cybersource P2PE decryption depends on the encoding method used and identified in encoding field.

                        If paymentInformation.fluidData.encoding is `Base64`, the value is: `RklEPUVNVi5QQVlNRU5ULkFQSQ==`

                        If paymentInformation.fluidData.encoding is `HEX`, the value is: `4649443D454D562E5041594D454E542E41504`

                        '
                    encoding:
                      type: string
                      maxLength: 6
                      description: 'Encoding method used to encrypt the payment data.

                        Valid values: `Base64`, `HEX`

                        If no value is provided, `Base64` is taken as the default value. And the `Base64` descriptor is used for paymentInformation.fluidData.encoding

                        '
                customer:
                  type: object
                  required:
                  - customerId
                  properties:
                    customerId:
                      type: string
                      description: 'Unique identifier for the legacy Secure Storage token used in the transaction.

                        When you include this value in your request, many of the fields that are normally required for an authorization or credit

                        become optional.

                        '
                      minLength: 1
                      maxLength: 32
                    id:
                      type: string
                      description: 'Unique identifier for the Customer token used in the transaction.

                        When you include this value in your request, many of the fields that are normally required for an authorization or credit

                        become optional.

                        '
                      minLength: 1
                      maxLength: 32
            processingInformation:
              type: object
              properties:
                paymentSolution:
                  type: string
                  maxLength: 12
                  description: "Type of digital payment solution for the transaction. Possible Values:\n\n - `visacheckout`: Visa Checkout. This value is required for Visa Checkout transactions. For details, see `payment_solution` field description in [Visa Checkout Using the REST API.](https://developer.cybersource.com/content/dam/docs/cybs/en-us/apifields/reference/all/rest/api-fields.pdf)\n - `001`: Apple Pay.\n - `004`: Cybersource In-App Solution.\n - `005`: Masterpass. This value is required for Masterpass transactions on OmniPay Direct. \n - `006`: Android Pay.\n - `007`: Chase Pay.\n - `008`: Samsung Pay.\n - `012`: Google Pay.\n - `013`: Cybersource P2PE Decryption\n - `014`: Mastercard credential on file (COF) payment network token. Returned in authorizations that use a payment network token associated with a TMS token.\n - `015`: Visa credential on file (COF) payment network token. Returned in authorizations that use a payment network token associated with a TMS token.\n - `027`: Click to Pay.\n"
                visaCheckoutId:
                  type: string
                  maxLength: 48
                  description: 'Identifier for the **Visa Checkout** order. Visa Checkout provides a unique order ID for every transaction in

                    the Visa Checkout **callID** field.

                    '
            tokenInformation:
              type: object
              properties:
                transientToken:
                  type: string
                  description: 'A temporary ID that represents the customer''s payment data (which is securely stored in Visa Data Centers). Flex

                    Microform generates this ID and sets it to expire within 15 minutes from when the ID is generated or until the

                    first payment authorization is carried out (whichever occurs first).


                    Valid value for the ID is a 64-character, alphanumeric string.


                    Example: 1D08M4YB968R1F7YVL4TBBKYVNRIR02VZFH9CBYSQIJJXORPI1NK5C98D7F6EB53

                    '
                jti:
                  type: string
                  maxLength: 64
                  description: 'TMS Transient Token, 64 hexadecimal id value representing captured payment credentials (including Sensitive Authentication Data, e.g. CVV).

                    '
            buyerInformation:
              type: object
              required:
              - mobilePhone
              properties:
                merchantCustomerId:
                  type: string
                  maxLength: 100
                  description: 'Your identifier for the customer.


                    When a subscription or customer profile is being created, the maximum length for this field for most processors is 30. Otherwise, the maximum length is 100.


                    #### Comercio Latino

                    For recurring payments in Mexico, the value is the customer''s contract number.

                    Note Before you request the authorization, you must inform the issuer of the customer contract numbers that will be used for recurring transactions.


                    #### Worldpay VAP

                    For a follow-on credit with Worldpay VAP, CyberSource checks the following locations, in the order

                    given, for a customer account ID value and uses the first value it finds:

                    1. `customer_account_id` value in the follow-on credit request

                    2. Customer account ID value that was used for the capture that is being credited

                    3. Customer account ID value that was used for the original authorization

                    If a customer account ID value cannot be found in any of these locations, then no value is used.

                    '
                personalIdentification:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: "The type of the identification.\n\nPossible values:\n  - `NATIONAL`\n  - `CPF`\n  - `CPNJ`\n  - `CURP`\n  - `SSN`\n  - `DRIVER_LICENSE`\n  - `PASSPORT_NUMBER`\n  - `PERSONAL_ID`\n  - `TAX_ID`\n  -\t`BR_CPF`     The individual tax ID type, typically is 11 characters long\n  -\t`BR_CNPJ`    The business tax ID type, typically is 14 characters long.\n\nThis field is supported only on the following processors.\n\n#### ComercioLatino\nSet this field to the Cadastro de Pessoas Fisicas (CPF).\n\n#### CyberSource Latin American Processing\nSupported for Redecard in Brazil. Set this field to the Cadastro de Pessoas Fisicas (CPF), which is required for AVS for Redecard in Brazil.\n**Note** CyberSource Latin American Processing is the name of a specific processing connection that CyberSource supports. In the CyberSource API documentation, CyberSource Latin American Processing does not refer to the general topic of processing in Latin America. The information in this field description is for the specific processing connection called CyberSource Latin American Processing. It is not for any other Latin American processors that CyberSource supports.\n"
                      id:
                        type: string
                        maxLength: 26
                        description: "The value of the identification type. This field is supported only on the following processors.\n\n#### ComercioLatino\nSet this field to the Cadastro de Pessoas Fisicas (CPF).\n\n#### CyberSource Latin American Processing\nSupported for Redecard in Brazil. Set this field to the Cadastro de Pessoas Fisicas (CPF), which is required for AVS for Redecard in Brazil.\n**Note** CyberSource Latin American Processing is the name of a specific processing connection that CyberSource supports. In the CyberSource API documentation, CyberSource Latin American Processing does not refer to the general topic of processing in Latin America. The information in this field description is for the specific processing connection called CyberSource Latin American Processing. It is not for any other Latin American processors that CyberSource supports.              \nIf `type = PASSPORT`, this is the cardholder's passport number.\nRecommended for Discover ProtectBuy.\n"
                      issuedBy:
                        type: string
                        description: 'The government agency that issued the driver''s license or passport.


                          If **type**` = DRIVER_LICENSE`, this is the State or province where the customer''s driver''s license was issued.


                          If **type**` = PASSPORT`, this is the Issuing country for the cardholder''s passport. Recommended for Discover ProtectBuy.


                          Use the two-character [State, Province, and Territory Codes for the United States and Canada](https://developer.cybersource.com/library/documentation/sbc/quickref/states_and_provinces.pdf).


                          #### TeleCheck

                          Contact your TeleCheck representative to find out whether this field is required or optional.


                          #### All Other Processors

                          Not used.

                          '
                      verificationResults:
                        type: string
                        description: 'Verification results received from Issuer or Card Network for verification transactions. Response Only Field.

                          '
                  description: This array contains detailed information about the buyer's form of persoanl identification.
                mobilePhone:
                  type: integer
                  maxLength: 25
                  description: 'Cardholder''s mobile phone number.

                    **Important** Required for Visa Secure transactions in Brazil.

                    Do not use this request field for any other types of transactions.

                    '
                workPhone:
                  type: integer
                  maxLength: 25
                  description: Cardholder's work phone number.
            deviceInformation:
              type: object
              required:
              - userAgentBrowserValue
              - httpBrowserTimeDifference
              - httpBrowserScreenWidth
