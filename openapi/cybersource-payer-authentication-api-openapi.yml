                referenceNumber:
                  type: string
                  maxLength: 35
                  description: 'This will contain a unique reference number for the recurring payment transaction.

                    '
            consumerAuthenticationInformation:
              type: object
              required:
              - deviceChannel
              properties:
                strongAuthentication:
                  type: object
                  properties:
                    authenticationIndicator:
                      type: string
                      maxLength: 2
                      description: 'Indicates the type of Authentication request


                        01 - Payment transaction


                        02 - Recurring transaction


                        03 - Installment transaction


                        04 - Add card


                        05 - Maintain card


                        06 - Cardholder verification as part of EMV token ID and V

                        '
                acsWindowSize:
                  type: string
                  maxLength: 2
                  description: 'An override field that a merchant can pass in to set the challenge window size to display to the end cardholder.  The ACS (Active Control Server) will reply with content that is formatted appropriately to this window size to allow for the best user experience.  The sizes are width x height in pixels of the window displayed in the cardholder browser window.


                    01 - 250x400


                    02 - 390x400


                    03 - 500x600


                    04 - 600x400


                    05 - Full page

                    '
                alternateAuthenticationData:
                  type: string
                  maxLength: 2048
                  description: 'Data that documents and supports a specific authentication process.

