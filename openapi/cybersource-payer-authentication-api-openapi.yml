                    Possible Values:


                    Y - Decoupled Authentication is supported and preferred if challenge is necessary


                    N - Do not use Decoupled Authentication


                    **Default Value**: N

                    '
                decoupledAuthenticationMaxTime:
                  type: string
                  maxLength: 5
                  description: 'Indicates the maximum amount of time that the 3DS Requestor will wait for an ACS (Active control server) to provide the results of a Decoupled Authentication transaction (in minutes).

                    Possible Values: Numeric values between 1 and 10080 accepted.

                    '
                defaultCard:
                  type: boolean
                  description: 'Indicates that the card being used is the one designated as the primary payment card for purchase.

                    Recommended for Discover ProtectBuy.

                    '
                deviceChannel:
                  type: string
                  maxLength: 10
                  description: 'Determines the channel that the transaction came through. Possible Values: SDK/Browser/3RI. 3RI - 3DS request initiated.

                    '
                installmentTotalCount:
                  type: integer
                  maxLength: 4
                  description: 'An integer value greater than 1 indicating the max number of permitted authorizations for installment payments.

                    **Note** This is required if the merchant and cardholder have agreed to installment payments.

                    '
                merchantFraudRate:
