                    2 = Represents fraud rate >1 and <=6


                    3 = Represents fraud rate >6 and <=13


                    4 = Represents fraud rate >13 and <=25


                    5 = Represents fraud rate >25


                    EEA** = European Economic Area

                    RTS** = Regulatory Technical Standards

                    PSD2** = Payment Services Directive

                    '
                marketingOptIn:
                  type: boolean
                  description: 'Indicates whether the customer has opted in for marketing offers.

                    Recommended for Discover ProtectBuy.

                    '
                marketingSource:
                  type: string
                  maxLength: 40
                  description: 'Indicates origin of the marketing offer. Recommended for Discover ProtectBuy.

                    '
                mcc:
