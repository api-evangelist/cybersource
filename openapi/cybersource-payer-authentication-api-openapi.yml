                        reason:
                          type: string
                          description: "Possible reasons for the error.\n\nPossible values:\n - MISSING_FIELD\n - INVALID_DATA\n"
        '400':
          description: Invalid request.
          schema:
            title: riskV1AuthenticationResultsPost400Response
