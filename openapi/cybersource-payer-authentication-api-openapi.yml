                  maxLength: 4
                  description: 'Merchant category code.

                    **Important** Required only for Visa Secure transactions in Brazil.

                    Do not use this request field for any other types of transactions.

                    '
                merchantScore:
                  type: integer
                  maxLength: 2
                  description: 'Risk Score provided by merchants. This is specific for CB transactions.

                    '
                messageCategory:
                  type: string
                  description: 'Category of the message for a specific use case. Possible values:


                    - `01`: PA- payment authentication

                    - `02`: NPA- non-payment authentication

                    - `03-79`: Reserved for EMVCo future use (values invalid until defined by EMVCo)

                    - `80-99`: Reserved for DS use

                    '
                npaCode:
                  type: string
                  maxLength: 2
                  description: 'Non-Payer Authentication Indicator.

                    Possible values:

                    - `01`: Add card

                    - `02`: Maintain card information

                    - `03`: Cardholder verification for EMV token

                    - `04-80` Reserved for EMVCo

                    - `80-90` Reserved DS

                    '
                overridePaymentMethod:
                  type: string
                  description: 'Specifies the Brazilian payment account type used for the transaction.

                    This field overrides other payment types that might be specified in the request.

                    Use one of the following values for this field:

                    - `NA`: Not applicable. Do not override other payment types that are specified in the request.

                    - `CR`: Credit card.

                    - `DB`: Debit card.

                    - `VSAVR`: Visa Vale Refeicao

                    - `VSAVA`: Visa Vale Alimentacao

                    **Important** Required only for Visa Secure transactions in Brazil.

                    Do not use this request field for any other types of transactions.

                    '
                overrideCountryCode:
                  type: string
                  maxLength: 2
                  description: 'Two-character [ISO Standard Country Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/countries_alpha_list.pdf)..

                    '
                priorAuthenticationData:
                  type: string
                  maxLength: 2048
                  description: 'This field carry data that the ACS can use to verify the authentication process.

                    '
                priorAuthenticationMethod:
                  type: string
                  maxLength: 2
                  description: 'Mechanism used by the Cardholder to previously authenticate to the 3DS Requestor.


                    01 - Frictionless authentication occurred by ACS


                    02 - Cardholder challenge occurred by ACS


                    03 - AVS verified


                    04 - Other issuer methods


                    05-79 - Reserved for EMVCo future use (values invalid until defined by EMVCo)


                    80-99 - Reserved for DS use

                    '
                priorAuthenticationReferenceId:
                  type: string
                  maxLength: 36
                  description: 'This data element contains a ACS Transaction ID for a prior authenticated transaction.

                    For example, the first recurring transaction that was authenticated with the cardholder

                    '
                priorAuthenticationTime:
                  type: string
                  maxLength: 12
                  description: 'Date and time in UTC of the prior cardholder authentication. Format – YYYYMMDDHHMM

                    '
                productCode:
                  type: string
                  maxLength: 3
                  description: 'Specifies the product code, which designates the type of transaction.

                    Specify one of the following values for this field:

                    - AIR: Airline purchase

                    Important Required for American Express SafeKey (U.S.).

                    - `ACC`: Accommodation Rental

                    - `ACF`: Account funding

                    - `CHA`: Check acceptance

                    - `DIG`: Digital Goods

                    - `DSP`: Cash Dispensing

                    - `GAS`: Fuel

                    - `GEN`: General Retail

                    - `LUX`: Luxury Retail

                    - `PAL`: Prepaid activation and load

                    - `PHY`: Goods or services purchase

                    - `QCT`: Quasi-cash transaction

                    - `REN`: Car Rental

                    - `RES`: Restaurant

                    - `SVC`: Services

                    - `TBD`: Other

                    - `TRA`: Travel

                    **Important** Required for Visa Secure transactions in Brazil.

                    Do not use this request field for any other types of transactions.

                    '
                returnUrl:
                  type: string
                  maxLength: 2048
                  description: 'The URL of the merchant''s return page. CyberSource adds this return URL to the step-up JWT and returns it in the

                    response of the Payer Authentication enrollment call. The merchant''s return URL page serves as a listening URL.

                    Once the bank session completes, the merchant receives a POST to their URL. This response contains the completed

                    bank session''s transactionId. The merchant''s return page should capture the transaction ID and send it in the

                    Payer Authentication validation call.

                    '
                requestorId:
                  type: string
                  maxLength: 35
                  description: Cardinal's directory server assigned 3DS Requestor ID value
                requestorInitiatedAuthenticationIndicator:
                  type: string
                  maxLength: 2
                  description: 'Indicates the type of 3RI request.


                    Possible Values:


                    01 - Recurring transaction


                    02 - Installment transaction


                    03 - Add card


                    04 - Maintain card


                    05 - Account verification


                    06 - Split/delayed shipment


                    07 - Top-up


                    08 - Mail Order


                    09 - Telephone Order


                    10 - Whitelist status check


                    11 - Other payment

                    '
                requestorName:
                  type: string
                  maxLength: 40
                  description: Cardinal's directory server assigned 3DS Requestor Name value
                referenceId:
                  type: string
                  maxLength: 50
                  description: 'Reference ID that corresponds to the device fingerprinting data that was collected previously.

                    Note Required for Hybrid integration.

                    '
                sdkMaxTimeout:
                  type: string
                  maxLength: 2
                  description: 'This field indicates the maximum amount of time for all 3DS 2.0 messages to be communicated between all components (in minutes).


                    Possible Values:


                    Greater than or equal to 05 (05 is the minimum timeout to set)


                    Cardinal Default is set to 15


                    NOTE: This field is a required 3DS 2.0 field and Cardinal sends in a default of 15 if nothing is passed

                    '
                secureCorporatePaymentIndicator:
                  type: string
                  maxLength: 1
                  description: 'Indicates dedicated payment processes and procedures were used, potential secure corporate payment exemption applies.

                    Possible Values : 0/1

                    '
                transactionMode:
                  type: string
                  description: 'Transaction mode identifier. Identifies the channel from which the transaction originates.

                    Possible values:


                    - `M`: MOTO (Mail Order Telephone Order)

                    - `R`: Retail

                    - `S`: eCommerce

                    - `P`: Mobile Device

                    - `T`: Tablet

                    '
                whiteListStatus:
                  type: string
                  maxLength: 1
                  description: 'Enables the communication of trusted beneficiary/whitelist status between the ACS, the DS and the 3DS Requestor.


                    Possible Values:


                    Y - 3DS Requestor is whitelisted by cardholder


                    N - 3DS Requestor is not whitelisted by cardholder

                    '
                scoreRequest:
                  type: integer
                  description: Risk Assessment from Mastercard. This is to be sent by merchant if they would like to request a score
            riskInformation:
              type: object
              properties:
                buyerHistory:
                  type: object
                  properties:
                    customerAccount:
                      type: object
                      properties:
                        lastChangeDate:
                          type: string
                          maxLength: 10
                          description: 'Date the cardholder''s account was last changed.

                            This includes changes to the billing or shipping address, new payment accounts or new users added.

                            Recommended for Discover ProtectBuy.

                            '
                        creationHistory:
                          type: string
                          description: 'The values from the enum can be:

                            - GUEST

                            - NEW_ACCOUNT

                            - EXISTING_ACCOUNT

                            '
                        modificationHistory:
                          type: string
                          description: 'This field is applicable only in case of EXISTING_ACCOUNT in creationHistory. Possible values:

                            - ACCOUNT_UPDATED_NOW

                            - ACCOUNT_UPDATED_PAST

                            '
                        passwordHistory:
                          type: string
                          description: 'This only applies for EXISTING_ACCOUNT in creationHistory.

                            The values from the enum can be:

                            - PASSWORD_CHANGED_NOW

                            - PASSWORD_CHANGED_PAST

                            - PASSWORD_NEVER_CHANGED

                            '
                        createDate:
                          type: string
                          maxLength: 10
                          description: 'Date the cardholder opened the account.

                            Recommended for Discover ProtectBuy.

                            This only applies for EXISTING_ACCOUNT in creationHistory.

                            '
                        passwordChangeDate:
                          type: string
                          maxLength: 10
                          description: 'Date the cardholder last changed or reset password on account.

                            Recommended for Discover ProtectBuy.

                            This only applies for PASSWORD_CHANGED_PAST in passwordHistory.

                            '
                    accountHistory:
                      type: object
                      properties:
                        firstUseOfShippingAddress:
                          type: boolean
                          description: 'Applicable when this is not a guest account.

                            '
                        shippingAddressUsageDate:
                          type: string
                          maxLength: 10
                          description: 'Date when the shipping address for this transaction was first used.

                            Recommended for Discover ProtectBuy.

                            If `firstUseOfShippingAddress` is false and not a guest account, then this date is entered.

                            '
                    accountPurchases:
                      type: integer
                      maxLength: 4
                      description: 'Number of purchases with this cardholder account during the previous six months.

                        Recommended for Discover ProtectBuy.

                        '
                    addCardAttempts:
                      type: integer
                      maxLength: 3
                      description: 'Number of add card attempts in the last 24 hours.

                        Recommended for Discover ProtectBuy.

                        '
                    priorSuspiciousActivity:
                      type: boolean
                      description: 'Indicates whether the merchant experienced suspicious activity (including previous fraud) on the account.

                        Recommended for Discover ProtectBuy.

                        '
                    paymentAccountHistory:
                      type: string
                      description: 'This only applies for NEW_ACCOUNT and EXISTING_ACCOUNT in creationHistory. Possible values are:

                        - PAYMENT_ACCOUNT_EXISTS

                        - PAYMENT_ACCOUNT_ADDED_NOW

                        '
                    paymentAccountDate:
                      type: integer
                      maxLength: 8
                      description: 'Date applicable only for PAYMENT_ACCOUNT_EXISTS in paymentAccountHistory

                        '
                    transactionCountDay:
                      type: integer
                      maxLength: 3
                      description: 'Number of transaction (successful or abandoned) for this cardholder account within the last 24 hours.

                        Recommended for Discover ProtectBuy.

                        '
                    transactionCountYear:
                      type: integer
                      maxLength: 3
                      description: 'Number of transaction (successful or abandoned) for this cardholder account within the last year.

                        Recommended for Discover ProtectBuy.

                        '
            travelInformation:
              type: object
              properties:
                legs:
                  type: array
                  items:
                    type: object
                    properties:
                      origination:
                        type: string
                        maxLength: 3
                        description: 'Use to specify the airport code for the origin of the leg of the trip, which is designated by the pound (#)

                          symbol in the field name. This code is usually three digits long, for example: SFO = San Francisco.

                          Do not use the colon (:) or the dash (-). For airport codes, see the IATA Airline and Airport Code Search.

                          The leg number can be a positive integer from 0 to N.

                          For example:

                          `travelInformation.legs.0.origination=SFO`

                          `travelInformation.legs.1.origination=SFO`


                          **Note** In your request, send either the complete route or the individual legs (`legs.0.origination` and `legs.n.destination`). If you

                          send all the fields, the complete route takes precedence over the individual legs.


                          For details, see the `decision_manager_travel_leg#_orig` field description in _Decision Manager Using the SCMP API Developer Guide_ on the [CyberSource Business Center.](https://ebc2.cybersource.com/ebc2/) Click **Decision Manager** > **Documentation** > **Guides** > _Decision Manager Using the SCMP API Developer Guide_ (PDF link).

                          '
                      destination:
                        type: string
                        maxLength: 3
                        description: 'Use to specify the airport code for the destination of the leg of the trip, which is designated by the pound (#)

                          symbol in the field name. This code is usually three digits long, for example: SFO = San Francisco. Do not use the

                          colon (:) or the dash (-). For airport codes, see [IATA Airline and Airport Code Search](https://www.iata.org/publications/Pages/code-search.aspx). The leg number can be a

                          positive integer from 0 to N.

                          For example:


                          `travelInformation.legs.0.destination=SFO`

                          `travelInformation.legs.1.destination=SFO`


                          **Note** In your request, send either the complete route or the individual legs (`legs.0.origination` and `legs.n.destination`). If you

                          send all the fields, the complete route takes precedence over the individual legs.


                          For details, see the `decision_manager_travel_leg#_dest` field description in _Decision Manager Using the SCMP API Developer Guide_ on the [CyberSource Business Center.](https://ebc2.cybersource.com/ebc2/) Click **Decision Manager** > **Documentation** > **Guides** > _Decision Manager Using the SCMP API Developer Guide_ (PDF link).

                          '
                      carrierCode:
                        type: string
                        maxLength: 2
                        description: 'International Air Transport Association (IATA) code for the carrier for this leg of the trip.

                          Required for each leg.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
                      departureDate:
                        type: string
                        description: 'Departure date for the first leg of the trip. Format: YYYYMMDD.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
                      departureTime:
                        type: integer
                        maxLength: 4
                        description: 'Time of departure for this leg of the trip. The format is military time and HHMM:

                          If not all zeros, then the hours must be `00-23` and the minutes must be `00-59`.

                          Format: English characters only.

                          Optional request field for travel legs.

                          '
                numberOfPassengers:
                  type: integer
                  maxLength: 3
                  description: 'Number of passengers for whom the ticket was issued.

                    If you do not include this field in your request, CyberSource uses a default value of 1.

                    Required for American Express SafeKey (U.S.) for travel-related requests.

                    '
                passengers:
                  type: array
                  items:
                    type: object
                    properties:
                      firstName:
                        type: string
                        maxLength: 60
                        description: 'First name of the passenger to whom the ticket was issued.

                          If there are multiple passengers, include all listed on the ticket.

                          Do not include special characters such as commas, hyphens, or apostrophes.

                          Only ASCII characters are supported.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
                      lastName:
                        type: string
                        maxLength: 60
                        description: 'Last name of the passenger to whom the ticket was issued.

                          If there are multiple passengers, include all listed on the ticket.

                          Do not include special characters such as commas, hyphens, or apostrophes.

                          Only ASCII characters are supported.

                          Required for American Express SafeKey (U.S.) for travel-related requests.

                          '
            merchantDefinedInformation:
              type: array
              items:
                type: object
                description: Contains merchant-defined key-value pairs.
                properties:
                  key:
                    type: string
                    maxLength: 255
                    description: 'Fields that you can use to store information. The value

                      appears in the Case Management Details window in the

                      Business Center. The first four fields are the same fields

                      that are used by the Secure Data services. See request

                      code examples.

                      **Warning** Merchant-defined data fields are not intended

                      to and must not be used to capture personally identifying

                      information. Accordingly, merchants are prohibited from

                      capturing, obtaining, and/or transmitting any personally

                      identifying information in or via the merchant-defined data

                      fields. Personally identifying information includes, but is

                      not limited to, address, credit card number, social security

                      number, driver''s license number, state-issued

                      identification number, passport number, and card

                      verification numbers (CVV, CVC2, CVV2, CID, CVN). In

                      the event CyberSource discovers that a merchant is

                      capturing and/or transmitting personally identifying

                      information via the merchant-defined data fields, whether

                      or not intentionally, CyberSource will immediately

                      suspend the merchant''s account, which will result in a

                      rejection of any and all transaction requests submitted by

                      the merchant after the point of suspension.

                      '
                  value:
                    type: string
                    maxLength: 255
                    description: String value for the key
      responses:
        '201':
          description: Successful response
          schema:
            title: riskV1AuthenticationsPost201Response
            type: object
            properties:
              _links:
                type: object
                properties:
                  self:
                    type: object
                    properties:
                      href:
                        type: string
                        description: This is the endpoint of the resource that was created by the successful request.
                      method:
                        type: string
                        description: '`method` refers to the HTTP method that you can send to the `self` endpoint to retrieve details of the resource.'
              id:
                type: string
                maxLength: 26
                description: 'An unique identification number generated by Cybersource to identify the submitted request. Returned by all services.

                  It is also appended to the endpoint of the resource.

                  On incremental authorizations, this value with be the same as the identification number returned in the original authorization response.

                  '
              submitTimeUtc:
                type: string
                description: 'Time of request in UTC. Format: `YYYY-MM-DDThh:mm:ssZ`

                  **Example** `2016-08-11T22:47:57Z` equals August 11, 2016, at 22:47:57 (10:47:57 p.m.).

                  The `T` separates the date and the time. The `Z` indicates UTC.


                  Returned by Cybersource for all services.

                  '
              status:
                type: string
                description: 'The status for payerAuthentication 201 enroll and validate calls. Possible values are:

                  - `AUTHENTICATION_SUCCESSFUL`

                  - `PENDING_AUTHENTICATION`

                  - `AUTHENTICATION_FAILED`

                  '
              message:
                type: string
                description: 'The message describing the reason of the status. Value is:

                  - The cardholder is enrolled in Payer Authentication. Please authenticate

                  the cardholder before continuing with the transaction.

                  '
              clientReferenceInformation:
                type: object
                properties:
                  code:
                    type: string
                    maxLength: 59
                    description: 'Merchant-generated order reference or tracking number. It is recommended that you send a unique value for each

                      transaction so that you can perform meaningful searches for the transaction.


                      #### Used by

                      **Authorization**

                      Required field.


                      #### PIN Debit

                      Requests for PIN debit reversals need to use the same merchant reference number that was used in the transaction that is being

                      reversed.


                      Required field for all PIN Debit requests (purchase, credit, and reversal).


                      #### FDC Nashville Global

                      Certain circumstances can cause the processor to truncate this value to 15 or 17 characters for Level II and Level III processing, which can cause a discrepancy between the value you submit and the value included in some processor reports.

                      '
                  comments:
                    type: string
                    maxLength: 255
                    description: 'Brief description of the order or any comment you wish to add to the order.

                      '
                  partner:
                    type: object
                    properties:
                      developerId:
                        type: string
                        maxLength: 8
                        description: 'Identifier for the developer that helped integrate a partner solution to CyberSource.


                          Send this value in all requests that are sent through the partner solutions built by that developer.

                          CyberSource assigns the ID to the developer.


                          **Note** When you see a developer ID of 999 in reports, the developer ID that was submitted is incorrect.

                          '
                      solutionId:
                        type: string
                        maxLength: 8
                        description: 'Identifier for the partner that is integrated to CyberSource.


                          Send this value in all requests that are sent through the partner solution. CyberSource assigns the ID to the partner.


                          **Note** When you see a solutionId of 999 in reports, the solutionId that was submitted is incorrect.

                          '
              orderInformation:
                type: object
                properties:
                  amountDetails:
                    type: object
                    properties:
                      currency:
                        type: string
                        maxLength: 3
                        description: 'Currency used for the order. Use the three-character [ISO Standard Currency Codes.](http://apps.cybersource.com/library/documentation/sbc/quickref/currencies.pdf)


                          #### Used by

                          **Authorization**

                          Required field.


                          **Authorization Reversal**

                          For an authorization reversal (`reversalInformation`) or a capture (`processingOptions.capture` is set to `true`), you must use the same currency that you used in your payment authorization request.


                          #### PIN Debit

                          Currency for the amount you requested for the PIN debit purchase. This value is returned for partial authorizations. The issuing bank can approve a partial amount if the balance on the debit card is less than the requested transaction amount. For the possible values, see the [ISO Standard Currency Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/currencies.pdf).

                          Returned by PIN debit purchase.


                          For PIN debit reversal requests, you must use the same currency that was used for the PIN debit purchase or PIN debit credit that you are reversing.

                          For the possible values, see the [ISO Standard Currency Codes](https://developer.cybersource.com/library/documentation/sbc/quickref/currencies.pdf).


                          Required field for PIN Debit purchase and PIN Debit credit requests.

                          Optional field for PIN Debit reversal requests.


                          #### GPX

                          This field is optional for reversing an authorization or credit.


                          #### DCC for First Data

                          Your local currency.


                          #### Tax Calculation

                          Required for international tax and value added tax only.

                          Optional for U.S. and Canadian taxes.

                          Your local currency.

                          '
              consumerAuthenticationInformation:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: 'JSON Web Token (JWT) used to authenticate the consumer with the authentication provider, such as, CardinalCommerce or Rupay.

                      Note - Max Length of this field is 2048 characters.

                      '
                  acsRenderingType:
                    type: string
                    description: 'Identifies the UI Type the ACS will use to complete the challenge. **NOTE**: Only available for App transactions using the Cardinal Mobile SDK.

                      '
                  acsTransactionId:
                    type: string
                    maxLength: 36
                    description: 'Unique transaction identifier assigned by the ACS to identify a single transaction.

                      '
                  acsUrl:
                    type: string
                    maxLength: 2048
                    description: 'URL for the card-issuing bank''s authentication form that you receive when the card is enrolled.

                      The value can be very large.

                      '
                  authenticationPath:
                    type: string
                    description: 'Indicates what displays to the customer during the authentication process.

                      This field can contain one of these values:

                      - `ADS`: (Card not enrolled) customer prompted to activate the card during the checkout process.

                      - `ATTEMPTS`: (Attempts processing) Processing briefly displays before the checkout process is completed.

                      - `ENROLLED`: (Card enrolled) the card issuer''s authentication window displays.

                      - `UNKNOWN`: Card enrollment status cannot be determined.

                      - `NOREDIRECT`: (Card not enrolled, authentication unavailable, or error occurred) nothing displays to the customer.


                      The following values can be returned if you are using rules-based payer authentication.

                      - `RIBA`: The card-issuing bank supports risk-based authentication, but whether the cardholder is likely

                      to be challenged cannot be determined.

                      - `RIBA_PASS`: The card-issuing bank supports risk-based authentication and it is likely that the

                      cardholder will not be challenged to provide credentials, also known as _silent authentication_.

                      '
                  authorizationPayload:
                    type: string
                    description: 'The Base64 encoded JSON Payload of CB specific Authorization Values returned in the challenge Flow

                      '
                  authenticationType:
                    type: string
                    maxLength: 2
                    description: 'Indicates the type of authentication that will be used to challenge the card holder.


                      Possible Values:


                      01 - Static


                      02 - Dynamic


                      03 - OOB (Out of Band)


                      04 - Decoupled


                      20 - OTP hosted at merchant end. (Rupay S2S flow)

                      **NOTE**:  EMV 3-D Secure version 2.1.0 supports values 01-03.  Version 2.2.0 supports values 01-04.  Decoupled authentication is not supported at this time.

                      '
                  authenticationTransactionId:
                    type: string
                    maxLength: 26
                    description: 'Payer authentication transaction identifier is used to link the check

                      enrollment and validate authentication messages. For Rupay, this field should be passed as request only for Resend OTP use case.

                      '
                  authenticationTransactionContextId:
                    type: string
                    maxLength: 30
                    description: 'Payer authentication transaction identifier passed to link the validation and authorization calls.

                      '
                  validityPeriod:
                    type: integer
                    maxLength: 2
                    description: 'Describes validity of OTP in minutes for incoming transaction.        .

                      '
                  cardholderMessage:
                    type: string
                    maxLength: 128
                    description: 'Text provided by the ACS/Issuer to Cardholder during a Frictionless or Decoupled transaction.The Issuer can provide information to Cardholder.

                      For example, "Additional authentication is needed for this transaction, please contact (Issuer Name) at xxx-xxx-xxxx.".

                      The Issuing Bank can optionally support this value.

                      '
                  cavv:
                    type: string
                    maxLength: 255
                    description: 'Unique identifier generated by the card-issuing bank for Visa, American Express, JCB, Diners Club, and

                      Discover transactions after the customer is authenticated. The value is in base64. When you

                      request the card authorization service, CyberSource automatically converts the value, not the field name,

                      to the format required by your payment processor.

                      '
                  cavvAlgorithm:
                    type: string
                    maxLength: 1
                    description: 'Field that is returned only when the CAVV is generated, which occurs when paresStatus

                      contains the values Y (successful authentication) or A (attempted authentication). If

                      you use the ATOS processor, send the value of this field in the `cavv_algorithm` request field of the

                      authorization service. This field contains one of these values:

                      - `2`: Visa, American Express, JCB, Diners Club, and Discover

                      - `3`: Mastercard

                      '
                  challengeCancelCode:
                    type: string
                    maxLength: 2
                    description: 'An indicator as to why the transaction was canceled.

                      Possible Values:


                      - `01`: Cardholder selected Cancel.

                      - `02`: Reserved for future EMVCo use (values invalid until defined by EMVCo).

                      - `03`: Transaction Timed Out—Decoupled Authentication

                      - `04`: Transaction timed out at ACS—other timeouts

                      - `05`: Transaction Timed out at ACS - First CReq not received by ACS

                      - `06`: Transaction Error

                      - `07`: Unknown

                      - `08`: Transaction Timed Out at SDK

                      '
                  challengeRequired:
                    type: string
                    maxLength: 1
                    description: 'Indicates whether a challenge is required in order to complete authentication.

                      **Note** Regional mandates might determine that a challenge is required.


                      Possible values:

                      - `Y`: Challenge required

                      - `N`: Challenge not required

                      **Note**  Used by the Hybrid integration.

                      '
                  decoupledAuthenticationIndicator:
                    type: string
                    maxLength: 1
                    description: 'Indicates whether the 3DS Requestor requests the ACS to utilize Decoupled Authentication and agrees to utilize Decoupled Authentication if the ACS confirms its use.


                      Possible Values:


                      Y - Decoupled Authentication is supported and preferred if challenge is necessary


                      N - Do not use Decoupled Authentication


                      **Default Value**: N

                      '
                  directoryServerErrorCode:
                    type: string
                    description: 'The directory server error code indicating a problem with this transaction. Note - Max Length of this field is typically 3 characters.

                      '
                  directoryServerErrorDescription:
                    type: string
                    maxLength: 4096
                    description: 'Directory server text and additional detail about the error for this transaction.

                      '
                  ecommerceIndicator:
                    type: string
                    maxLength: 255
                    description: 'Commerce indicator for cards not enrolled. This field contains one of these values:

                      - `internet`: Card not enrolled, or card type not supported by payer authentication. No liability shift.

                      - `js_attempted`: Card not enrolled, but attempt to authenticate is recorded. Liability shift.

                      - `js_failure`: J/Secure directory service is not available. No liability shift.

                      - `spa`: Mastercard card not enrolled in the SecureCode program. No liability shift.

                      - `vbv_attempted`: Card not enrolled, but attempt to authenticate is recorded. Liability shift.

                      - `vbv_failure`: For payment processor Barclays, Streamline, AIBMS, or FDC Germany, you receive

                      this result if Visa''s directory service is not available. No liability shift.

                      '
                  eci:
                    type: string
                    description: 'Note This field applies only to non-U.S-issued cards.


                      For enroll, Numeric electronic commerce indicator (ECI) returned only for Visa, American Express, JCB,

                      Diners Club, and Discover transactions when the card is not enrolled. For more information, see

                      "Interpreting the Reply," page 22.


                      If you are not using the CyberSource payment services, you must send this value to your payment

                      processor in the subsequent request for card authorization. This field contains one of these values:

                      - `06`: The card can be enrolled. Liability shift.

                      - `07`: The card cannot be enrolled. No liability shift.


                      For validate, Numeric electronic commerce indicator (ECI) returned only for Visa, American Express, JCB,

                      Diners Club, and Discover transactions. The field is absent when authentication fails.

                      You must send this value to your payment processor in the subsequent request for card authorization.

                      This field contains one of these values:

                      - `05`: Successful authentication

                      - `06`: Authentication attempted

                      - `07`: Failed authentication (No response from the merchant because of a problem.)

                      '
                  eciRaw:
                    type: string
                    description: 'ECI value that can be returned for Visa, Mastercard, American Express, JCB, Diners Club, and Discover.

                      The field is absent when authentication fails. If your payment processor is Streamline, you must pass the

                      value of this field instead of the value of `eci` or `ucafCollectionIndicator`.


                      This field can contain one of these values:

                      - `01`: Authentication attempted (Mastercard)

                      - `02`: Successful authentication (Mastercard)

                      - `05`: Successful authentication (Visa, American Express, JCB, Diners Club, and Discover)

                      - `06`: Authentication attempted (Visa, American Express, JCB, Diners Club, and Discover)

                      '
                  effectiveAuthenticationType:
                    type: string
                    maxLength: 2
                    description: 'This field describes the type of 3DS transaction flow that took place.  It can be one of three possible flows;

                      CH - Challenge

                      FR - Frictionless

                      FD - Frictionless with delegation, (challenge not generated by the issuer but by the scheme on behalf of the issuer).

                      '
                  exemptionDataRaw:
                    type: string
                    maxLength: 4
                    description: "Payer authentication exemption indicator for Carte Bancaire exemptions. \nThis is used with unbundled authentication and authorizations calls, for example: \"low fraud merchant program\".\nThe value returned in this field should be passed in the authorization request under the field -\n`consumerAuthenticationInformation.strongAuthentication.issuerInformation.exemptionDataRaw`.\n"
                  ivr:
                    type: object
                    properties:
                      enabledMessage:
                        type: boolean
                        description: 'Flag to indicate if a valid IVR transaction was detected.

                          '
                      encryptionKey:
                        type: string
                        maxLength: 16
                        description: 'Encryption key to be used in the event the ACS requires encryption of the credential field.

                          '
                      encryptionMandatory:
                        type: boolean
                        description: 'Flag to indicate if the ACS requires the credential to be encrypted.

                          '
                      encryptionType:
                        type: string
                        maxLength: 20
                        description: 'An indicator from the ACS to inform the type of encryption that should be used in the event the ACS requires encryption of the credential field.

                          '
                      label:
                        type: string
                        maxLength: 20
                        description: 'An ACS Provided label that can be presented to the Consumer. Recommended use with an application.

                          '
                      prompt:
                        type: string
                        maxLength: 80
                        description: 'An ACS provided string that can be presented to the Consumer. Recommended use with an application.

                          '
                      statusMessage:
                        type: string
                        maxLength: 80
                        description: 'An ACS provided message that can provide additional information or details.

                          '
                  networkScore:
                    type: string
                    maxLength: 2
                    description: 'The global score calculated by the CB scoring platform and returned to merchants.

                      '
                  pareq:
                    type: string
                    description: 'Payer authentication request (PAReq) message that you need to forward to the ACS.

                      The value can be very large. The value is in base64.

                      '
                  paresStatus:
                    type: string
                    description: 'Raw result of the authentication check. If you are configured for Asia, Middle East, and Africa Gateway

                      Processing, you need to send the value of this field in your authorization request. This field can contain

                      one of these values:

                      - `A`: Proof of authentication attempt was generated.

                      - `N`: Customer failed or canceled authentication. Transaction denied.

                      - `U`: Authentication not completed regardless of the reason.

                      - `Y`: Customer was successfully authenticated.

                      '
                  proofXml:
                    type: string
                    description: "Date and time of the enrollment check combined with the VEReq and VERes elements. If you ever need\nto show proof of enrollment checking, you may need to parse the string for the information required by the\npayment card company. The value can be very large. \nFor cards issued in the U.S. or Canada, Visa may require this data for specific merchant category codes.For cards not issued in the U.S. or Canada, your bank may require this data as proof of enrollment\nchecking for any payer authentication transaction that you re-present because of a chargeback.\n"
                  proxyPan:
                    type: string
                    description: 'Encrypted version of the card number used in the payer authentication request message.

                      '
                  sdkTransactionId:
                    type: string
                    maxLength: 36
                    description: 'SDK unique transaction identifier that is generated on each new transaction.

                      '
                  signedParesStatusReason:
                    type: string
                    maxLength: 2
                    description: 'Provides additional information as to why the PAResStatus has a specific value.

                      '
                  specificationVersion:
                    type: string
                    description: 'This field contains the 3D Secure version that was used to process the transaction. For example: 2.2.0

                      '
                  stepUpUrl:
                    type: string
                    maxLength: 2048
                    description: 'The fully qualified URL that the merchant uses to post a form to the cardholder in order to complete the Consumer Authentication transaction for the Cardinal Cruise API integration.

                      '
                  threeDSServerTransactionId:
                    type: string
                    maxLength: 36
                    description: 'Unique transaction identifier assigned by the 3DS Server to identify a single transaction.

                      '
                  ucafAuthenticationData:
                    type: string
                    description: 'AAV is a unique identifier generated by the card-issuing bank for Mastercard Identity Check

                      transactions after the customer is authenticated. The value is in base64.

                      Include the data in the card authorization request.

                      '
                  ucafCollectionIndicator:
                    type: string
                    description: 'For enroll, Returned only for Mastercard transactions. Indicates that authentication is not required because the

                      customer is not enrolled. Add the value of this field to the authorization field ucaf_collection_indicator.

                      This field can contain these values: 0, 1.


                      For validate, Numeric electronic commerce indicator (ECI) returned only for Mastercard Identity Check

                      transactions. The field is absent when authentication fails. You must send this value to your payment

                      processor in the request for card authorization. This field contain one of these values:

                      - `0`: Authentication data not collected, and customer authentication was not completed.

                      - `1`: Authentication data not collected because customer authentication was not completed.

                      - `2`: Authentication data collected because customer completed authentication.

                      '
                  veresEnrolled:
                    type: string
                    description: 'Result of the enrollment check. This field can contain one of these values:

                      - `Y`: Card enrolled or can be enrolled; you must authenticate. Liability shift.

                      - `N`: Card not enrolled; proceed with authorization. Liability shift.

                      - `U`: Unable to authenticate regardless of the reason. No liability shift.


                      **Note** This field only applies to the Asia, Middle East, and Africa Gateway. If you are configured for

                      this processor, you must send the value of this field in your authorization request.


                      The following value can be returned if you are using rules-based Payer Authentication:

                      - `B`: Indicates that authentication was bypassed.

                      '
                  whiteListStatusSource:
                    type: string
                    maxLength: 2
                    description: 'This data element will be populated by the system setting Whitelist Status. Possible Values: 01 - 3DS/ Server/ 02 – DS/03 - ACS

                      '
                  xid:
                    type: string
                    description: 'Transaction identifier generated by CyberSource for successful enrollment or validation checks.

                      Use this value, which is in base64, to match an outgoing PAReq with an incoming PARes.

                      CyberSource forwards the XID with the card authorization service to these payment processors in these cases:

                      - Barclays

                      - Streamline (when the **ecommerceIndicator**`=spa`)

                      '
                  directoryServerTransactionId:
                    type: string
                    maxLength: 36
                    description: 'The Directory Server Transaction ID is generated by the Mastercard Directory Server during the authentication transaction and passed back to the merchant with the authentication results.

                      For Cybersource Through Visanet Gateway:

                      The value for this field corresponds to the following data in the TC 33 capture file3: Record: CP01 TCR7, Position: 114-149, Field: MC AVV Verification—Directory Server Transaction ID

                      '
                  acsOperatorID:
                    type: string
                    description: Directory Server assigned ACS identifier.
                  acsReferenceNumber:
                    type: string
                    maxLength: 50
                    description: Unique identifier assigned by the EMVCo Secretariat upon Testing and Approval.
                  idciDecision:
                    type: string
                    maxLength: 20
                    description: Decision on the Risk Assessment from Mastercard.
                  idciReasonCode1:
                    type: string
                    maxLength: 20
                    description: ReasonCode from Mastercard
                  idciReasonCode2:
                    type: string
                    maxLength: 20
                    description: ReasonCode from Mastercard
                  idciScore:
                    type: integer
                    description: Risk Assessment from Mastercard
              errorInformation:
                type: object
                properties:
                  reason:
                    type: string
                    description: 'The reason of the status. Possible values are:

                      - `INVALID_MERCHANT_CONFIGURATION`

                      - `CONSUMER_AUTHENTICATION_REQUIRED`

                      - `CONSUMER_AUTHENTICATION_FAILED`

                      - `AUTHENTICATION_FAILED`

                      '
                  message:
                    type: string
                    description: The detail message related to the status and reason listed above.
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          description: This is the flattened JSON object field name/path that is either missing or invalid.
                        reason:
                          type: string
                          description: "Possible reasons for the error.\n\nPossible values:\n - MISSING_FIELD\n - INVALID_DATA\n"
        '400':
          description: Invalid request
          schema:
            title: riskV1AuthenticationsPost400Response
            type: object
            properties:
              submitTimeUtc:
                type: string
                description: 'Time of request in UTC. Format: `YYYY-MM-DDThh:mm:ssZ`

                  **Example** `2016-08-11T22:47:57Z` equals August 11, 2016, at 22:47:57 (10:47:57 p.m.).

                  The `T` separates the date and the time. The `Z` indicates UTC.


                  Returned by Cybersource for all services.

                  '
              status:
                type: string
                description: 'The status for payerAuthentication 400 enroll and validate calls. Value is:

                  - `INVALID_REQUEST`

                  '
              reason:
                type: string
                description: 'The reason of the status.


                  Possible Values:

                  - `MISSING_FIELD`

                  - `INVALID_DATA`

                  '
              message:
                type: string
                description: 'The message describing the reason of the status. Value is:

                  - Encountered a Payer Authentication problem. Payer could not be authenticated.

                  '
              details:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: This is the flattened JSON object field name/path that is either missing or invalid.
                    reason:
                      type: string
                      description: "Possible reasons for the error.\n\nPossible values:\n - MISSING_FIELD\n - INVALID_DATA\n"
        '502':
          description: Unexpected system error or system timeout.
          schema:
            title: riskV1AuthenticationsPost502Response
            type: object
            properties:
              submitTimeUtc:
                type: string
                description: 'Time of request in UTC. Format: `YYYY-MM-DDThh:mm:ssZ`

                  **Example** `2016-08-11T22:47:57Z` equals August 11, 2016, at 22:47:57 (10:47:57 p.m.).

                  The `T` separates the date and the time. The `Z` indicates UTC.


                  Returned by Cybersource for all services.

                  '
              status:
                type: string
                description: "The status of the submitted transaction.\n\nPossible values:\n - SERVER_ERROR\n"
              reason:
                type: string
                description: "The reason of the status.\n\nPossible values:\n - SYSTEM_ERROR\n - SERVER_TIMEOUT\n - SERVICE_TIMEOUT\n"
              message:
                type: string
                description: The detail message related to the status and reason listed above.
