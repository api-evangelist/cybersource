                    • 04 (Ten days)

                    • 05 (Fortnightly)

                    • 06 (Monthly)

                    • 07 (Every two months)

                    • 08 (Trimester)

                    • 09 (Quarterly)

                    • 10 (Twice yearly)

                    • 11 (Annually)

                    • 12 (Unscheduled)

                    '
                validationIndicator:
                  type: string
                  maxLength: 1
                  description: 'This tag will contain a value that indicates whether or not the recurring payment transaction has been validated.

                    Valid values :

                    0- Not validated

                    1- Validated

