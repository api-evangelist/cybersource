                      description: Workplace benefit amount.
                    benefitType:
                      type: string
                      maxLength: 100
                      description: 'Workplace benefit type.

                        Possible values:

                        - 70 = employee benefit

                        - 4T = transportation / transit

                        - 52 = general benefit

