        required: true
      - name: v-c-correlation-id
        in: header
        type: string
        required: true
      - name: v-c-organization-id
        in: header
        type: string
        required: true
      - name: id
        in: path
        description: Request ID generated by Cybersource. This was sent in the header on the request. Echo value from v-c-request-id
        required: true
        type: string
        maxLength: 26
