                      Possible values:

                      - ''INVALID_MERCHANT_CONFIGURATION''

                      - ''NOT_ELIGIBLE''

                      - ''CURRENCY_NOT_CONFIGURED''

                      - ''BIN_UNKNOWN''

                      - ''CURRENCY_MATCH''

