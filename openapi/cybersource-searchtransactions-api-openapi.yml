                                  maxLength: 6
                                  description: 'Bank Identification Number (BIN). This is the initial four to six numbers on a credit card account number.


                                    #### Google Pay transactions

                                    For PAN-based Google Pay transactions, this field is returned in the API response.

                                    '
                                type:
