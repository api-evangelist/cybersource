  /tms/v2/tokens/{instrumentIdentifierId}/{tokenProvider}/assets/{assetType}:
    get:
      summary: Retrieve Card Art
      description: 'Retrieves Card Art for a specific Instrument Identifier. The Card Art is a visual representation of the cardholder''s payment card.

        Card Art is only available if a Network Token is successfully provisioned.

        '
      parameters:
      - name: instrumentIdentifierId
        in: path
        description: The Id of an Instrument Identifier.
        required: true
        type: string
        minLength: 12
        maxLength: 32
      - name: tokenProvider
        in: path
        description: The token provider.
        required: true
        type: string
