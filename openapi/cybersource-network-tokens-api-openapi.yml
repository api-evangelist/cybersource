  /tms/v3/tokens/{tokenId}/payment-credentials:
    post:
      summary: Generate Payment Credentials Latest Version v3
      description: '**Payment Credentials**<br>Contains payment information such as the network token, generated TAVV cryptogram for Visa & MasterCard, dynamic CVV for Amex, or DTVV cryptogram for VISA. This latest version (v3) returns the Primary Account Number details, if the network token is not present. The response is provided in JSON Web Encryption (JWE) format. <br>Your system can use this API to retrieve the Payment Credentials for an existing Customer, Payment Instrument, Instrument Identifier or Tokenized Card.<br>Optionally, **authenticated identities** information from Passkey authentication can be provided to potentially achieve liability shift, which may result in the return of an e-commerce indicator of 5 if successful.

        '
      parameters:
      - name: profile-id
        in: header
        description: The Id of a profile containing user specific TMS configuration.
        required: false
        type: string
        minLength: 36
        maxLength: 36
        x-hide-field: true
      - name: tokenId
        in: path
        description: The Id of a token representing a Customer, Payment Instrument or Instrument Identifier.
        required: true
        type: string
        minLength: 1
        maxLength: 32
      - name: postPaymentCredentialsRequest
        in: body
        required: true
        schema:
          type: object
          properties:
            paymentCredentialType:
              type: string
              description: "The type of payment credentials to be returned.\nBy default, payment credentials include network token and cryptogram or dynamic CVV.\nIf \"NETWORK_TOKEN\" is supplied then only network token card number will be returned and no cryptogram or dynamic CVV will be requested.\nIf \"SECURITY_CODE\" is supplied then dynamic CVV will be requested and returned with the network token card number. Dynamic CVV is only supported for Amex and SCOF.\nIf \"CRYPTOGRAM\" is supplied then cryptogram will be requested and returned with the network token card number. Cryptogram is NOT supported for Amex.\n\nPossible Values:\n  - NETWORK_TOKEN\n  - SECURITY_CODE\n  - CRYPTOGRAM\n"
              example: CRYPTOGRAM
            transactionType:
              type: string
              description: "Specifies the type of transaction for which the network token credentials are required.\nPossible Values:\n  - ECOM: Ecommerce transaction. If transactionType is not provided, ECOM is set as the default.\n  - AFT: Account Funding Transaction. This is only supported for VISA and paymentCredentialType of CRYPTOGRAM.\n"
              example: ECOM
            clientCorrelationId:
              type: string
              maxLength: 36
              pattern: '[A-Za-z0-9]+'
              description: 'Used to correlate authentication and payment credential requests.

                '
              example: ad30cf0c-b825-42ca-806c-bf06094b0b15
            orderInformation:
              type: object
              properties:
                amountDetails:
                  type: object
                  properties:
                    totalAmount:
                      type: string
                      description: Total amount for the order
                      example: '102.21'
                    currency:
                      type: string
                      description: 'Currency used for the order. Use an ISO 4217 numeric format currency code.

                        '
                      example: '978'
                billTo:
                  type: object
                  properties:
                    firstName:
                      type: string
                      maxLength: 60
                      description: 'Customer''s first name. This name must be the same as the name on the card.

                        '
                      example: John
                    lastName:
                      type: string
                      maxLength: 60
                      description: 'Customer''s last name. This name must be the same as the name on the card.

                        '
                      example: Doe
                    address1:
                      type: string
                      maxLength: 60
                      description: 'Payment card billing street address as it appears on the credit card issuer''s records.

                        '
                      example: 1 Market St
                    locality:
                      type: string
                      maxLength: 50
                      description: 'Payment card billing city.

                        '
                      example: San Francisco
                    administrativeArea:
                      type: string
                      maxLength: 20
                      description: 'State or province of the billing address. Use the State, Province, and Territory Codes for the United States

                        and Canada.

                        '
                      example: CA
                    postalCode:
                      type: string
                      maxLength: 10
                      description: 'Postal code for the billing address. The postal code must consist of 5 to 9 digits.


                        When the billing country is the U.S., the 9-digit postal code must follow this format:

                        [5 digits][dash][4 digits]


                        **Example** `12345-6789`


                        When the billing country is Canada, the 6-digit postal code must follow this format:

                        [alpha][numeric][alpha][space][numeric][alpha][numeric]


                        **Example** `A1B 2C3`

                        '
                      example: '94105'
                    country:
                      type: string
                      maxLength: 2
                      description: 'Payment card billing country. Use the two-character ISO Standard Country Codes.

                        '
                      example: US
                    email:
                      type: string
                      maxLength: 255
                      description: 'Customer''s email address, including the full domain name.

                        '
                      example: test@cybs.com
            merchantInformation:
              type: object
              properties:
                merchantDescriptor:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Merchant's name
                      example: TWVyY2hhbnQgVlphRjVYQmo
                    url:
                      type: string
                      description: Address of company's website provided by merchant
                      example: aHR0cHM6Ly93d3cuTWVyY2hhbnQtVlphRjVYQmouY29t
            deviceInformation:
              type: object
              properties:
                platformType:
                  type: string
                  description: "Platform type.\n\nPossible Values:\n  - iOS: iOS app\n  - ANDROID: Android app\n  - WINDOWS: Windows app\n  - WEB: Browser-based app\n"
                  example: WEB
                ipAddress:
                  type: string
                  maxLength: 45
                  pattern: '[0-9A-Fa-f.]'
                  description: 'IP address of the customer.

                    '
                  example: 127.0.0.1
                httpAcceptContent:
                  type: string
                  pattern: '[A-Za-z0-9]+'
                  maxLength: 2048
                  description: 'The exact content of the HTTP accept header.

                    '
                  example: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
                httpBrowserLanguage:
                  type: string
                  pattern: '[A-Za-z0-9]+'
                  maxLength: 8
                  description: 'Value represents the browser language as defined in IETF BCP47.

                    Example:en-US, refer  https://en.wikipedia.org/wiki/IETF_language_tag for more details.

                    '
                  example: en-US
                httpBrowserJavaEnabled:
                  type: boolean
                  description: 'A Boolean value that represents the ability of the cardholder browser to execute Java.

                    Value is returned from the navigator.javaEnabled property. Possible Values:True/False

                    '
                  example: false
                httpBrowserJavaScriptEnabled:
                  type: boolean
                  description: 'A Boolean value that represents the ability of the cardholder browser to execute JavaScript. Possible Values:True/False.

                    **Note**: Merchants should be able to know the values from fingerprint details of cardholder''s browser.

                    '
                  example: true
                httpBrowserColorDepth:
                  type: string
                  pattern: '[0-9]+'
                  maxLength: 2
                  description: 'Value represents the bit depth of the color palette for displaying images, in bits per pixel.

                    Example : 24, refer https://en.wikipedia.org/wiki/Color_depth for more details

                    '
                  example: '24'
                httpBrowserScreenHeight:
                  type: string
                  pattern: '[0-9]+'
                  maxLength: 6
                  description: 'Total height of the Cardholder''s screen in pixels.

                    '
                  example: '1080'
                httpBrowserScreenWidth:
                  type: string
                  pattern: '[0-9]+'
                  maxLength: 6
                  description: 'Total width of the cardholder''s screen in pixels.

                    '
                  example: '1920'
                httpBrowserTimeDifference:
                  type: string
                  pattern: '[0-9]+'
                  maxLength: 5
                  description: 'Time difference between UTC time and the cardholder browser local time, in minutes.

                    '
                  example: '420'
                userAgentBrowserValue:
                  type: string
                  pattern: '[A-Za-z0-9]+'
                  maxLength: 2048
                  description: 'Value of the User-Agent header sent by the customer''s web browser.

                    Note If the customer''s browser provides a value, you must include it in your request.

                    '
                  example: Mozilla/5.0(WindowsNT10.0;Win64;x64)AppleWebKit/537.36(KHTML,likeGecko)Chrome/134.0.0.0Safari/537.36Edg/134.0.0.0
            authenticatedIdentities:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    pattern: '[A-Za-z0-9=-_]+'
                    maxLength: 50
                    description: "The id from the authenticated identity.\n Base64URL encoded string (RFC4648). \n The encoding is the same as Base64, but uses '-' characters instead of '+' and '_' characters instead of '/'.\n"
                    example: 88662a11a11fa88627e217ab9cb00001
                  provider:
                    type: string
                    description: "The provider of the authenticated identity.\n\nPossible Values:\n  - VISA_PAYMENT_PASSKEY\n  - CLIENT_DEVICE_CERT_JWS\n"
                    example: VISA_PAYMENT_PASSKEY
                  data:
                    type: string
                    pattern: '[A-Za-z0-9=-_]+'
                    maxLength: 17000
                    description: 'The data from the authenticated identity.

                      For Passkey this could be the FIDO Attestation.

                      For Classic Cloud Token Framework (CTF) this could be a JWS containing device authentication information signed by a devices private key.

                      Base64URL encoded string (RFC4648).

                      The encoding is the same as Base64, but uses ''-'' characters instead of ''+'' and ''_'' characters instead of ''/''.

                      '
                    example: dj0xJmM9ezAwMX06QUFSTk
                  relyingPartyId:
                    type: string
                    pattern: '[A-Za-z0-9=-_]+'
                    maxLength: 2000
                    description: "The id of the Relying Party.\n Base64URL encoded string (RFC4648).\n The encoding is the same as Base64, but uses '-' characters instead of '+' and '_' characters instead of '/'.\n"
                    example: dnRzLmF1dGgudmlzYS5jb20=
                  userAuthenticationMethod:
                    type: string
                    description: "The method used to authenticate the user.\n\nPossible Values:\n  - USERNAME_PASSWORD\n  - PASSCODE_PASSWORD\n  - PASSCODE\n  - PASSWORD\n  - PATTERN\n  - BIOMETRIC_FINGERPRINT\n  - BIOMETRIC_FACIAL\n  - BIOMETRIC_IRIS\n  - BIOMETRIC_VOICE\n  - BIOMETRIC_BEHAVIORAL\n  - DEVICE_UNLOCKED_METHOD_UNKNOWN\n  - OTP_SMS\n  - OTP_EMAIL\n  - OTP_SMS_KNOWLEDGE\n  - KNOWLEDGE_BASED_AUTHENTICATION\n  - USER_UNVERIFIED\n  - BIOMETRIC\n"
                    example: BIOMETRIC_FINGERPRINT
