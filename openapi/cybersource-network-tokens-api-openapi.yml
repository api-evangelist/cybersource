  /tms/v2/tokenized-cards/{tokenizedCardId}/issuer-life-cycle-event-simulations:
    post:
      summary: Simulate Issuer Life Cycle Management Events
      description: '**Lifecycle Management Events**<br>Simulates an issuer life cycle manegement event for updates on the tokenized card.

        The events that can be simulated are:

        - Token status changes (e.g. active, suspended, deleted)

        - Updates to the underlying card, including card art changes, expiration date changes, and card number suffix.

        **Note:** This is only available in CAS environment.

        '
      parameters:
      - name: profile-id
        in: header
        required: true
        type: string
        description: The Id of a profile containing user specific TMS configuration.
        minLength: 36
        maxLength: 36
      - name: tokenizedCardId
        in: path
        description: The Id of a tokenized card.
        required: true
        type: string
        minLength: 12
        maxLength: 32
      - name: postIssuerLifeCycleSimulationRequest
        in: body
        required: true
        schema:
          type: object
          description: 'Represents the Issuer LifeCycle Event Simulation for a Tokenized Card.

            '
          properties:
            state:
              type: string
              description: 'The new state of the Tokenized Card.

                Possible Values:

                - ACTIVE

                - SUSPENDED

                - DELETED

                '
            card:
              type: object
              properties:
                last4:
                  type: string
                  maxLength: 4
                  description: 'The new last 4 digits of the card number associated to the Tokenized Card.

                    '
                expirationMonth:
                  type: string
                  maxLength: 2
                  description: 'The new two-digit month of the card associated to the Tokenized Card.

                    Format: `MM`.

                    Possible Values: `01` through `12`.

                    '
                expirationYear:
                  type: string
                  maxLength: 4
                  description: 'The new four-digit year of the card associated to the Tokenized Card.

                    Format: `YYYY`.

                    '
            metadata:
              type: object
              properties:
                cardArt:
                  type: object
                  properties:
                    combinedAsset:
                      type: object
                      properties:
                        update:
                          type: string
                          description: 'Set to "true" to simulate an update to the combined card art asset associated with the Tokenized Card.

                            '
      tags:
      - Network Tokens
      operationId: postIssuerLifeCycleSimulation
      x-devcenter-metaData:
        categoryTag: Token_Management
        developerGuides: https://developer.cybersource.com/docs/cybs/en-us/tms/developer/all/rest/tms/tms-net-tkn-intro/tms-net-tkn-lcm-simulate-intro.html
      consumes:
      - application/json;charset=utf-8
      produces:
      - application/json;charset=utf-8
      responses:
        '204':
          description: The request is fulfilled but does not need to return a body
          headers:
            v-c-correlation-id:
              description: The mandatory correlation Id passed by upstream (calling) system.
              type: string
