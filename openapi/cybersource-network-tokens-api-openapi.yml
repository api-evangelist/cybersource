      x-devcenter-metaData:
        categoryTag: Token_Management
        developerGuides: https://developer.cybersource.com/docs/cybs/en-us/tms/developer/all/rest/tms/tms-net-tkn-intro/tms-net-tkn-partner-retrieve-pay-cred-intro.html
        mleForRequest: optional
      consumes:
      - application/json;charset=utf-8
      produces:
      - application/jose;charset=utf-8
      responses:
        '201':
          description: "A base64 encoded JSON Web Encryption (JWE) response containing encrypted Payment Credentials.\n\nExample JWE Header:\n  ```json\n  {\n    \"kid\": \"a0eb65d572e556fddb68eb3a4078555605f7b283\",\n    \"cty\": \"json\",\n    \"typ\": \"JWT\",\n    \"enc\": \"A256GCM\",\n   \"alg\": \"RSA-OAEP-256\"\n  }\n  ```\n\nWhen cryptogram is requested or returned by default (paymentCredentialType: CRYPTOGRAM), the response includes cryptogram and ECI values for Visa/Mastercard. \nWhen security code is requested (paymentCredentialType: SECURITY_CODE), the response includes:\n- For American Express: Dynamic Card Secure Code (DCSC) returned by default\n- For Visa: DTVV cryptogram when explicitly requested<br>\n\nThe decrypted Payment Credentials response may include:\n\n<details>\n  <summary>Decrypted Payment Credentials for Tokenized Card</summary>\n  \n```json\n{\n    \"_links\": {\n      \"tokenizedCard\": {\n        \"href\": \"/tms/v2/tokenized-cards/47CA8267360FD3EAE063AF598E0A5792\"\n      }\n    },\n    \"tokenizedCard\": {\n      \"id\": \"47CA8267360FD3EAE063AF598E0A5792\",\n      \"state\": \"ACTIVE\",\n      \"enrollmentId\": \"8e823a4c6cd8299ee84a19346009e901\",\n      \"tokenReferenceId\": \"8009397c2f12e5d741921d5b59837701\",\n      \"number\": \"4323126880354068\",\n      \"expirationMonth\": \"12\",\n      \"expirationYear\": \"2026\",\n      \"type\": \"visa\",\n      \"cryptogram\": \"AwAAAAAAWx6z/7YAAAAAgBcAAAA=\",\n      \"eci\": \"07\",\n      \"requestorId\": \"40010052236\",\n      \"applicationTransactionCounter\": \"12345\",\n      \"card\": {\n        \"suffix\": \"6726\",\n        \"expirationMonth\": \"12\",\n        \"expirationYear\": \"2026\",\n        \"expirationPrinted\": true,\n        \"securityCodePrinted\": true\n      }\n    },\n    \"issuer\": {\n      \"paymentAccountReference\": \"V0010013025198559200843564380\"\n    }\n  }\n```\n</details>\n<details>\n  <summary>Decrypted Payment Credentials for TMS Token with Tokenized Card</summary>\n  \n```json\n{\n    \"_links\": {\n      \"instrumentIdentifier\": {\n        \"href\": \"/tms/v1/instrumentidentifiers/47CA82673608D3EAE063AF598E0A5792\"\n      },\n      \"tokenizedCard\": {\n        \"href\": \"/tms/v2/tokenized-cards/47CA8267360FD3EAE063AF598E0A5792\"\n      }\n    },\n    \"card\": {\n      \"number\": \"462294XXXXXX6726\"\n    },\n    \"tokenizedCard\": {\n      \"id\": \"47CA8267360FD3EAE063AF598E0A5792\",\n      \"state\": \"ACTIVE\",\n      \"enrollmentId\": \"8e823a4c6cd8299ee84a19346009e901\",\n      \"tokenReferenceId\": \"8009397c2f12e5d741921d5b59837701\",\n      \"number\": \"4323126880354068\",\n      \"expirationMonth\": \"12\",\n      \"expirationYear\": \"2026\",\n      \"type\": \"visa\",\n      \"cryptogram\": \"AwAAAAAAUbSN0KoAAAAAgBcAAAA=\",\n      \"eci\": \"07\",\n      \"requestorId\": \"40010052236\",\n      \"applicationTransactionCounter\": \"12345\",\n      \"card\": {\n        \"suffix\": \"6726\",\n        \"expirationMonth\": \"12\",\n        \"expirationYear\": \"2026\",\n        \"expirationPrinted\": true,\n        \"securityCodePrinted\": true\n      }\n    },\n    \"issuer\": {\n      \"paymentAccountReference\": \"V0010013025198559200843564380\"\n    }\n  }\n```\n</details>\n<details>\n  <summary>Decrypted Payment Credentials for TMS Token without Tokenized Card</summary>\n  \n```json\n{\n    \"_links\": {\n      \"paymentInstruments\": {\n        \"href\": \"/tms/v1/paymentinstruments/49133768477C678CE063AF598E0AD7CB\"\n      },\n      \"instrumentIdentifier\": {\n        \"href\": \"/tms/v1/instrumentidentifiers/490DC5B225867B0EE063AF598E0A0174\"\n      }\n    },\n    \"card\": {\n      \"number\": \"462294XXXXXX6791\",\n      \"expirationMonth\": \"12\",\n      \"expirationYear\": \"2030\",\n      \"type\": \"001\"\n    },\n    \"billTo\": {\n      \"firstName\": \"MM\",\n      \"lastName\": \"Doe\",\n      \"company\": \"Visa\",\n      \"address1\": \"1 Market St\",\n      \"locality\": \"san francisco\",\n      \"administrativeArea\": \"CA\",\n      \"postalCode\": \"94105\",\n      \"country\": \"US\",\n      \"email\": \"test@cybs.com\",\n      \"phoneNumber\": \"4158880000\"\n    }\n  }\n```\n</details>\n"
          headers:
            uniqueTransactionID:
              description: A globally unique id associated with your request.
              type: string
            v-c-correlation-id:
              description: The mandatory correlation id passed by upstream (calling) system.
              type: string
          schema:
            type: object
            properties:
              _links:
                type: object
                readOnly: true
                properties:
                  customer:
                    type: object
                    readOnly: true
                    properties:
                      href:
                        type: string
                        readOnly: true
                        description: 'Link to the Customer. Present when requesting payment credentials for a TMS customer token.

                          '
                        example: /tms/v2/customers/47CA82673612D3EAE063AF598E0A5792
                  paymentInstruments:
                    type: object
                    readOnly: true
