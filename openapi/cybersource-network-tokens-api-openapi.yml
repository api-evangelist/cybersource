                        example: /tms/v2/customers/47CA82673612D3EAE063AF598E0A5792/payment-instruments/47CA82673619D3EAE063AF598E0A5792
                  instrumentIdentifier:
                    type: object
                    readOnly: true
                    properties:
                      href:
                        type: string
                        readOnly: true
