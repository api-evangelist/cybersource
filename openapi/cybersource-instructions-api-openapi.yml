  /acp/v1/instructions/{instructionId}/confirmations:
    post:
      tags:
      - Instructions
      summary: Confirm transaction events
      description: Confirm transaction events for a completed purchase. The agent calls this endpoint after the payment has been submitted to notify the Intelligent Commerce Connect of the transaction outcome. The request includes processor information (transaction type, status, approval codes), order details (shipping, tracking, product information), and merchant information. Returns HTTP 202 acknowledging receipt of the confirmation.
      operationId: confirmTransactionEvents
      x-devcenter-metaData:
        categoryTag: Intelligent_Commerce_Connect
        developerGuides: https://developer.cybersource.com/docs/cybs/en-us/intelligent-commerce/developer/all/rest/intelligent-commerce/intelligent-commerce-confirm-trxn-intro.html
        mleForRequest: mandatory
        mleForResponse: mandatory
        disableProcessorDropDown: true
        disableDefaultMerchantCreds: false
        authorizationType:
        - Json Web Token
        overrideMerchantCredential: agentic_mid_091225001
      parameters:
      - name: instructionId
        in: path
        required: true
        type: string
        maxLength: 50
        minLength: 36
        description: Unique identifier for the purchase intent instruction.
      - name: agenticConfirmTransactionEventsRequest
        in: body
        required: true
        schema:
          required:
          - clientCorrelationId
          - paymentInformation
          - confirmationData
          type: object
          properties:
            clientCorrelationId:
              type: string
              pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
              minLength: 0
              maxLength: 255
              description: Client Correlation Id used during the tokenization or during FIDO assertion.
            paymentInformation:
              required:
              - instrumentIdentifier
              type: object
              description: Payment Information data. References the tokenized payment card to use for this transaction. At least one of customer, paymentInstrument, or instrumentIdentifier must be provided. The instrumentIdentifier is the most commonly used reference. If you have a TMS instrument identifier, provide it in instrumentIdentifier.id.
              properties:
                customer:
                  type: object
                  description: Customer data.
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the Customer token used in the transaction.
                      minLength: 1
                      maxLength: 32
                paymentInstrument:
                  type: object
                  description: Payment Instrument data.
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the Payment Instrument token used in the transaction.
                      minLength: 1
                      maxLength: 32
                instrumentIdentifier:
                  required:
                  - id
                  type: object
                  description: Instrument Identifier data.
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the Instrument Identifier token used in the transaction.
                      minLength: 12
                      maxLength: 32
            confirmationData:
              type: array
              description: (Required) Contains Transaction, Order and Payment Confirmation Events.
              items:
                required:
                - clientReferenceInformation
                - processorInformation
                type: object
                properties:
                  clientReferenceInformation:
                    required:
                    - code
                    type: object
                    description: Client reference information.
                    properties:
                      code:
                        type: string
                        pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                        minLength: 0
                        maxLength: 50
                        description: "A distinct identifier for this order/line item. This ID will act as a reference to connect this line item with payment details, \npayment transactions, and confirmation events.\n"
                  orderInformation:
                    type: object
                    properties:
                      orderId:
                        type: string
                        pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                        minLength: 0
                        maxLength: 100
                        description: Unique identifier for the order
                      orderStatus:
                        type: string
                        pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                        minLength: 0
                        maxLength: 50
                        description: Status of the order
                      orderDate:
                        type: string
                        pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                        minLength: 0
                        maxLength: 12
                        description: Order date (UTC time in Epoch format)
                      expectedDeliveryDate:
                        type: string
                        pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                        minLength: 0
                        maxLength: 12
                        description: Expected delivery date for the order (UTC time in Epoch format)
                      amountDetail:
                        required:
                        - currency
