                    description: "Required. Result of the verification.  \nPossible values:  \n  - `01` - Verified\n  - `02` - Not Verified\n  - `03` - Not performed\n  - `04` - Not required\n  - `21` - Not allowed\n"
                  verificationTimestamp:
                    type: string
                    pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.+$
