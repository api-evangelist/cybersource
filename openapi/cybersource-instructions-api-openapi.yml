  /acp/v1/instructions/{instructionId}/credentials:
    post:
      tags:
      - Instructions
      summary: Retrieve payment credentials
      description: Retrieve tokenized payment credentials for a purchase intent to complete the transaction at a merchant. The agent calls this endpoint after a purchase intent has been created and approved, providing transaction-level details including order information, merchant details, payment options, and production information. Returns COMPLETED (HTTP 200) with a signed payload containing encrypted payment credentials (authorization token and JWS-signed payload), or PENDING (HTTP 202) with pendingEvents if additional cardholder authentication is required. The signed payload is used by the merchant's payment processor to complete the transaction.
      operationId: retrievePaymentCredentials
      x-devcenter-metaData:
        categoryTag: Intelligent_Commerce_Connect
        developerGuides: https://developer.cybersource.com/docs/cybs/en-us/intelligent-commerce/developer/all/rest/intelligent-commerce/intelligent-commerce-retrieve-credentials-intro.html
        mleForRequest: mandatory
        mleForResponse: mandatory
        disableProcessorDropDown: true
        disableDefaultMerchantCreds: false
        authorizationType:
        - Json Web Token
        overrideMerchantCredential: agentic_mid_091225001
      parameters:
      - name: instructionId
        in: path
        required: true
        type: string
        maxLength: 50
        minLength: 36
        description: Unique identifier for the purchase intent instruction.
      - name: agenticRetrievePaymentCredentialsRequest
        in: body
        required: true
        schema:
          required:
          - clientCorrelationId
          - paymentInformation
          - transactionData
          type: object
          properties:
            clientCorrelationId:
              type: string
              pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
              minLength: 0
              maxLength: 255
              description: Client Correlation Id used during the tokenization or during FIDO assertion.
            paymentInformation:
              required:
              - instrumentIdentifier
              type: object
              description: Payment Information data. References the tokenized payment card to use for this transaction. At least one of customer, paymentInstrument, or instrumentIdentifier must be provided. The instrumentIdentifier is the most commonly used reference. If you have a TMS instrument identifier, provide it in instrumentIdentifier.id.
              properties:
                customer:
                  type: object
                  description: Customer data.
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the Customer token used in the transaction.
                      minLength: 1
                      maxLength: 32
                paymentInstrument:
                  type: object
                  description: Payment Instrument data.
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the Payment Instrument token used in the transaction.
                      minLength: 1
                      maxLength: 32
                instrumentIdentifier:
                  required:
                  - id
                  type: object
                  description: Instrument Identifier data.
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the Instrument Identifier token used in the transaction.
                      minLength: 12
                      maxLength: 32
            transactionData:
              type: array
              description: List of transaction data.
              items:
                type: object
                required:
                - clientReferenceInformation
                - merchantInformation
                - orderInformation
                properties:
                  clientReferenceInformation:
                    required:
                    - code
                    type: object
                    description: Client reference information.
                    properties:
                      code:
                        type: string
                        pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                        minLength: 0
                        maxLength: 50
                        description: "A distinct identifier for this order/line item. This ID will act as a reference to connect this line item with payment details, \npayment transactions, and confirmation events.\n"
                  mandateReferenceData:
                    type: array
                    description: Mandate Reference Data.
                    items:
                      type: object
                      properties:
                        mandateId:
                          type: string
                          pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                          minLength: 0
                          maxLength: 50
                          description: (Conditional) Unique Mandate identifier associated with the Transaction.
                  type:
                    type: string
                    description: "(Conditional) Type of the transaction. This field is used to determine the type of transaction and the associated processing rules.  \nPossible values:  \n  - `PURCHASE` (Default)\n  - `BILL_PAYMENT`\n  - `MONEY_TRANSFER`\n  - `DISBURSEMENT`\n  - `P2P`\n"
                  orderInformation:
                    required:
                    - amountDetail
                    type: object
                    description: Order information.
                    properties:
                      amountDetail:
                        required:
                        - currency
                        - totalAmount
                        type: object
                        description: Amount Detail data. Breaks down the total transaction amount into components.
                        properties:
                          totalAmount:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                            minLength: 1
                            maxLength: 12
                            description: The final amount that the customer needs to pay or paid.
                          currency:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                            minLength: 3
                            maxLength: 3
                            description: '(Conditional) ISO 4217 currency code. Currency in which the transactionAmount, subTotal, tax, Shipping& handling or discount amount is expressed.

                              Conditionality - Required when either transactionAmount, subTotal, tax, Shipping& handling or discount amount is present.

                              '
                          subTotalAmount:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                            minLength: 1
                            maxLength: 12
                            description: The total transaction amount before any taxes or discounts are applied.
                          discountAmount:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                            minLength: 1
                            maxLength: 12
                            description: The total discount amount applied to the transaction.
                          shippingAmount:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.+$
                            minLength: 1
                            maxLength: 12
                            description: The total shipping and handling cost(amount) applied to the transaction.
                          handlingAmount:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.+$
                            minLength: 1
                            maxLength: 12
                            description: The total shipping and handling cost(amount) applied to the transaction.
                      shipTo:
                        required:
                        - country
                        - countryCallingCode
                        - phoneNumber
                        type: object
                        description: Shipping information.
                        properties:
                          addressId:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                            minLength: 36
                            maxLength: 36
                            description: '(Conditional) Reference identifier of the address Conditionality - Required when address is already registered with VACP System.

                              Optional for requests when address fields are provided.

                              '
                          district:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
