                            description: The final amount that the customer needs to pay or paid.
                          currency:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                            minLength: 3
                            maxLength: 3
                            description: '(Conditional) ISO 4217 currency code. Currency in which the transactionAmount, subTotal, tax, Shipping& handling or discount amount is expressed.

                              Conditionality - Required when either transactionAmount, subTotal, tax, Shipping& handling or discount amount is present.

                              '
                          subTotalAmount:
                            type: string
                            pattern: (?!^[*.,'#_/-]+$)(?!.*\./.*)^.*$
                            minLength: 1
                            maxLength: 12
