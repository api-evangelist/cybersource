apis:
- name: CyberSource Token Management Service (TMS) API
  description: >-
    Securely tokenizes, stores, and manages customer payment credentials and card data. Supports instrument
    identifiers, payment instruments, customer profiles, network tokens, and cryptograms. Reduces PCI
    DSS scope by replacing sensitive card data with non-sensitive tokens and supports stored credentials
    for recurring and one-click payment flows.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.cybersource.com/docs/cybs/en-us/tms/developer/all/rest/tms.html
  baseURL: https://api.cybersource.com
  tags:
  - Tokenization
  - Token Management
  - PCI DSS
  - Stored Credentials
  - Network Tokens
  properties:
  - type: Documentation
    url: https://developer.cybersource.com/docs/cybs/en-us/tms/developer/all/rest/tms.html
  contact:
