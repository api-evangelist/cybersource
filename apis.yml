    url: https://developer.cybersource.com/
    email: ''
- name: CyberSource Decision Manager API
  description: >-
    Provides AI-powered fraud detection and risk management using machine learning models trained on Visa
    and CyberSource transaction data. Offers real-time fraud scoring, custom rules, device fingerprinting,
    account takeover protection, case management, and post-transactional review workflows. Supports list
    management, fraud marking, and hierarchical organization-level rules.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.cybersource.com/docs/cybs/en-us/fraud/developer/all/rest/fraud.html
