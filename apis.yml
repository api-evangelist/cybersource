- aid: cybersource:cybersource-flex-api-api
  name: CyberSource Flex API API
  description: >-
    The Flex API enables merchants to securely accept customer payment information captured within a server-side
    application using a set of APIs.

    These APIs protect your customer's primary account number (PAN), card verification number (CVN), and
    other payment information by embedding it within a transient token.

    This allows payment data to be stored and transported and complies with the Payment Card Industry
    Data Security Standard (PCI DSS) policies and procedures. These transient tokens can be validated
    by the receiver to ensure the data integrity and protect against data injection attacks.


    **Warning:** Flex API is intended for server-side applications only.  Do not use the Flex API in client-side
    applications.  To add secure payments directly into client-side code, use Unified Checkout.


    **How It Works**<br>

    Follow these steps to capture payments using the Flex API:

    * Establish a payment session with a predefined customer context.

    * Validate the JSON Web Token.

    * Populate the JSON Web Token with customer information.


    **Customer Context**<br>

    An important benefit of the Flex API is managing Personal Identifiable Information (PII). You can
    set up your customer context to include all PII associated with transactions, protecting this information
    from third parties.
  humanURL: >-
    https://developer.cybersource.com/docs/cybs/en-us/payments/developer/all/rest/payments.html
  baseURL: https://api.cybersource.com
  tags:
  - Flex API
  properties:
  - type: OpenAPI
    url: openapi/cybersource-flex-api-api-openapi.yml
  - type: Documentation
    url: >-
      https://developer.cybersource.com/docs/cybs/en-us/payments/developer/all/rest/payments.html
